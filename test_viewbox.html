<!DOCTYPE html>
<html>
<body>
  <h3>1. SVG without viewBox (baseline):</h3>
  <svg width="200" height="100" style="border:1px solid red">
    <rect x="10" y="10" width="50" height="50" style="fill: red"/>
  </svg>

  <h3>2. SVG with viewBox="0 0 200 100" (same size):</h3>
  <svg width="200" height="100" viewBox="0 0 200 100" style="border:1px solid green">
    <rect x="10" y="10" width="50" height="50" style="fill: green"/>
  </svg>

  <h3>3. viewBox="0 0 400 200" (zoom out, coordinates halved):</h3>
  <svg width="200" height="100" viewBox="0 0 400 200" style="border:1px solid blue">
    <rect x="20" y="20" width="100" height="100" style="fill: blue"/>
  </svg>

  <h3>4. viewBox with offset "100 50 200 100":</h3>
  <svg width="200" height="100" viewBox="100 50 200 100" style="border:1px solid orange">
    <rect x="0" y="0" width="50" height="50" style="fill: orange"/>
  </svg>
</body>
</html>
