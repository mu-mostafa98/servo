<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset Beach</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        svg {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            background-color: #FF6B35;
        }
    </style>
</head>
<body>

    <svg width="1200" height="800" style="max-width: 1200px; max-height: 800px;">

        <!-- ===== SKY GRADIENT (layered rects) ===== -->
        <rect width="1200" height="550" style="fill: #1B0B2E" />
        <rect y="0" width="1200" height="80" style="fill: #2D1B4E; opacity: 0.6" />
        <rect y="80" width="1200" height="80" style="fill: #4B2D6E; opacity: 0.5" />
        <rect y="160" width="1200" height="80" style="fill: #6B3A7A; opacity: 0.5" />
        <rect y="240" width="1200" height="80" style="fill: #8B4A6A; opacity: 0.5" />
        <rect y="320" width="1200" height="80" style="fill: #B85A5A; opacity: 0.5" />
        <rect y="400" width="1200" height="80" style="fill: #D47A4A; opacity: 0.5" />
        <rect y="480" width="1200" height="70" style="fill: #F5A060; opacity: 0.5" />

        <!-- ===== SUN ===== -->
        <!-- Sun glow -->
        <circle cx="600" cy="380" r="180" style="fill: #FFD700; opacity: 0.08" />
        <circle cx="600" cy="380" r="120" style="fill: #FFD700; opacity: 0.12" />
        <circle cx="600" cy="380" r="80" style="fill: #FFE4B5; opacity: 0.2" />
        <!-- Sun body -->
        <circle cx="600" cy="380" r="55" style="fill: #FF6B35" />
        <circle cx="600" cy="380" r="50" style="fill: #FF8C42" />
        <circle cx="600" cy="380" r="42" style="fill: #FFA75E" />
        <circle cx="600" cy="380" r="35" style="fill: #FFD700" />
        <circle cx="600" cy="380" r="28" style="fill: #FFF3CD" />

        <!-- ===== CLOUDS ===== -->
        <!-- Cloud 1 (left) -->
        <path d="M 80,180 Q 110,150 150,160 Q 180,140 220,155 Q 250,165 240,190 Q 260,210 230,220 L 80,220 Q 50,210 60,190 Q 50,170 80,180 Z" style="fill: #FFA75E; opacity: 0.3" />
        <path d="M 100,190 Q 130,170 160,180 Q 180,165 210,175 Q 230,180 220,195 Q 230,210 210,215 L 100,215 Q 80,210 85,195 Z" style="fill: #FFD700; opacity: 0.2" />

        <!-- Cloud 2 (right) -->
        <path d="M 900,120 Q 930,95 970,105 Q 1000,85 1040,100 Q 1070,110 1060,135 Q 1080,155 1050,165 L 900,165 Q 870,155 880,135 Q 870,115 900,120 Z" style="fill: #FFA75E; opacity: 0.25" />
        <path d="M 920,135 Q 950,115 980,125 Q 1000,110 1030,120 Q 1050,125 1040,140 Q 1055,155 1035,160 L 920,160 Q 895,155 905,140 Z" style="fill: #FFD700; opacity: 0.15" />

        <!-- Cloud 3 (small, high) -->
        <ellipse cx="400" cy="100" rx="70" ry="18" style="fill: #D47A4A; opacity: 0.15" />
        <ellipse cx="370" cy="95" rx="45" ry="14" style="fill: #D47A4A; opacity: 0.12" />
        <ellipse cx="430" cy="105" rx="40" ry="12" style="fill: #D47A4A; opacity: 0.12" />

        <!-- ===== DISTANT MOUNTAINS ===== -->
        <path d="M 0,480 Q 60,440 120,460 T 240,430 T 350,450 T 480,420 T 600,440 T 720,410 T 850,435 T 980,415 T 1100,440 T 1200,430 L 1200,520 L 0,520 Z" style="fill: #3B1F4E; opacity: 0.6" />
        <path d="M 0,490 Q 100,455 200,475 T 400,450 T 600,465 T 800,445 T 1000,460 T 1200,450 L 1200,530 L 0,530 Z" style="fill: #4B2A5E; opacity: 0.5" />

        <!-- ===== OCEAN ===== -->
        <rect y="520" width="1200" height="280" style="fill: #1A3A5C" />

        <!-- Ocean depth layers -->
        <rect y="520" width="1200" height="40" style="fill: #2A5A7C; opacity: 0.5" />
        <rect y="560" width="1200" height="40" style="fill: #1E4A6C; opacity: 0.3" />
        <rect y="600" width="1200" height="30" style="fill: #1A3A5C; opacity: 0.3" />

        <!-- Sun reflection on water -->
        <rect x="500" y="525" width="200" height="6" style="fill: #FFD700; opacity: 0.4" />
        <rect x="520" y="535" width="160" height="5" style="fill: #FFA75E; opacity: 0.35" />
        <rect x="510" y="545" width="180" height="4" style="fill: #FFD700; opacity: 0.25" />
        <rect x="530" y="555" width="140" height="4" style="fill: #FF8C42; opacity: 0.2" />
        <rect x="520" y="565" width="160" height="3" style="fill: #FFD700; opacity: 0.15" />
        <rect x="540" y="575" width="120" height="3" style="fill: #FFA75E; opacity: 0.12" />
        <rect x="530" y="585" width="140" height="2" style="fill: #FFD700; opacity: 0.1" />
        <rect x="545" y="595" width="110" height="2" style="fill: #FF8C42; opacity: 0.08" />

        <!-- ===== WAVES ===== -->
        <!-- Wave set 1 -->
        <path d="M 0,540 Q 30,535 60,540 T 120,540 T 180,540 T 240,540 T 300,540 T 360,540 T 420,540 T 480,540 T 540,540 T 600,540 T 660,540 T 720,540 T 780,540 T 840,540 T 900,540 T 960,540 T 1020,540 T 1080,540 T 1140,540 T 1200,540" style="fill: none; stroke: #4A8AB5; stroke-width: 1.5; opacity: 0.3" />
        <!-- Wave set 2 -->
        <path d="M 0,570 Q 40,565 80,570 T 160,570 T 240,570 T 320,570 T 400,570 T 480,570 T 560,570 T 640,570 T 720,570 T 800,570 T 880,570 T 960,570 T 1040,570 T 1120,570 T 1200,570" style="fill: none; stroke: #4A8AB5; stroke-width: 1; opacity: 0.2" />
        <!-- Wave set 3 -->
        <path d="M 0,610 Q 50,605 100,610 T 200,610 T 300,610 T 400,610 T 500,610 T 600,610 T 700,610 T 800,610 T 900,610 T 1000,610 T 1100,610 T 1200,610" style="fill: none; stroke: #4A8AB5; stroke-width: 1.2; opacity: 0.2" />

        <!-- ===== SAILBOATS ===== -->
        <!-- Sailboat 1 -->
        <path d="M 780,555 L 790,555 L 793,565 L 777,565 Z" style="fill: #2A1A0E" />
        <polygon points="785,535 785,555 810,555" style="fill: #fff; opacity: 0.8" />
        <polygon points="782,538 782,555 765,555" style="fill: #fff; opacity: 0.6" />
        <line x1="785" y1="555" x2="785" y2="530" style="stroke: #2A1A0E; stroke-width: 1.5" />

        <!-- Sailboat 2 (smaller, far) -->
        <path d="M 350,540 L 356,540 L 358,546 L 348,546 Z" style="fill: #2A1A0E" />
        <polygon points="353,528 353,540 370,540" style="fill: #fff; opacity: 0.6" />
        <polygon points="351,530 351,540 340,540" style="fill: #fff; opacity: 0.4" />
        <line x1="353" y1="540" x2="353" y2="525" style="stroke: #2A1A0E; stroke-width: 1" />

        <!-- ===== ISLAND ===== -->
        <!-- Sandy beach -->
        <ellipse cx="200" cy="620" rx="160" ry="40" style="fill: #E8C878" />
        <!-- Island hill -->
        <ellipse cx="200" cy="600" rx="120" ry="30" style="fill: #8B6B3A" />
        <!-- Grass top -->
        <ellipse cx="200" cy="590" rx="90" ry="20" style="fill: #4A8B3A" />
        <ellipse cx="200" cy="585" rx="70" ry="14" style="fill: #5A9B4A" />

        <!-- Palm tree -->
        <!-- Trunk (curved) -->
        <path d="M 200,585 Q 195,550 210,520 Q 215,505 225,495" style="fill: none; stroke: #5C4033; stroke-width: 6; stroke-linecap: round" />
        <!-- Fronds -->
        <path d="M 225,495 Q 195,480 170,500" style="fill: none; stroke: #2E7D32; stroke-width: 4; stroke-linecap: round" />
        <path d="M 225,495 Q 195,470 180,480" style="fill: none; stroke: #388E3C; stroke-width: 3; stroke-linecap: round" />
        <path d="M 225,495 Q 220,460 240,470" style="fill: none; stroke: #2E7D32; stroke-width: 4; stroke-linecap: round" />
        <path d="M 225,495 Q 240,475 260,490" style="fill: none; stroke: #388E3C; stroke-width: 3; stroke-linecap: round" />
        <path d="M 225,495 Q 250,465 265,475" style="fill: none; stroke: #2E7D32; stroke-width: 3; stroke-linecap: round" />
        <path d="M 225,495 Q 210,460 200,470" style="fill: none; stroke: #43A047; stroke-width: 3; stroke-linecap: round" />
        <!-- Coconuts -->
        <circle cx="222" cy="497" r="4" style="fill: #5C4033" />
        <circle cx="228" cy="498" r="3.5" style="fill: #4A2F1E" />

        <!-- ===== ROCKS ===== -->
        <!-- Rock cluster -->
        <ellipse cx="80" cy="640" rx="35" ry="20" style="fill: #5A5A5A" />
        <ellipse cx="95" cy="645" rx="25" ry="15" style="fill: #6A6A6A" />
        <ellipse cx="65" cy="650" rx="18" ry="12" style="fill: #4A4A4A" />

        <ellipse cx="1020" cy="660" rx="40" ry="22" style="fill: #5A5A5A" />
        <ellipse cx="1040" cy="665" rx="25" ry="16" style="fill: #6A6A6A" />
        <ellipse cx="1005" cy="670" rx="20" ry="12" style="fill: #4A4A4A" />

        <!-- ===== FISH SHAPES (polylines) ===== -->
        <polyline points="110,700 120,695 130,700 120,705" style="fill: none; stroke: #FF8C42; stroke-width: 2; opacity: 0.5; stroke-linecap: round" />
        <polyline points="115,710 122,706 130,710 122,714" style="fill: none; stroke: #FFD700; stroke-width: 1.5; opacity: 0.4; stroke-linecap: round" />
        <polyline points="105,720 113,716 120,720 113,724" style="fill: none; stroke: #FF6B35; stroke-width: 2; opacity: 0.3; stroke-linecap: round" />

        <!-- ===== DOLPHIN (path) ===== -->
        <path d="M 880,700 Q 890,685 900,690 Q 910,695 920,688 Q 930,680 940,690 Q 945,698 940,705 Q 935,710 925,705 Q 915,698 905,705 Q 895,712 885,705 Z" style="fill: #5A7A9A; opacity: 0.5" />
        <path d="M 890,700 Q 895,693 900,696 Q 905,698 910,694 Q 918,688 925,695" style="fill: none; stroke: #7A9ABA; stroke-width: 1; opacity: 0.4" />

        <!-- ===== SEAGULLS ===== -->
        <polyline points="280,260 290,250 300,260" style="fill: none; stroke: #1A1A2E; stroke-width: 2; stroke-linecap: round" />
        <polyline points="300,240 308,232 316,240" style="fill: none; stroke: #1A1A2E; stroke-width: 2; stroke-linecap: round" />
        <polyline points="260,245 266,238 272,245" style="fill: none; stroke: #1A1A2E; stroke-width: 1.5; stroke-linecap: round" />

        <polyline points="850,200 858,192 866,200" style="fill: none; stroke: #1A1A2E; stroke-width: 2; stroke-linecap: round" />
        <polyline points="870,180 876,174 882,180" style="fill: none; stroke: #1A1A2E; stroke-width: 1.5; stroke-linecap: round" />

        <!-- ===== LIGHTHOUSE ===== -->
        <!-- Base -->
        <polygon points="930,580 960,580 955,635 935,635" style="fill: #E8E0D0" />
        <!-- Stripes -->
        <polygon points="933,595 957,595 956,605 934,605" style="fill: #C0392B" />
        <polygon points="933,615 957,615 956,625 934,625" style="fill: #C0392B" />
        <!-- Top -->
        <rect x="938" y="565" width="14" height="15" style="fill: #2A2A2A" />
        <!-- Light -->
        <rect x="940" y="567" width="10" height="11" style="fill: #FFD700" />
        <!-- Light beam -->
        <polygon points="945,573 1030,540 1040,570" style="fill: #FFD700; opacity: 0.15" />
        <polygon points="945,573 900,530 890,560" style="fill: #FFD700; opacity: 0.1" />
        <!-- Roof -->
        <polygon points="935,565 955,565 945,555" style="fill: #C0392B" />

        <!-- ===== SHORE ===== -->
        <path d="M 0,650 Q 150,640 200,660 T 400,680 T 550,670 T 700,680 Q 800,670 900,680 T 1050,670 T 1200,680 L 1200,800 L 0,800 Z" style="fill: #D4B87A" />
        <!-- Sand texture -->
        <path d="M 0,660 Q 200,650 400,670 T 700,675 T 1000,670 T 1200,680" style="fill: none; stroke: #C4A86A; stroke-width: 1.5; opacity: 0.4" />

        <!-- ===== PALM TREE 2 (right beach) ===== -->
        <path d="M 1100,670 Q 1090,630 1080,590 Q 1075,570 1070,555" style="fill: none; stroke: #5C4033; stroke-width: 5; stroke-linecap: round" />
        <path d="M 1070,555 Q 1040,540 1020,555" style="fill: none; stroke: #2E7D32; stroke-width: 3; stroke-linecap: round" />
        <path d="M 1070,555 Q 1050,530 1065,540" style="fill: none; stroke: #388E3C; stroke-width: 3; stroke-linecap: round" />
        <path d="M 1070,555 Q 1080,530 1095,545" style="fill: none; stroke: #2E7D32; stroke-width: 3; stroke-linecap: round" />
        <path d="M 1070,555 Q 1100,540 1115,555" style="fill: none; stroke: #388E3C; stroke-width: 3; stroke-linecap: round" />
        <path d="M 1070,555 Q 1095,525 1105,540" style="fill: none; stroke: #2E7D32; stroke-width: 3; stroke-linecap: round" />

        <!-- ===== STARFISH (polygon) ===== -->
        <polygon points="160,740 165,730 175,730 168,722 170,710 160,718 150,710 152,722 145,730 155,730" style="fill: #FF6B35; opacity: 0.7" />

        <!-- ===== SHELL (ellipses) ===== -->
        <ellipse cx="140" cy="760" rx="8" ry="12" style="fill: #F5E6D0" />
        <ellipse cx="140" cy="760" rx="6" ry="10" style="fill: #E8D5B8" />
        <line x1="135" y1="758" x2="145" y2="758" style="stroke: #D4B87A; stroke-width: 0.5" />
        <line x1="136" y1="762" x2="144" y2="762" style="stroke: #D4B87A; stroke-width: 0.5" />

    </svg>

</body>
</html>
