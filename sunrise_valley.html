<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Valley</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e8d5b8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        svg {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            background-color: #4A6FA5;
        }
    </style>
</head>
<body>

    <svg width="1200" height="800" style="max-width: 1200px; max-height: 800px;">

        <!-- ===== SKY GRADIENT ===== -->
        <rect width="1200" height="800" style="fill: #4A6FA5" />
        <rect y="0" width="1200" height="100" style="fill: #3A5A8A; opacity: 0.5" />
        <rect y="100" width="1200" height="80" style="fill: #5A7AA5; opacity: 0.4" />
        <rect y="180" width="1200" height="80" style="fill: #7A9AC5; opacity: 0.3" />
        <rect y="260" width="1200" height="80" style="fill: #9ABAE5; opacity: 0.3" />
        <rect y="340" width="1200" height="80" style="fill: #B5D0F0; opacity: 0.2" />
        <rect y="420" width="1200" height="80" style="fill: #D4E8FF; opacity: 0.2" />

        <!-- ===== SUNRISE ===== -->
        <!-- Sun glow -->
        <circle cx="600" cy="480" r="200" style="fill: #FFD700; opacity: 0.06" />
        <circle cx="600" cy="480" r="140" style="fill: #FFE4B5; opacity: 0.1" />
        <circle cx="600" cy="480" r="90" style="fill: #FF8C42; opacity: 0.15" />
        <circle cx="600" cy="480" r="60" style="fill: #FF6B35; opacity: 0.2" />
        <!-- Sun rising -->
        <circle cx="600" cy="490" r="45" style="fill: #FF8C42" />
        <circle cx="600" cy="490" r="38" style="fill: #FFA75E" />
        <circle cx="600" cy="490" r="30" style="fill: #FFD700" />
        <circle cx="600" cy="490" r="22" style="fill: #FFF3CD" />

        <!-- ===== CLOUDS WITH GOLDEN EDGES ===== -->
        <!-- Cloud 1 -->
        <path d="M 120,200 Q 150,170 190,180 Q 220,160 260,175 Q 290,180 280,205 Q 300,225 270,235 L 120,235 Q 90,225 100,205 Q 90,185 120,200 Z" style="fill: #D4A070; opacity: 0.4" />
        <path d="M 130,215 Q 160,195 190,205 Q 210,190 240,200 Q 260,205 250,220 Q 265,235 245,240 L 130,240 Q 110,235 115,220 Z" style="fill: #FFB880; opacity: 0.3" />

        <!-- Cloud 2 -->
        <path d="M 850,160 Q 880,130 920,140 Q 950,120 990,135 Q 1020,145 1010,170 Q 1030,190 1000,200 L 850,200 Q 820,190 830,170 Q 820,150 850,160 Z" style="fill: #D4A070; opacity: 0.35" />
        <path d="M 870,175 Q 900,155 930,165 Q 950,150 980,160 Q 1000,165 990,180 Q 1005,195 985,200 L 870,200 Q 850,195 855,180 Z" style="fill: #FFB880; opacity: 0.25" />

        <!-- Cloud 3 (wispy, high) -->
        <ellipse cx="400" cy="120" rx="80" ry="15" style="fill: #E8C8A0; opacity: 0.2" />
        <ellipse cx="370" cy="115" rx="50" ry="12" style="fill: #E8C8A0; opacity: 0.15" />
        <ellipse cx="430" cy="125" rx="45" ry="10" style="fill: #E8C8A0; opacity: 0.15" />

        <!-- ===== MIST LAYERS ===== -->
        <rect x="0" y="380" width="1200" height="40" style="fill: #D4E8FF; opacity: 0.08" />
        <rect x="0" y="420" width="1200" height="30" style="fill: #E8F0FF; opacity: 0.1" />

        <!-- ===== FAR MOUNTAINS ===== -->
        <path d="M 0,480 Q 80,430 160,460 T 320,420 T 480,450 T 640,410 T 800,440 T 960,420 T 1100,450 L 1200,440 L 1200,550 L 0,550 Z" style="fill: #7A9ABA; opacity: 0.5" />

        <!-- ===== MID MOUNTAINS ===== -->
        <path d="M 0,510 Q 100,450 200,480 T 400,440 T 600,470 T 800,430 T 1000,460 T 1200,450 L 1200,580 L 0,580 Z" style="fill: #5A8A7A; opacity: 0.6" />

        <!-- ===== FOREGROUND MOUNTAINS ===== -->
        <polygon points="-50,580 100,460 250,500 400,440 550,490 700,430 850,480 1000,450 1150,500 1250,470 1250,650 -50,650" style="fill: #4A7A6A" />
        <!-- Light side (facing sun) -->
        <polygon points="-50,580 100,460 250,500 400,440 550,490 700,430 850,480 1000,450 1150,500 1250,470 1250,530 -50,530" style="fill: #5A9A7A; opacity: 0.3" />

        <!-- ===== VALLEY FLOOR ===== -->
        <path d="M -50,600 Q 150,560 300,580 T 600,560 T 900,580 T 1250,570 L 1250,800 L -50,800 Z" style="fill: #3A6A4A" />

        <!-- ===== MORNING MIST OVER VALLEY ===== -->
        <rect x="0" y="570" width="1200" height="30" style="fill: #D4E8FF; opacity: 0.08" />
        <rect x="200" y="580" width="300" height="20" style="fill: #E8F0FF; opacity: 0.06" />
        <rect x="700" y="575" width="250" height="15" style="fill: #E8F0FF; opacity: 0.05" />

        <!-- ===== LAKE ===== -->
        <path d="M 350,600 Q 400,590 500,595 Q 650,600 700,595 Q 750,590 800,605 Q 750,620 650,615 Q 500,620 400,615 Q 350,610 350,600 Z" style="fill: #6A9AC5" />
        <!-- Lake shallow edge -->
        <path d="M 370,605 Q 450,595 550,600 Q 650,605 720,600 Q 680,610 580,612 Q 480,612 380,608 Z" style="fill: #8AB5D5; opacity: 0.4" />

        <!-- Sun reflection on lake (horizontal) -->
        <rect x="520" y="598" width="160" height="3" style="fill: #FFD700; opacity: 0.4" />
        <rect x="540" y="604" width="120" height="2" style="fill: #FFA75E; opacity: 0.3" />
        <rect x="530" y="609" width="140" height="2" style="fill: #FFD700; opacity: 0.2" />
        <rect x="555" y="613" width="90" height="2" style="fill: #FF8C42; opacity: 0.15" />

        <!-- ===== DOCK / PIER ===== -->
        <rect x="460" y="610" width="8" height="30" style="fill: #5C4033" />
        <rect x="470" y="610" width="8" height="30" style="fill: #5C4033" />
        <rect x="455" y="608" width="28" height="4" style="fill: #6A4A33" />
        <rect x="455" y="615" width="28" height="4" style="fill: #6A4A33" />
        <rect x="455" y="622" width="28" height="4" style="fill: #6A4A33" />

        <!-- ===== FENCE (around valley) ===== -->
        <!-- Fence posts -->
        <line x1="750" y1="620" x2="750" y2="630" style="stroke: #5C4033; stroke-width: 3" />
        <line x1="790" y1="625" x2="790" y2="635" style="stroke: #5C4033; stroke-width: 3" />
        <line x1="830" y1="630" x2="830" y2="640" style="stroke: #5C4033; stroke-width: 3" />
        <line x1="870" y1="635" x2="870" y2="645" style="stroke: #5C4033; stroke-width: 3" />
        <!-- Fence rails -->
        <line x1="745" y1="622" x2="875" y2="637" style="stroke: #5C4033; stroke-width: 2" />
        <line x1="745" y1="628" x2="875" y2="643" style="stroke: #5C4033; stroke-width: 2" />

        <!-- ===== COTTAGE ===== -->
        <!-- Cottage body -->
        <rect x="770" y="630" width="50" height="40" style="fill: #E8D5B8" />
        <!-- Cottage roof -->
        <polygon points="765,630 795,605 825,630" style="fill: #8B4513" />
        <!-- Door -->
        <rect x="790" y="647" width="12" height="23" style="fill: #5C4033" />
        <!-- Window -->
        <rect x="778" y="642" width="8" height="8" style="fill: #6A9AC5; stroke: #5C4033; stroke-width: 1" />
        <!-- Window cross -->
        <line x1="782" y1="642" x2="782" y2="650" style="stroke: #5C4033; stroke-width: 0.5" />
        <line x1="778" y1="646" x2="786" y2="646" style="stroke: #5C4033; stroke-width: 0.5" />
        <!-- Chimney -->
        <rect x="805" y="612" width="8" height="15" style="fill: #8B4513" />
        <!-- Smoke -->
        <circle cx="809" cy="607" r="3" style="fill: #fff; opacity: 0.3" />
        <circle cx="812" cy="600" r="4" style="fill: #fff; opacity: 0.2" />
        <circle cx="808" cy="592" r="5" style="fill: #fff; opacity: 0.15" />

        <!-- ===== TREE CLUSTER (LEFT) ===== -->
        <!-- Tree 1 -->
        <rect x="180" y="620" width="10" height="100" style="fill: #5C4033" />
        <circle cx="185" cy="600" r="30" style="fill: #4CAF50" />
        <circle cx="170" cy="585" r="22" style="fill: #66BB6A" />
        <circle cx="200" cy="590" r="25" style="fill: #43A047" />
        <circle cx="185" cy="575" r="20" style="fill: #388E3C" />

        <!-- Tree 2 -->
        <rect x="240" y="630" width="8" height="80" style="fill: #5C4033" />
        <circle cx="244" cy="615" r="25" style="fill: #4CAF50" />
        <circle cx="232" cy="602" r="18" style="fill: #66BB6A" />
        <circle cx="256" cy="608" r="20" style="fill: #43A047" />
        <circle cx="244" cy="595" r="16" style="fill: #388E3C" />

        <!-- ===== BIG OAK TREE (CENTER-RIGHT) ===== -->
        <!-- Trunk -->
        <rect x="640" y="590" width="20" height="130" style="fill: #5C4033" />
        <path d="M 640,640 Q 620,650 610,670" style="fill: none; stroke: #5C4033; stroke-width: 6; stroke-linecap: round" />
        <path d="M 660,620 Q 680,630 690,650" style="fill: none; stroke: #5C4033; stroke-width: 5; stroke-linecap: round" />
        <!-- Branches -->
        <line x1="648" y1="620" x2="620" y2="590" style="stroke: #5C4033; stroke-width: 5; stroke-linecap: round" />
        <line x1="652" y1="610" x2="690" y2="575" style="stroke: #5C4033; stroke-width: 4; stroke-linecap: round" />
        <line x1="645" y1="600" x2="600" y2="565" style="stroke: #5C4033; stroke-width: 3; stroke-linecap: round" />
        <!-- Canopy -->
        <circle cx="620" cy="550" r="45" style="fill: #4CAF50" />
        <circle cx="680" cy="545" r="40" style="fill: #4CAF50" />
        <circle cx="650" cy="520" r="35" style="fill: #66BB6A" />
        <circle cx="600" cy="570" r="30" style="fill: #43A047" />
        <circle cx="690" cy="570" r="28" style="fill: #43A047" />
        <circle cx="650" cy="540" r="50" style="fill: #66BB6A; opacity: 0.4" />

        <!-- Swing on the tree -->
        <line x1="685" y1="575" x2="685" y2="610" style="stroke: #8B7355; stroke-width: 1.5" />
        <line x1="695" y1="575" x2="695" y2="610" style="stroke: #8B7355; stroke-width: 1.5" />
        <rect x="682" y="610" width="16" height="3" style="fill: #8B7355" />

        <!-- ===== FLOWER MEADOW ===== -->
        <!-- Red poppies -->
        <circle cx="300" cy="700" r="5" style="fill: #E53935" />
        <circle cx="298" cy="698" r="3" style="fill: #D32F2F" />
        <line x1="300" y1="705" x2="300" y2="720" style="stroke: #4CAF50; stroke-width: 1.5" />
        <circle cx="320" cy="720" r="4" style="fill: #E53935" />
        <line x1="320" y1="724" x2="320" y2="738" style="stroke: #4CAF50; stroke-width: 1.5" />
        <circle cx="280" cy="730" r="4.5" style="fill: #E53935" />
        <line x1="280" y1="734" x2="280" y2="748" style="stroke: #4CAF50; stroke-width: 1.5" />

        <!-- Yellow wildflowers -->
        <circle cx="340" cy="690" r="3" style="fill: #FFD700" />
        <line x1="340" y1="693" x2="340" y2="705" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="360" cy="710" r="3.5" style="fill: #FFD700" />
        <line x1="360" y1="713" x2="360" y2="726" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="350" cy="735" r="3" style="fill: #FFD700" />
        <line x1="350" y1="738" x2="350" y2="750" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="330" cy="745" r="2.5" style="fill: #FFD700" />
        <line x1="330" y1="747" x2="330" y2="758" style="stroke: #4CAF50; stroke-width: 1" />

        <!-- Purple flowers -->
        <circle cx="380" cy="700" r="3" style="fill: #9C27B0" />
        <line x1="380" y1="703" x2="380" y2="715" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="370" cy="725" r="2.5" style="fill: #9C27B0" />
        <line x1="370" y1="727" x2="370" y2="738" style="stroke: #4CAF50; stroke-width: 1" />

        <!-- White daisies -->
        <circle cx="420" cy="715" r="3" style="fill: #fff" />
        <line x1="420" y1="718" x2="420" y2="730" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="440" cy="735" r="3.5" style="fill: #fff" />
        <line x1="440" y1="738" x2="440" y2="750" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="410" cy="745" r="2.5" style="fill: #fff" />
        <line x1="410" y1="747" x2="410" y2="758" style="stroke: #4CAF50; stroke-width: 1" />

        <!-- More flowers spread across meadow -->
        <circle cx="500" cy="680" r="3" style="fill: #E53935" />
        <line x1="500" y1="683" x2="500" y2="695" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="520" cy="705" r="2.5" style="fill: #FFD700" />
        <line x1="520" y1="707" x2="520" y2="718" style="stroke: #4CAF50; stroke-width: 1" />
        <circle cx="540" cy="690" r="3" style="fill: #9C27B0" />
        <line x1="540" y1="693" x2="540" y2="705" style="stroke: #4CAF50; stroke-width: 1" />

        <!-- ===== BUTTERFLIES ===== -->
        <!-- Butterfly 1 -->
        <ellipse cx="310" cy="660" rx="4" ry="2.5" style="fill: #FF6B35; opacity: 0.7; transform: rotate(-20, 310, 660)" />
        <ellipse cx="316" cy="660" rx="4" ry="2.5" style="fill: #FF8C42; opacity: 0.7; transform: rotate(20, 316, 660)" />
        <ellipse cx="313" cy="662" rx="1.5" ry="3" style="fill: #2A1A0E; opacity: 0.5" />

        <!-- Butterfly 2 -->
        <ellipse cx="550" cy="650" rx="3.5" ry="2" style="fill: #9C27B0; opacity: 0.6; transform: rotate(-15, 550, 650)" />
        <ellipse cx="555" cy="650" rx="3.5" ry="2" style="fill: #AB47BC; opacity: 0.6; transform: rotate(15, 555, 650)" />
        <ellipse cx="552.5" cy="652" rx="1" ry="2.5" style="fill: #2A1A0E; opacity: 0.4" />

        <!-- ===== BIRDS ===== -->
        <polyline points="200,280 208,272 216,280" style="fill: none; stroke: #2A1A0E; stroke-width: 2; stroke-linecap: round" />
        <polyline points="230,265 236,258 242,265" style="fill: none; stroke: #2A1A0E; stroke-width: 1.5; stroke-linecap: round" />
        <polyline points="180,295 185,289 190,295" style="fill: none; stroke: #2A1A0E; stroke-width: 1.5; stroke-linecap: round" />

        <polyline points="880,240 886,234 892,240" style="fill: none; stroke: #2A1A0E; stroke-width: 2; stroke-linecap: round" />
        <polyline points="900,225 905,219 910,225" style="fill: none; stroke: #2A1A0E; stroke-width: 1.5; stroke-linecap: round" />

        <!-- ===== DEER (silhouette) ===== -->
        <!-- Body -->
        <path d="M 150,730 Q 165,710 180,720 Q 190,725 195,735 Q 195,745 180,745 Q 160,745 150,740 Z" style="fill: #2A1A0E; opacity: 0.7" />
        <!-- Neck -->
        <path d="M 155,725 Q 155,710 158,700 Q 160,695 162,700 Q 164,710 165,725" style="fill: #2A1A0E; opacity: 0.7" />
        <!-- Head -->
        <ellipse cx="160" cy="695" rx="6" ry="4" style="fill: #2A1A0E; opacity: 0.7" />
        <!-- Antlers -->
        <path d="M 158,693 Q 155,683 148,678" style="fill: none; stroke: #2A1A0E; stroke-width: 1.5; opacity: 0.7; stroke-linecap: round" />
        <path d="M 155,685 Q 160,680 163,675" style="fill: none; stroke: #2A1A0E; stroke-width: 1.5; opacity: 0.7; stroke-linecap: round" />
        <!-- Legs -->
        <line x1="160" y1="740" x2="158" y2="755" style="stroke: #2A1A0E; stroke-width: 2; stroke-linecap: round; opacity: 0.7" />
        <line x1="170" y1="742" x2="168" y2="758" style="stroke: #2A1A0E; stroke-width: 2; stroke-linecap: round; opacity: 0.7" />
        <line x1="180" y1="742" x2="178" y2="758" style="stroke: #2A1A0E; stroke-width: 2; stroke-linecap: round; opacity: 0.7" />
        <line x1="188" y1="740" x2="190" y2="756" style="stroke: #2A1A0E; stroke-width: 2; stroke-linecap: round; opacity: 0.7" />

        <!-- ===== BENCH ===== -->
        <rect x="550" y="640" width="30" height="4" style="fill: #6A4A33" />
        <rect x="552" y="644" width="2" height="10" style="fill: #5C4033" />
        <rect x="576" y="644" width="2" height="10" style="fill: #5C4033" />
        <rect x="548" y="630" width="34" height="3" style="fill: #7A5A43" />

        <!-- ===== GRASS TEXTURE ===== -->
        <line x1="50" y1="780" x2="53" y2="765" style="stroke: #4CAF50; stroke-width: 1.5; opacity: 0.4" />
        <line x1="60" y1="785" x2="63" y2="770" style="stroke: #66BB6A; stroke-width: 1; opacity: 0.3" />
        <line x1="220" y1="780" x2="222" y2="768" style="stroke: #4CAF50; stroke-width: 1.5; opacity: 0.4" />
        <line x1="450" y1="785" x2="453" y2="770" style="stroke: #66BB6A; stroke-width: 1; opacity: 0.3" />
        <line x1="580" y1="780" x2="582" y2="766" style="stroke: #4CAF50; stroke-width: 1.5; opacity: 0.4" />
        <line x1="920" y1="785" x2="923" y2="770" style="stroke: #66BB6A; stroke-width: 1; opacity: 0.3" />
        <line x1="1050" y1="780" x2="1053" y2="765" style="stroke: #4CAF50; stroke-width: 1.5; opacity: 0.4" />

        <!-- ===== PATH/WINDING ROAD ===== -->
        <path d="M 600,800 Q 620,750 640,710 Q 660,670 660,650 Q 660,630 640,620" style="fill: none; stroke: #D4B87A; stroke-width: 15; opacity: 0.5" />
        <path d="M 600,800 Q 620,750 640,710 Q 660,670 660,650 Q 660,630 640,620" style="fill: none; stroke: #C4A86A; stroke-width: 8; opacity: 0.3" />

        <!-- ===== SUN RAYS (golden beams) ===== -->
        <line x1="600" y1="490" x2="50" y2="300" style="stroke: #FFD700; stroke-width: 4; opacity: 0.04" />
        <line x1="600" y1="490" x2="150" y2="350" style="stroke: #FFD700; stroke-width: 3; opacity: 0.06" />
        <line x1="600" y1="490" x2="300" y2="500" style="stroke: #FFD700; stroke-width: 5; opacity: 0.05" />
        <line x1="600" y1="490" x2="800" y2="700" style="stroke: #FFD700; stroke-width: 4; opacity: 0.06" />
        <line x1="600" y1="490" x2="1000" y2="500" style="stroke: #FFD700; stroke-width: 3; opacity: 0.05" />
        <line x1="600" y1="490" x2="1150" y2="350" style="stroke: #FFD700; stroke-width: 5; opacity: 0.04" />

    </svg>

</body>
</html>
