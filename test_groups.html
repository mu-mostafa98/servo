<!DOCTYPE html>
<html>
<body>
  <h3>Group with translate:</h3>
  <svg width="300" height="150" style="border:1px solid red">
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="60" height="50" style="fill: #e74c3c"/>
      <circle cx="30" cy="25" r="12" style="fill: #fff"/>
    </g>
  </svg>

  <h3>Nested groups:</h3>
  <svg width="300" height="150" style="border:1px solid blue">
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="50" height="50" style="fill: #3498db"/>
      <g transform="translate(70, 10) rotate(30)">
        <rect x="0" y="0" width="40" height="40" style="fill: #2ecc71"/>
      </g>
    </g>
  </svg>
</body>
</html>
