<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1a1a2e; color: #ccc; font-family: monospace; padding: 20px; }
  svg { background: #16213e; display: block; margin: 20px 0; border: 1px solid #333; }
  .key { color: #4af; }
  .val { color: #f90; }
</style>
</head>
<body>
<h2>SVG 2 Spec: Geometry attributes are CSS presentation attributes</h2>

<p>Per SVG 2 §8.4: <code class="key">x</code>, <code class="key">y</code>, <code class="key">width</code>, <code class="key">height</code>, <code class="key">rx</code>, <code class="key">ry</code> on <code>&lt;rect&gt;</code> are <b>presentation attributes = CSS properties</b>.</p>
<p>➡ CSS <code>style=""</code> should <b>win over</b> DOM attributes.</p>

<svg width="600" height="320" xmlns="http://www.w3.org/2000/svg">

  <!-- ======================== TEST 1: x ======================== -->
  <text x="10" y="30" fill="#888">— Test 1: style="x: 50px" vs x="100" —</text>

  <!-- Reference: attribute only -->
  <text x="10" y="60" fill="#666">Reference (attr only): x="100"</text>
  <rect x="100" y="70" width="100" height="40" fill="#4af" opacity="0.7"/>

  <!-- Test: CSS x=50 should override attr x=100 -->
  <text x="10" y="140" fill="#666">Test: style="x: 50px" x="100"</text>
  <rect style="x: 50px" x="100" y="150" width="100" height="40" fill="#f44" opacity="0.9"/>

  <!-- CSS wins  → red rect at x=50 (disjoint from blue, to the left)
       attr wins → red rect at x=100 (overlapping blue) -->

  <!-- ======================== TEST 2: rx/ry ======================== -->
  <text x="320" y="60" fill="#888">— Test 2: style="rx: 30px" vs rx="0" —</text>
  <text x="320" y="80" fill="#666">Reference (attr only): rx="0"</text>
  <rect x="320" y="90" width="80" height="80" rx="0" fill="#4af" opacity="0.7"/>
  <text x="320" y="200" fill="#666">Test: style="rx: 30px" rx="0"</text>
  <rect style="rx: 30px" x="320" y="210" width="80" height="80" rx="0" fill="#f44" opacity="0.9"/>

  <!-- CSS wins → rounded corners  |  attr wins → sharp corners -->

  <text x="10" y="290" fill="#888" font-size="12">
    Results:  Red rect at x=50? → CSS wins (correct).  Red rect at x=100? → attr wins (BUG).
  </text>
  <text x="10" y="310" fill="#888" font-size="12">
    Red rect rounded? → CSS rx wins (correct).  Red rect sharp? → attr rx wins (BUG).
  </text>
</svg>

</body>
</html>
