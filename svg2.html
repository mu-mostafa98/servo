<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Morning Landscape</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1528;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        svg {
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            background-color: #0f2342;
            width: 100%;
            height: auto;
            max-width: 1200px;
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="shadow-layer" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#071324" flood-opacity="0.4"/>
            </filter>
            <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="-5" dy="8" stdDeviation="5" flood-color="#0c2014" flood-opacity="0.5"/>
            </filter>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="15" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#1a365d" />
                <stop offset="40%" stop-color="#2b6cb0" />
                <stop offset="70%" stop-color="#4299e1" />
                <stop offset="85%" stop-color="#fbd38d" />
                <stop offset="100%" stop-color="#feeb8c" />
            </linearGradient>

            <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="20%" stop-color="#fff5f5" />
                <stop offset="50%" stop-color="#ffeb3b" />
                <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#4a5568" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9"/>
            </linearGradient>

            <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#234e52" />
                <stop offset="100%" stop-color="#e6fffa" />
            </linearGradient>

            <linearGradient id="mountainClose" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#1c3d27" />
                <stop offset="100%" stop-color="#b2f5ea" />
            </linearGradient>

            <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#319795" />
                <stop offset="50%" stop-color="#4c51bf" />
                <stop offset="100%" stop-color="#2b6cb0" />
            </linearGradient>

            <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>

            <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#2f855a" />
                <stop offset="100%" stop-color="#1a202c" />
            </linearGradient>
            
            <linearGradient id="hillLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#276749" />
                <stop offset="100%" stop-color="#111827" />
            </linearGradient>
        </defs>

        <rect width="1200" height="800" fill="url(#skyGrad)" />

        <circle cx="850" cy="280" r="250" fill="url(#sunGrad)" opacity="0.4" />
        <circle cx="850" cy="280" r="90" fill="url(#sunGrad)" opacity="0.8" />
        <circle cx="850" cy="280" r="35" fill="#ffffff" filter="url(#glow)" />

        <g opacity="0.12">
            <polygon points="850,280 -100,200 -100,350" fill="#fff" />
            <polygon points="850,280 -100,500 -100,700" fill="#fff" />
            <polygon points="850,280 200,800 500,800" fill="#fff" />
            <polygon points="850,280 0,0 300,0" fill="#fff" />
        </g>

        <g fill="#ffffff" opacity="0.35">
            <ellipse cx="200" cy="120" rx="120" ry="20" />
            <ellipse cx="250" cy="110" rx="80" ry="25" />
            <ellipse cx="140" cy="130" rx="60" ry="15" />
            <ellipse cx="1000" cy="150" rx="160" ry="25" />
            <ellipse cx="940" cy="135" rx="90" ry="30" />
        </g>

        <g fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round" opacity="0.6">
            <path d="M 300,180 Q 310,170 320,180 Q 330,170 340,180" />
            <path d="M 335,160 Q 342,152 350,160 Q 358,152 366,160" stroke-width="1.5"/>
            <path d="M 280,195 Q 287,187 295,195 Q 303,187 311,195" stroke-width="1.5"/>
            <path d="M 370,185 Q 375,178 380,185 Q 385,178 390,185" stroke-width="1"/>
            <path d="M 350,205 Q 354,200 358,205 Q 362,200 366,205" stroke-width="1"/>
        </g>

        <path d="M -50,500 Q 100,320 280,410 T 650,350 T 950,300 T 1250,360 L 1250,600 L -50,600 Z" fill="url(#mountainFar)" />
        <rect x="0" y="420" width="1200" height="80" fill="url(#shimmerGrad)" opacity="0.25" />

        <path d="M -50,530 Q 150,390 350,460 T 750,380 T 1150,420 T 1250,410 L 1250,650 L -50,650 Z" fill="url(#mountainMid)" filter="url(#shadow-layer)" />

        <path d="M -50,570 L 120,460 L 290,520 L 480,430 L 620,490 L 630,500 L 710,470 L 900,530 L 1100,450 L 1250,510 L 1250,700 L -50,700 Z" fill="url(#mountainClose)" filter="url(#shadow-layer)" />

        <path d="M 622,492 L 624,560 L 638,560 L 632,490 Z" fill="#ebf8ff" opacity="0.9" />
        <path d="M 620,555 Q 630,565 640,555 L 650,630 Q 610,640 580,630 Z" fill="url(#riverGrad)" filter="url(#soft-shadow)" />
        <ellipse cx="630" cy="558" rx="12" ry="5" fill="#ffffff" filter="url(#glow)" opacity="0.8"/>

        <path d="M 550,620 Q 700,560 900,580 T 1250,550 L 1250,750 L 550,750 Z" fill="#14351f" filter="url(#shadow-layer)" />

        <g fill="#0b2214">
            <polygon points="700,570 690,540 710,540" /><polygon points="700,545 693,520 707,520" />
            <polygon points="720,580 710,545 730,545" /><polygon points="720,550 713,525 727,525" />
            <polygon points="740,575 732,545 748,545" />
            <polygon points="850,585 835,530 865,530" /><polygon points="850,540 840,500 860,500" />
            <polygon points="880,590 865,540 895,540" /><polygon points="880,550 870,510 890,510" />
            <polygon points="920,585 905,535 935,535" />
            <polygon points="1050,560 1035,510 1065,510" /><polygon points="1050,520 1040,480 1060,480" />
            <polygon points="1100,565 1085,515 1115,515" />
        </g>

        <path d="M 610,600 C 560,610 500,640 460,680 C 400,740 320,730 200,850 L 420,850 C 500,770 580,770 620,720 C 660,670 650,620 610,600 Z" fill="url(#riverGrad)" />
        
        <path d="M 590,610 C 550,620 500,650 465,685 C 430,720 370,740 300,810 L 320,810 C 380,750 440,730 480,695 C 520,660 565,630 600,618 Z" fill="url(#shimmerGrad)" opacity="0.4" />
        <path d="M 400,735 Q 430,730 470,750" fill="none" stroke="#fff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
        <path d="M 250,795 Q 290,790 320,810" fill="none" stroke="#fff" stroke-width="3" opacity="0.2" stroke-linecap="round"/>

        <path d="M -50,680 Q 150,620 400,670 T 600,750 L 500,850 L -50,850 Z" fill="url(#hillLeftGrad)" filter="url(#shadow-layer)" />
        <path d="M 550,730 Q 700,700 900,710 T 1250,680 L 1250,850 L 550,850 Z" fill="url(#hillGrad)" filter="url(#shadow-layer)" />

        <polygon points="210,675 320,685 300,710 190,690" fill="#09140e" opacity="0.6" filter="url(#soft-shadow)" />

        <g transform="translate(-40, -10)">
            <rect x="295" y="600" width="16" height="35" fill="#5c2d16" />
            <rect x="292" y="595" width="22" height="6" fill="#3d1d0e" />
            <g opacity="0.2" filter="url(#glow)">
                <circle cx="305" cy="580" r="8" fill="#fff" />
                <circle cx="315" cy="560" r="14" fill="#fff" />
                <circle cx="330" cy="535" r="22" fill="#fff" />
            </g>
            <rect x="220" y="620" width="100" height="70" fill="#a0522d" />
            <polygon points="320,620 360,635 360,690 320,690" fill="#7c3f20" /> <polygon points="205,620 270,575 335,620" fill="#8b0000" />
            <polygon points="335,620 270,575 310,565 375,610 360,635 320,620" fill="#660000" /> <rect x="255" y="645" width="25" height="45" fill="#3d1d0e" />
            <circle cx="273" cy="668" r="2" fill="#d4af37" /> <rect x="230" y="640" width="18" height="22" fill="#ffdf00" filter="url(#soft-shadow)" rx="2" />
            <line x1="239" y1="640" x2="239" y2="662" stroke="#3d1d0e" stroke-width="1.5" />
            <line x1="230" y1="651" x2="248" y2="651" stroke="#3d1d0e" stroke-width="1.5" />

            <rect x="290" y="640" width="18" height="22" fill="#ffdf00" filter="url(#soft-shadow)" rx="2" />
            <line x1="299" y1="640" x2="299" y2="662" stroke="#3d1d0e" stroke-width="1.5" />
            <line x1="290" y1="651" x2="308" y2="651" stroke="#3d1d0e" stroke-width="1.5" />
            
            <polygon points="332,642 348,648 348,664 332,658" fill="#d4af37" opacity="0.8"/>
        </g>

        <g stroke="#4a2711" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M 320,695 Q 360,710 410,715" />
            <path d="M 321,705 Q 361,720 411,725" />
            <line x1="330" y1="690" x2="330" y2="715" />
            <line x1="355" y1="698" x2="355" y2="723" />
            <line x1="380" y1="705" x2="380" y2="731" />
            <line x1="405" y1="710" x2="405" y2="738" />
        </g>

        <ellipse cx="90" cy="770" rx="35" ry="12" fill="#050d08" opacity="0.7" filter="url(#soft-shadow)" />
        <g filter="url(#soft-shadow)">
            <path d="M 75,770 C 80,700 70,630 85,550 C 95,550 100,580 105,640 C 120,620 140,600 160,590 C 140,615 125,640 112,665 C 120,700 110,740 115,770 Z" fill="#2d1910" />
            <path d="M 85,570 C 65,540 45,530 20,535 C 40,545 60,560 77,585 Z" fill="#2d1910" />
            <path d="M 75,765 Q 50,785 30,790 Q 55,775 75,770" fill="#2d1910" />
            <path d="M 115,765 Q 140,780 165,795 Q 135,775 115,765" fill="#2d1910" />
        </g>
        <g filter="url(#soft-shadow)">
            <circle cx="40" cy="520" r="55" fill="#134e13" />
            <circle cx="100" cy="490" r="65" fill="#0f420f" />
            <circle cx="160" cy="530" r="50" fill="#134e13" />
            <circle cx="90" cy="440" r="55" fill="#195419" />
            <circle cx="50" cy="510" r="45" fill="#1e7b1e" />
            <circle cx="100" cy="480" r="55" fill="#1c741c" />
            <circle cx="150" cy="520" r="40" fill="#1e7b1e" />
            <circle cx="90" cy="435" r="45" fill="#258625" />
            <circle cx="65" cy="490" r="35" fill="#38a169" />
            <circle cx="115" cy="460" r="40" fill="#48bb78" />
            <circle cx="105" cy="420" r="30" fill="#68d391" opacity="0.9" />
            <circle cx="155" cy="500" r="25" fill="#38a169" />
        </g>

        <g filter="url(#soft-shadow)" transform="translate(40,0)">
            <ellipse cx="900" cy="765" rx="40" ry="10" fill="#050d08" opacity="0.6" filter="url(#soft-shadow)"/>
            <ellipse cx="960" cy="785" rx="50" ry="12" fill="#050d08" opacity="0.6" filter="url(#soft-shadow)"/>
            
            <rect x="893" y="650" width="14" height="110" fill="#1f110a" />
            <polygon points="900,560 850,630 950,630" fill="#0f3019" />
            <polygon points="900,520 860,580 940,580" fill="#143f22" />
            <polygon points="900,480 870,535 930,535" fill="#19542c" />
            <polygon points="900,450 880,500 920,500" fill="#22703a" />

            <rect x="952" y="620" width="18" height="160" fill="#1f110a" />
            <polygon points="961,500 890,590 1032,590" fill="#0a2413" />
            <polygon points="961,450 905,535 1017,535" fill="#0f331a" />
            <polygon points="961,400 915,480 1007,480" fill="#144222" />
            <polygon points="961,350 925,430 997,430" fill="#1a542b" />
            <polygon points="961,310 935,380 987,380" fill="#25753e" />
            <polygon points="961,280 945,330 977,330" fill="#38a169" />
        </g>

        <g stroke="#1c3d27" stroke-width="2" fill="none">
            <path d="M 440,700 Q 435,670 430,650" /><circle cx="430" cy="650" r="2" fill="#4a2711" />
            <path d="M 445,705 Q 442,665 440,645" /><circle cx="440" cy="645" r="2" fill="#4a2711" />
            <path d="M 452,710 Q 455,680 458,655" /><circle cx="458" cy="655" r="2" fill="#4a2711" />
            <path d="M 435,702 Q 420,680 410,675" stroke-width="1.5"/>
            <path d="M 450,708 Q 470,685 480,682" stroke-width="1.5"/>
        </g>
        
        <g fill="#e53e3e" filter="url(#glow)">
            <circle cx="180" cy="760" r="4" /><circle cx="185" cy="764" r="3" /><circle cx="172" cy="770" r="4.5" />
            <circle cx="210" cy="780" r="4" /><circle cx="222" cy="775" r="3.5" />
        </g>
        <g fill="#ecc94b" filter="url(#glow)">
            <circle cx="720" cy="760" r="4" /><circle cx="735" cy="752" r="3" /><circle cx="710" cy="775" r="4" />
            <circle cx="810" cy="780" r="5" /><circle cx="830" cy="765" r="3.5" /><circle cx="795" cy="790" r="4" />
        </g>
        <g stroke="#2f855a" stroke-width="2" opacity="0.7">
            <path d="M 50,800 L 45,760 M 55,800 L 58,765 M 120,800 L 125,770" />
            <path d="M 620,770 L 624,740 M 630,775 L 627,745 M 670,800 L 665,765" />
            <path d="M 1050,800 L 1055,750 M 1062,800 L 1058,755 M 1120,790 L 1124,750" />
        </g>

        <rect x="0" y="520" width="1200" height="120" fill="url(#shimmerGrad)" opacity="0.08" pointer-events="none" />
    </svg>

</body>
</html>
