<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 950" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow-tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2c3e50"/></marker>
    <marker id="arrow-dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e67e22"/></marker>
    <filter id="shadow-sm"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.15"/></filter>
    <filter id="shadow-bg"><feDropShadow dx="1.5" dy="1.5" stdDeviation="2.5" flood-opacity="0.12"/></filter>
    <filter id="glow-red"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-opacity="0.25" flood-color="#e74c3c"/></filter>
  </defs>

  <!-- Title -->
  <text x="575" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">External / Third-Party — SVG Library Dependencies</text>
  <text x="575" y="48" text-anchor="middle" font-size="11" fill="#7f8c8d">Third-party crates used by Servo for SVG parsing, rasterization, fonts, and rendering</text>

  <!-- ============================================================ -->
  <!-- Package: resvg / usvg -->
  <!-- ============================================================ -->
  <rect x="30" y="65" width="540" height="430" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5" opacity="0.3" filter="url(#shadow-bg)"/>
  <text x="300" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">Crate: resvg / usvg (v0.45+)</text>
  <text x="300" y="100" text-anchor="middle" font-size="9" fill="#555">SVG parsing and rasterization — REPLACE candidate in proposed architecture</text>

  <!-- usvg::Tree -->
  <rect x="50" y="120" width="440" height="175" rx="4" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="120" width="440" height="22" rx="4" fill="#e67e22"/>
  <rect x="50" y="138" width="440" height="4" fill="#e67e22"/>
  <text x="270" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">usvg::Tree</text>
  <text x="50" y="152" font-size="9" fill="#7f8c8d">  Parsed SVG document — the central SVG data structure</text>
  <text x="60" y="168" font-size="10" font-weight="bold" fill="#2c3e50">Key Methods:</text>
  <text x="60" y="183" font-size="9" fill="#555">Tree::from_data(bytes, &amp;Options) → Result&lt;Tree, Error&gt;</text>
  <text x="60" y="195" font-size="9" fill="#555">  — parses SVG XML into a tree of usvg nodes</text>
  <text x="60" y="210" font-size="9" fill="#555">root() → NodeRef  —  access root node</text>
  <text x="60" y="222" font-size="9" fill="#555">size() → Size  —  natural dimensions (from viewBox/width/height)</text>
  <text x="60" y="234" font-size="9" fill="#555">linear_gradients() → &amp;LinearGradientList</text>
  <text x="60" y="246" font-size="9" fill="#555">radial_gradients() → &amp;RadialGradientList</text>
  <text x="60" y="258" font-size="9" fill="#555">patterns() → &amp;PatternList</text>
  <line x1="60" y1="266" x2="480" y2="266" stroke="#ddd" stroke-width="0.5"/>
  <text x="60" y="280" font-size="10" font-weight="bold" fill="#2c3e50">Servo Integration:</text>
  <text x="60" y="295" font-size="9" fill="#555">Wrapped in VectorImageData { svg_tree: Arc&lt;Tree&gt; }</text>

  <!-- usvg::Node -->
  <rect x="50" y="320" width="200" height="95" rx="4" fill="#fff" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="50" y="320" width="200" height="22" rx="4" fill="#f0b27a"/>
  <rect x="50" y="338" width="200" height="4" fill="#f0b27a"/>
  <text x="150" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4c1a">usvg::Node</text>
  <text x="60" y="355" font-size="9" fill="#555">Node in SVG document tree</text>
  <text x="60" y="370" font-size="9" fill="#555">id() → &amp;str</text>
  <text x="60" y="382" font-size="9" fill="#555">children() → Children</text>
  <text x="60" y="394" font-size="9" fill="#555">is_invisible() → bool</text>

  <!-- usvg::Group -->
  <rect x="275" y="320" width="200" height="95" rx="4" fill="#fff" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="275" y="320" width="200" height="22" rx="4" fill="#f0b27a"/>
  <rect x="275" y="338" width="200" height="4" fill="#f0b27a"/>
  <text x="375" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4c1a">usvg::Group</text>
  <text x="285" y="355" font-size="9" fill="#555">SVG &lt;g&gt; element equivalent</text>
  <text x="285" y="370" font-size="9" fill="#555">id(), children(), filters()</text>
  <text x="285" y="382" font-size="9" fill="#555">clip_path() → Option&lt;ClipPath&gt;</text>
  <text x="285" y="394" font-size="9" fill="#555">transform() → Transform</text>

  <!-- usvg::Path -->
  <rect x="50" y="435" width="200" height="55" rx="4" fill="#fff" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="50" y="435" width="200" height="22" rx="4" fill="#f0b27a"/>
  <rect x="50" y="453" width="200" height="4" fill="#f0b27a"/>
  <text x="150" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4c1a">usvg::Path</text>
  <text x="60" y="470" font-size="9" fill="#555">SVG path data + fill/stroke</text>

  <!-- usvg::ClipPath -->
  <rect x="275" y="435" width="200" height="55" rx="4" fill="#fff" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="275" y="435" width="200" height="22" rx="4" fill="#f0b27a"/>
  <rect x="275" y="453" width="200" height="4" fill="#f0b27a"/>
  <text x="375" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4c1a">usvg::ClipPath</text>
  <text x="285" y="470" font-size="9" fill="#555">SVG clip-path definition</text>

  <!-- ============================================================ -->
  <!-- Package: tiny_skia -->
  <!-- ============================================================ -->
  <rect x="590" y="65" width="530" height="430" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" opacity="0.3" filter="url(#shadow-bg)"/>
  <text x="855" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e44ad">Crate: tiny_skia + fontdb + resvg::render</text>

  <!-- tiny_skia::Pixmap -->
  <rect x="610" y="120" width="440" height="155" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="610" y="120" width="440" height="22" rx="4" fill="#8e44ad"/>
  <rect x="610" y="138" width="440" height="4" fill="#8e44ad"/>
  <text x="830" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">tiny_skia::Pixmap</text>
  <text x="610" y="152" font-size="9" fill="#7f8c8d">  CPU pixel buffer — rasterization target for resvg</text>
  <text x="620" y="168" font-size="10" font-weight="bold" fill="#2c3e50">Key Methods:</text>
  <text x="620" y="183" font-size="9" fill="#555">Pixmap::new(width, height) → Option&lt;Pixmap&gt;</text>
  <text x="620" y="195" font-size="9" fill="#555">  — allocates pixel buffer (RGBA, 4 bytes per pixel)</text>
  <text x="620" y="210" font-size="9" fill="#555">as_mut() → &amp;mut [u8]  —  exposes pixel data for rendering</text>
  <text x="620" y="222" font-size="9" fill="#555">take() → Vec&lt;u8&gt;  —  consumes pixmap, returns raw bytes</text>
  <text x="620" y="234" font-size="9" fill="#555">width() / height() → u32</text>
  <line x1="620" y1="242" x2="1040" y2="242" stroke="#ddd" stroke-width="0.5"/>
  <text x="620" y="256" font-size="10" font-weight="bold" fill="#c0392b">Safety Limit:</text>
  <text x="620" y="270" font-size="9" fill="#555">MAX_SVG_PIXMAP_DIMENSION = 5000px  (max 5000×5000 = ~95MB)</text>

  <!-- resvg::render -->
  <rect x="610" y="300" width="440" height="90" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="610" y="300" width="440" height="22" rx="4" fill="#d2b4de"/>
  <rect x="610" y="318" width="440" height="4" fill="#d2b4de"/>
  <text x="830" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c3483">resvg::render()</text>
  <text x="620" y="335" font-size="10" font-weight="bold" fill="#2c3e50">Signature:</text>
  <text x="620" y="350" font-size="9" fill="#555">resvg::render(tree: &amp;usvg::Tree, transform: &amp;Transform, pixmap: &amp;mut Pixmap)</text>
  <text x="620" y="365" font-size="9" fill="#555">  — Renders the SVG tree into the pixmap at the specified transform</text>

  <!-- fontdb::Database -->
  <rect x="610" y="410" width="440" height="80" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="610" y="410" width="440" height="22" rx="4" fill="#d2b4de"/>
  <rect x="610" y="428" width="440" height="4" fill="#d2b4de"/>
  <text x="830" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c3483">fontdb::Database</text>
  <text x="620" y="445" font-size="10" font-weight="bold" fill="#2c3e50">Purpose:</text>
  <text x="620" y="460" font-size="9" fill="#555">Shared font database — loaded once per process, shared across all ImageCache instances</text>
  <text x="620" y="475" font-size="9" fill="#555">faces() → iterator of FaceInfo (family, style, source)</text>

  <!-- ============================================================ -->
  <!-- Package: pixels + WebRender -->
  <!-- ============================================================ -->
  <rect x="30" y="520" width="540" height="200" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5" opacity="0.3" filter="url(#shadow-bg)"/>
  <text x="300" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">Crate: pixels (Servo-owned) + WebRender</text>

  <!-- RasterImage -->
  <rect x="50" y="560" width="460" height="140" rx="4" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="560" width="460" height="22" rx="4" fill="#2980b9"/>
  <rect x="50" y="578" width="460" height="4" fill="#2980b9"/>
  <text x="280" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">RasterImage</text>
  <text x="50" y="592" font-size="9" fill="#7f8c8d">  components/pixels/lib.rs:299-309</text>
  <text x="60" y="608" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="60" y="623" font-size="9" fill="#555">metadata: ImageMetadata  —  width, height</text>
  <text x="60" y="635" font-size="9" fill="#555">format: PixelFormat  —  BGRA8 or RGBA8</text>
  <text x="60" y="647" font-size="9" fill="#555">id: Option&lt;ImageKey&gt;  —  WebRender image key (assigned later)</text>
  <text x="60" y="659" font-size="9" fill="#555">bytes: Arc&lt;Vec&lt;u8&gt;&gt;  —  raw RGBA pixel data</text>
  <text x="60" y="671" font-size="9" fill="#555">frames: Vec&lt;ImageFrame&gt;  —  animated frame support</text>
  <text x="60" y="683" font-size="9" fill="#555">cors_status: CorsStatus, is_opaque: bool</text>

  <!-- ============================================================ -->
  <!-- Boundary marker -->
  <!-- ============================================================ -->
  <rect x="30" y="740" width="1090" height="80" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="2" filter="url(#glow-red)"/>
  <text x="575" y="762" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Third-Party Boundary — Replace in Native SVG Architecture</text>
  <text x="575" y="782" text-anchor="middle" font-size="10" fill="#555">Current: usvg::Tree → tiny_skia::Pixmap → resvg::render → CPU rasterized bitmap</text>
  <text x="575" y="798" text-anchor="middle" font-size="10" fill="#555">Proposed: Native SVG display items (PushPath, PushText, PushGroup) → GPU vector rendering</text>

  <!-- ============================================================ -->
  <!-- Dependencies arrows -->
  <!-- ============================================================ -->
  <line x1="250" y1="295" x2="150" y2="320" stroke="#e67e22" stroke-width="1" marker-end="url(#arrow-tri)"/>
  <text x="190" y="312" font-size="8" fill="#e67e22">root()</text>
  <line x1="250" y1="295" x2="375" y2="320" stroke="#e67e22" stroke-width="1" marker-end="url(#arrow-tri)"/>
  <text x="300" y="312" font-size="8" fill="#e67e22">contains</text>

  <!-- Legend -->
  <rect x="30" y="840" width="1090" height="1" fill="#ccc"/>
  <text x="50" y="860" font-size="11" font-weight="bold" fill="#2c3e50">MallocSizeOf Implementations (components/malloc_size_of/lib.rs)</text>
  <rect x="50" y="872" width="500" height="60" rx="3" fill="#f4f6f7" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="888" font-size="9" fill="#555">usvg::Tree      — measures root node + gradients + patterns</text>
  <text x="60" y="900" font-size="9" fill="#555">usvg::Node      — measures id + sub-tree size</text>
  <text x="60" y="912" font-size="9" fill="#555">usvg::Group     — measures id + children + filters + clip paths</text>
  <text x="60" y="924" font-size="9" fill="#555">usvg::Path      — measures id + data + fill + stroke</text>
</svg>
