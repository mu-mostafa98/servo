<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow-tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2c3e50"/></marker>
    <marker id="arrow-inh" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="10" markerHeight="7" orient="auto"><path d="M0,0 L14,5 L0,10 L4,5 Z" fill="#2980b9"/></marker>
    <filter id="shadow-sm"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.15"/></filter>
    <filter id="shadow-bg"><feDropShadow dx="1.5" dy="1.5" stdDeviation="2.5" flood-opacity="0.12"/></filter>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Script DOM — SVG Element Class Hierarchy</text>
  <text x="550" y="48" text-anchor="middle" font-size="11" fill="#7f8c8d">components/script/dom/svg/ — DOM-side SVG element classes and element creation dispatch</text>

  <!-- ============================================================ -->
  <!-- Package: Script DOM -->
  <!-- ============================================================ -->
  <rect x="30" y="60" width="1040" height="860" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5" opacity="0.35" filter="url(#shadow-bg)"/>
  <text x="550" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">Package: Script DOM (script::dom::svg)</text>
  <text x="550" y="95" text-anchor="middle" font-size="9" fill="#555">File: components/script/dom/svg/</text>

  <!-- ============================================================ -->
  <!-- Class: SVGElement (base) -->
  <!-- ============================================================ -->
  <rect x="320" y="120" width="370" height="78" rx="4" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow-sm)"/>
  <!-- Header -->
  <rect x="320" y="120" width="370" height="22" rx="4" fill="#2980b9"/>
  <rect x="320" y="138" width="370" height="4" fill="#2980b9"/>
  <text x="505" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SVGElement</text>
  <text x="320" y="150" font-size="9" fill="#7f8c8d">  svgelement.rs</text>
  <!-- Fields -->
  <text x="330" y="165" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="330" y="180" font-size="9" fill="#555">element: Element</text>
  <text x="330" y="192" font-size="9" fill="#555">style_decl: MutNullableDom&lt;CSSStyleDeclaration&gt;</text>

  <!-- ============================================================ -->
  <!-- Class: SVGGraphicsElement -->
  <!-- ============================================================ -->
  <rect x="320" y="240" width="370" height="62" rx="4" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="320" y="240" width="370" height="22" rx="4" fill="#5499c7"/>
  <rect x="320" y="258" width="370" height="4" fill="#5499c7"/>
  <text x="505" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SVGGraphicsElement</text>
  <text x="320" y="270" font-size="9" fill="#7f8c8d">  svggraphicselement.rs</text>
  <text x="330" y="285" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="330" y="298" font-size="9" fill="#555">svgelement: SVGElement</text>

  <!-- ============================================================ -->
  <!-- Class: SVGSVGElement -->
  <!-- ============================================================ -->
  <rect x="50" y="350" width="480" height="240" rx="4" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="350" width="480" height="22" rx="4" fill="#1a5276"/>
  <rect x="50" y="368" width="480" height="4" fill="#1a5276"/>
  <text x="290" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SVGSVGElement</text>
  <text x="50" y="382" font-size="9" fill="#7f8c8d">  svgsvgelement.rs</text>
  <text x="60" y="397" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="60" y="412" font-size="9" fill="#555">svggraphicselement: SVGGraphicsElement</text>
  <text x="60" y="424" font-size="9" fill="#555">uuid: String  —  unique ID for cache mapping</text>
  <text x="60" y="436" font-size="9" fill="#555">cached_serialized_data_url: DomRefCell&lt;Option&lt;Result&lt;ServoUrl, ()&gt;&gt;&gt;</text>
  <line x1="60" y1="444" x2="520" y2="444" stroke="#ddd" stroke-width="0.5"/>
  <text x="60" y="458" font-size="10" font-weight="bold" fill="#2c3e50">Key Methods:</text>
  <text x="60" y="473" font-size="9" fill="#555">serialize_and_cache_subtree()  —  XML serialize → base64 → data URL</text>
  <text x="60" y="485" font-size="9" fill="#555">process_use_elements(cx)  —  resolve &lt;use&gt; references before serialization</text>
  <text x="60" y="497" font-size="9" fill="#555">cleanup_cloned_nodes(cx, cloned_nodes)</text>
  <text x="60" y="509" font-size="9" fill="#555">invalidate_cached_serialized_subtree()  —  set cached_serialized_data_url = None</text>
  <line x1="60" y1="517" line="520" y2="517" stroke="#ddd" stroke-width="0.5"/>
  <text x="60" y="531" font-size="10" font-weight="bold" fill="#2c3e50">LayoutDom Method:</text>
  <text x="60" y="546" font-size="9" fill="#555">data() → SVGElementData  —  exports uuid + attributes for layout thread</text>
  <text x="60" y="558" font-size="9" fill="#555">VirtualMethods: attribute_mutated, children_changed, unbind_from_tree</text>
  <text x="60" y="570" font-size="9" fill="#555">  → all trigger invalidate_cached_serialized_subtree()</text>

  <!-- ============================================================ -->
  <!-- Class: SVGImageElement -->
  <!-- ============================================================ -->
  <rect x="580" y="350" width="470" height="170" rx="4" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="580" y="350" width="470" height="22" rx="4" fill="#1a5276"/>
  <rect x="580" y="368" width="470" height="4" fill="#1a5276"/>
  <text x="815" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SVGImageElement</text>
  <text x="580" y="382" font-size="9" fill="#7f8c8d">  svgimageelement.rs</text>
  <text x="590" y="397" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="590" y="412" font-size="9" fill="#555">svggraphicselement: SVGGraphicsElement</text>
  <line x1="590" y1="420" x2="1040" y2="420" stroke="#ddd" stroke-width="0.5"/>
  <text x="590" y="434" font-size="10" font-weight="bold" fill="#2c3e50">Key Methods:</text>
  <text x="590" y="449" font-size="9" fill="#555">new_inherited(local_name, prefix, document) → SVGImageElement</text>
  <text x="590" y="461" font-size="9" fill="#555">new(cx, local_name, prefix, document, proto) → DomRoot&lt;SVGImageElement&gt;</text>
  <text x="590" y="473" font-size="9" fill="#555">fetch_image_resource()  —  queues error event (TODO: implement)</text>
  <text x="590" y="485" font-size="9" fill="#555">parse_plain_attribute(name, value)  —  width→u32, height→u32</text>
  <line x1="590" y1="493" x2="1040" y2="493" stroke="#ddd" stroke-width="0.5"/>
  <text x="590" y="507" font-size="10" font-weight="bold" fill="#2c3e50">Constants:</text>
  <text x="590" y="517" font-size="9" fill="#555">DEFAULT_WIDTH: u32 = 300, DEFAULT_HEIGHT: u32 = 150</text>

  <!-- ============================================================ -->
  <!-- Class: Element (external reference) -->
  <!-- ============================================================ -->
  <rect x="50" y="120" width="220" height="50" rx="4" fill="#f4f6f7" stroke="#95a5a6" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="50" y="120" width="220" height="22" rx="4" fill="#95a5a6"/>
  <rect x="50" y="138" width="220" height="4" fill="#95a5a6"/>
  <text x="160" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Element (stylo)</text>
  <text x="60" y="158" font-size="9" fill="#555">from ::stylo_dom / script::dom::element</text>

  <!-- ============================================================ -->
  <!-- Function: create_svg_element -->
  <!-- ============================================================ -->
  <rect x="320" y="650" width="470" height="100" rx="4" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="320" y="650" width="470" height="22" rx="4" fill="#f39c12"/>
  <rect x="320" y="668" width="470" height="4" fill="#f39c12"/>
  <text x="555" y="665" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">create_svg_element() — Element Dispatch</text>
  <text x="555" y="680" font-size="9" fill="#7f8c8d">  create.rs:96-117</text>
  <text x="330" y="696" font-size="10" font-weight="bold" fill="#2c3e50">Dispatch logic:</text>
  <text x="330" y="712" font-size="9" fill="#555">local_name!("svg")    → SVGSVGElement::new()</text>
  <text x="330" y="726" font-size="9" fill="#555">local_name!("image")  → SVGImageElement::new()</text>
  <text x="330" y="740" font-size="9" fill="#555">_ (any other)          → SVGElement::new()  (generic SVG element)</text>

  <!-- Inheritance arrows (open triangle) -->
  <!-- Element → SVGElement -->
  <line x1="270" y1="155" x2="320" y2="165" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-inh)"/>
  <!-- SVGElement → SVGGraphicsElement -->
  <line x1="505" y1="198" x2="505" y2="240" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-inh)"/>
  <!-- SVGGraphicsElement → SVGSVGElement -->
  <line x1="420" y1="302" x2="290" y2="350" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-inh)"/>
  <!-- SVGGraphicsElement → SVGImageElement -->
  <line x1="590" y1="302" x2="815" y2="350" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-inh)"/>

  <!-- ============================================================ -->
  <!-- Cross-reference notes -->
  <!-- ============================================================ -->
  <rect x="50" y="780" width="1000" height="120" rx="5" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="1"/>
  <text x="550" y="800" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Key Design Notes</text>

  <text x="70" y="822" font-size="10" font-weight="bold" fill="#2980b9">DOM hierarchy mirrors SVG spec:</text>
  <text x="70" y="838" font-size="9" fill="#555">Element → SVGElement → SVGGraphicsElement → SVGSVGElement | SVGImageElement</text>
  <text x="70" y="854" font-size="9" fill="#555">SVGElement adds: CSSStyleDeclaration (style attr), Focus/Blur, Nonce, global event handlers</text>

  <text x="70" y="878" font-size="10" font-weight="bold" fill="#c0392b">Serialization lifecycle:</text>
  <text x="70" y="894" font-size="9" fill="#555">First layout → source=None → queue_svg_element() → Script serializes → dirty() → Second layout → data URL available</text>

  <!-- Legend -->
  <rect x="30" y="910" width="1040" height="1" fill="#ccc"/>
  <line x1="50" y1="927" x2="100" y2="927" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-inh)"/>
  <text x="110" y="930" font-size="9" fill="#555">Inheritance (open triangle)</text>
  <line x1="350" y1="927" x2="400" y2="927" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrow-tri)"/>
  <text x="410" y="930" font-size="9" fill="#555">Association / Dependency</text>
</svg>
