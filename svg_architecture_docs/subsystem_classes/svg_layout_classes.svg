  <text x="60" y="767" font-size="9" fill="#555">pending_images: Mutex&lt;Vec&lt;PendingImage&gt;&gt;  —  in-progress image loads</text>
  <text x="60" y="779" font-size="9" fill="#e74c3c">pending_svg_elements_for_serialization: Mutex&lt;Vec&lt;UntrustedNodeAddress&gt;&gt;</text>
  <text x="60" y="791" font-size="9" fill="#e74c3c">pending_rasterization_images: Mutex&lt;Vec&lt;PendingRasterizationImage&gt;&gt;</text>
  <text x="60" y="803" font-size="9" fill="#555">resolved_images_cache: Arc&lt;RwLock&lt;HashMap&lt;ServoUrl, CachedImageOrError&gt;&gt;&gt;</text>
  <text x="60" y="815" font-size="9" fill="#555">animating_images: Arc&lt;RwLock&lt;AnimatingImages&gt;&gt;</text>
  <line x1="60" y1="823" x2="550" y2="823" stroke="#ddd" stroke-width="0.5"/>
  <text x="60" y="838" font-size="10" font-weight="bold" fill="#2c3e50">Key SVG Methods:</text>
  <text x="60" y="853" font-size="9" fill="#555">get_cached_image_for_url(node, url, dest) → Result&lt;CachedImage&gt;</text>
  <text x="60" y="865" font-size="9" fill="#e74c3c">rasterize_vector_image(id, size, node, svg_id) → Option&lt;RasterImage&gt;</text>
  <text x="60" y="877" font-size="9" fill="#e74c3c">queue_svg_element_for_serialization(element)</text>
  <text x="60" y="889" font-size="9" fill="#555">get_or_request_image_or_meta(node, url, dest) → LayoutImageCacheResult</text>

