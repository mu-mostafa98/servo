  <text x="235" y="505" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ImageFragment</text>
  <text x="50" y="522" font-size="9" fill="#7f8c8d">  fragment_tree/fragment.rs:86-92</text>
  <text x="60" y="538" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="60" y="553" font-size="9" fill="#555">base: BaseFragment  —  shared fragment state (rect, style, tag)</text>
  <text x="60" y="565" font-size="9" fill="#555">clip: PhysicalRect&lt;Au&gt;  —  clipping rect for object-fit</text>
  <text x="60" y="577" font-size="9" fill="#555">image_key: Option&lt;ImageKey&gt;  —  WebRender image key</text>
  <text x="60" y="589" font-size="9" fill="#555">showing_broken_image_icon: bool</text>
  <text x="60" y="601" font-size="9" fill="#555">url: Option&lt;ServoUrl&gt;  —  source URL for LCP tracking</text>
  <line x1="60" y1="609" x2="410" y2="609" stroke="#ddd" stroke-width="0.5"/>
  <text x="60" y="624" font-size="10" font-weight="bold" fill="#2c3e50">Used for:</text>
  <text x="60" y="639" font-size="9" fill="#555">Both raster images AND SVG (after rasterization)</text>

