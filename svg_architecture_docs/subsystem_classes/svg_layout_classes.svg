  <!-- Title -->
  <text x="640" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">Layout — SVG Replaced Element Classes</text>
  <text x="640" y="48" text-anchor="middle" font-size="11" fill="#7f8c8d">components/layout/ — Layout-side SVG handling as replaced content</text>

  <!-- ============================================================ -->
  <!-- Package: Layout -->
  <!-- ============================================================ -->
  <rect x="30" y="60" width="1230" height="860" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5" opacity="0.35" filter="url(#shadow-bg)"/>
  <text x="645" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a085">Package: Layout (layout::replaced + layout::fragment_tree)</text>

  <!-- ============================================================ -->
  <!-- Class: SVGElementData -->
  <!-- ============================================================ -->
  <rect x="50" y="110" width="360" height="175" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="110" width="360" height="22" rx="4" fill="#16a085"/>
  <rect x="50" y="128" width="360" height="4" fill="#16a085"/>
  <text x="230" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SVGElementData&lt;'dom&gt;</text>
  <text x="50" y="142" font-size="9" fill="#7f8c8d">  components/shared/layout/lib.rs:152</text>
  <text x="60" y="158" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="60" y="173" font-size="9" fill="#555">source: Option&lt;Result&lt;ServoUrl, ()&gt;&gt;  — cached data URL</text>
  <text x="60" y="185" font-size="9" fill="#555">width: Option&lt;&amp;'dom AttrValue&gt;  — SVG width attribute</text>
  <text x="60" y="197" font-size="9" fill="#555">height: Option&lt;&amp;'dom AttrValue&gt;  — SVG height attribute</text>
  <text x="60" y="209" font-size="9" fill="#555">svg_id: String  — UUID from SVGSVGElement</text>
  <text x="60" y="221" font-size="9" fill="#555">view_box: Option&lt;&amp;'dom AttrValue&gt;  — viewBox attribute</text>
  <line x1="60" y1="229" x2="400" y2="229" stroke="#ddd" stroke-width="0.5"/>
  <text x="60" y="244" font-size="10" font-weight="bold" fill="#2c3e50">Methods:</text>
  <text x="60" y="259" font-size="9" fill="#555">ratio_from_view_box() → Option&lt;f32&gt;</text>
  <text x="60" y="271" font-size="9" fill="#555">  — computes width/height ratio from viewBox attribute</text>

  <!-- ============================================================ -->
  <!-- Enum: ReplacedContentKind -->
  <!-- ============================================================ -->
  <rect x="470" y="110" width="360" height="175" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="470" y="110" width="360" height="22" rx="4" fill="#1abc9c"/>
  <rect x="470" y="128" width="360" height="4" fill="#1abc9c"/>
  <text x="650" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ReplacedContentKind</text>
  <text x="470" y="142" font-size="9" fill="#7f8c8d">  replaced.rs:139-146</text>
  <text x="480" y="158" font-size="10" font-weight="bold" fill="#2c3e50">Variants:</text>
  <text x="480" y="173" font-size="9" fill="#555">Image(ImageInfo)  —  raster/vector image from &lt;img&gt; or content</text>
  <text x="480" y="185" font-size="9" fill="#555">IFrame(IFrameInfo)  —  &lt;iframe&gt; replaced element</text>
  <text x="480" y="197" font-size="9" fill="#555">Canvas(CanvasInfo)  —  &lt;canvas&gt; element</text>
  <text x="480" y="209" font-size="9" fill="#555">Video(VideoInfo)  —  &lt;video&gt; element</text>
  <text x="480" y="221" font-size="9" fill="#e74c3c" font-weight="bold">SVGElement(Option&lt;VectorImage&gt;)  —  inline SVG</text>
  <text x="480" y="233" font-size="9" fill="#555">Audio  —  &lt;audio&gt; element</text>
  <line x1="480" y1="241" x2="820" y2="241" stroke="#ddd" stroke-width="0.5"/>
  <text x="480" y="256" font-size="10" font-weight="bold" fill="#2c3e50">Used by:</text>
  <text x="480" y="271" font-size="9" fill="#555">ReplacedContents.kind → determines fragment type</text>

  <!-- ============================================================ -->
  <!-- Class: ReplacedContents -->
  <!-- ============================================================ -->
  <rect x="470" y="320" width="420" height="255" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="470" y="320" width="420" height="22" rx="4" fill="#0e6655"/>
  <rect x="470" y="338" width="420" height="4" fill="#0e6655"/>
  <text x="680" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ReplacedContents</text>
  <text x="470" y="352" font-size="9" fill="#7f8c8d">  replaced.rs:48-53</text>
  <text x="480" y="368" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="480" y="383" font-size="9" fill="#555">kind: ReplacedContentKind  —  the type of replaced content</text>
  <text x="480" y="395" font-size="9" fill="#555">natural_size: NaturalSizes  —  natural dimensions + aspect ratio</text>
  <text x="480" y="407" font-size="9" fill="#555">base_fragment_info: BaseFragmentInfo  —  node provenance</text>
  <line x1="480" y1="415" x2="880" y2="415" stroke="#ddd" stroke-width="0.5"/>
  <text x="480" y="430" font-size="10" font-weight="bold" fill="#2c3e50">Key Methods:</text>
  <text x="480" y="445" font-size="9" fill="#555">for_element(node, context) → Option&lt;Self&gt;  —  factory: dispatches</text>
  <text x="490" y="457" font-size="9" fill="#555">by node type (image, canvas, iframe, svg, etc.)</text>
  <text x="480" y="472" font-size="9" fill="#e74c3c">svg_kind_size(svg_data, context, node) → (ReplacedContentKind, NaturalSizes)</text>
  <text x="490" y="484" font-size="9" fill="#555">resolves SVG width/height/viewBox → natural size</text>
  <text x="480" y="499" font-size="9" fill="#555">make_fragments(layout_context, style, size) → Vec&lt;Fragment&gt;</text>
  <text x="490" y="511" font-size="9" fill="#555">for SVGElement: requests rasterization, creates ImageFragment</text>
  <text x="480" y="526" font-size="9" fill="#555">layout(...) → IndependentFormattingContextLayoutResult</text>
  <text x="480" y="538" font-size="9" fill="#555">preferred_aspect_ratio(style, padding) → Option&lt;AspectRatio&gt;</text>
  <text x="480" y="550" font-size="9" fill="#555">fallback_inline_size(wm) / fallback_block_size(wm) → Au</text>

  <!-- ============================================================ -->
  <!-- Class: NaturalSizes -->
  <!-- ============================================================ -->
  <rect x="50" y="320" width="370" height="130" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="320" width="370" height="22" rx="4" fill="#1abc9c"/>
  <rect x="50" y="338" width="370" height="4" fill="#1abc9c"/>
  <text x="235" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">NaturalSizes</text>
  <text x="50" y="352" font-size="9" fill="#7f8c8d">  replaced.rs:72-77</text>
  <text x="60" y="368" font-size="10" font-weight="bold" fill="#2c3e50">Fields:</text>
  <text x="60" y="383" font-size="9" fill="#555">width: Option&lt;Au&gt;  —  natural width in app units</text>
  <text x="60" y="395" font-size="9" fill="#555">height: Option&lt;Au&gt;  —  natural height in app units</text>
  <text x="60" y="407" font-size="9" fill="#555">ratio: Option&lt;CSSFloat&gt;  —  natural aspect ratio (w/h)</text>
  <line x1="60" y1="415" x2="410" y2="415" stroke="#ddd" stroke-width="0.5"/>
  <text x="60" y="430" font-size="10" font-weight="bold" fill="#2c3e50">Methods:</text>
  <text x="60" y="445" font-size="9" fill="#555">from_width_and_height(w, h) → NaturalSizes</text>

