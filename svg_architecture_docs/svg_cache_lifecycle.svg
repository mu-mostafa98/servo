<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 850" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#27ae60"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e74c3c"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e67e22"/></marker>
    <filter id="shadow"><feDropShadow dx="1.5" dy="1.5" stdDeviation="2" flood-opacity="0.15"/></filter>
  </defs>

  <!-- Title -->
  <text x="475" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">SVG Three-Tier Cache Lifecycle State Machine</text>
  <text x="475" y="46" text-anchor="middle" font-size="11" fill="#7f8c8d">States and transitions for the complete SVG caching system across all three tiers</text>

  <!-- ============================================ -->
  <!-- TIER 1: DOM-Level Cache -->
  <!-- ============================================ -->
  <rect x="30" y="60" width="890" height="30" rx="3" fill="#2980b9"/>
  <text x="475" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Tier 1: DOM-Level Cache (SVGSVGElement)</text>

  <!-- State: Not Serialized -->
  <rect x="50" y="105" width="180" height="55" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">NOT_SERIALIZED</text>
  <text x="140" y="142" text-anchor="middle" font-size="9" fill="#555">cached_serialized</text>
  <text x="140" y="153" text-anchor="middle" font-size="9" fill="#555">_data_url = None</text>

  <!-- Arrow: Serialize -->
  <line x1="230" y1="132" x2="300" y2="132" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="125" text-anchor="middle" font-size="9" font-weight="bold" fill="#2980b9">serialize</text>

  <!-- State: Serialized -->
  <rect x="310" y="105" width="200" height="55" rx="8" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">SERIALIZED</text>
  <text x="410" y="142" text-anchor="middle" font-size="9" fill="#555">cached_serialized_data_url</text>
  <text x="410" y="153" text-anchor="middle" font-size="9" fill="#555">= Some(Ok(data_url))</text>

  <!-- Arrow: Fetch -->
  <line x1="510" y1="132" x2="580" y2="132" stroke="#2980b9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="125" text-anchor="middle" font-size="9" font-weight="bold" fill="#2980b9">fetch to cache</text>

  <!-- State: Failed -->
  <rect x="590" y="105" width="160" height="55" rx="8" fill="#fde8e8" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">FAILED</text>
  <text x="670" y="142" text-anchor="middle" font-size="9" fill="#555">cached_serialized</text>
  <text x="670" y="153" text-anchor="middle" font-size="9" fill="#555">_data_url = Some(Err)</text>

  <!-- Arrow: serialize fail -->
  <path d="M230,145 Q260,165 310,155" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="255" y="170" font-size="8" fill="#e74c3c">serialization error</text>

  <!-- Invalidation arrows (red, looping back) -->
  <path d="M410,160 Q410,185 265,185 Q200,185 200,165" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="300" y="182" text-anchor="middle" font-size="9" fill="#e74c3c">invalidate (set to None)</text>

  <!-- ============================================ -->
  <!-- TIER 2: Vector Image Cache -->
  <!-- ============================================ -->
  <rect x="30" y="210" width="890" height="30" rx="3" fill="#27ae60"/>
  <text x="475" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Tier 2: Vector Image Cache (ImageCacheStore::vector_images)</text>

  <!-- Arrow from Tier 1 to Tier 2 -->
  <path d="M410,160 L410,200 L180,200 L180,260" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="235" font-size="9" fill="#7f8c8d">data URL passed to image cache</text>

  <!-- State: Pending -->
  <rect x="50" y="255" width="200" height="55" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">PENDING</text>
  <text x="150" y="292" text-anchor="middle" font-size="9" fill="#555">Data URL queued for decode</text>
  <text x="150" y="303" text-anchor="middle" font-size="9" fill="#555">Awaiting usvg::Tree::from_data()</text>

  <!-- Arrow: parse -->
  <line x1="250" y1="282" x2="330" y2="282" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="275" text-anchor="middle" font-size="9" font-weight="bold" fill="#27ae60">parse OK</text>

  <!-- State: VectorImageData -->
  <rect x="340" y="255" width="220" height="55" rx="8" fill="#abebc6" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">VECTOR_CACHED</text>
  <text x="450" y="292" text-anchor="middle" font-size="9" fill="#555">VectorImageData { svg_tree,</text>
  <text x="450" y="303" text-anchor="middle" font-size="9" fill="#555">cors_status }</text>

  <!-- Arrow: parse fail -->
  <path d="M250,295 Q290,325 340,312" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="275" y="322" font-size="8" fill="#e74c3c">parse error</text>

  <!-- State: Parse Error -->
  <rect x="590" y="255" width="180" height="55" rx="8" fill="#fde8e8" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">PARSE_ERROR</text>
  <text x="680" y="295" text-anchor="middle" font-size="9" fill="#555">usvg parse failure</text>

  <!-- ============================================ -->
  <!-- TIER 3: Rasterized Cache -->
  <!-- ============================================ -->
  <rect x="30" y="370" width="890" height="30" rx="3" fill="#e67e22"/>
  <text x="475" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Tier 3: Rasterized Image Cache (ImageCacheStore::rasterized_vector_images)</text>

  <!-- Arrow from Tier 2 to Tier 3 -->
  <path d="M450,310 L450,350 L450,400" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>
  <text x="460" y="355" font-size="9" fill="#7f8c8d">rasterize(requested_size)</text>

  <!-- State: Not Cached -->
  <rect x="50" y="415" width="180" height="55" rx="8" fill="#fef5e7" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">NOT_RASTERIZED</text>
  <text x="140" y="452" text-anchor="middle" font-size="9" fill="#555">No pixmap for this size</text>
  <text x="140" y="463" text-anchor="middle" font-size="9" fill="#555">Thread pool task spawned</text>

  <!-- Arrow: start raster -->
  <line x1="230" y1="442" x2="310" y2="442" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="435" text-anchor="middle" font-size="9" font-weight="bold" fill="#e67e22">spawn task</text>

  <!-- State: Rasterizing -->
  <rect x="320" y="415" width="200" height="55" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">RASTERIZING</text>
  <text x="420" y="452" text-anchor="middle" font-size="9" fill="#555">Pixmap::new(w,h) → resvg::render()</text>
  <text x="420" y="463" text-anchor="middle" font-size="9" fill="#555">→ load_image_with_keycache()</text>

  <!-- Arrow: complete -->
  <line x1="520" y1="442" x2="600" y2="442" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="560" y="435" text-anchor="middle" font-size="9" font-weight="bold" fill="#27ae60">complete</text>

  <!-- State: Cached -->
  <rect x="610" y="415" width="200" height="55" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">RASTER_CACHED</text>
  <text x="710" y="452" text-anchor="middle" font-size="9" fill="#555">RasterizationTask { result }</text>
  <text x="710" y="463" text-anchor="middle" font-size="9" fill="#555">WebRender ImageKey stored</text>

  <!-- Size variant marker -->
  <rect x="610" y="480" width="200" height="40" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="710" y="496" text-anchor="middle" font-size="9" fill="#1e8449">Key: (PendingImageId, DeviceIntSize)</text>
  <text x="710" y="510" text-anchor="middle" font-size="9" fill="#1e8449">Multiple sizes stored separately</text>

  <!-- ============================================ -->
  <!-- EVICTION section -->
  <!-- ============================================ -->
  <rect x="30" y="550" width="890" height="30" rx="3" fill="#e74c3c"/>
  <text x="475" y="570" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Eviction &amp; Cleanup</text>

  <!-- Eviction triggers -->
  <rect x="50" y="595" width="250" height="55" rx="8" fill="#fde8e8" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="616" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">DOM REMOVAL</text>
  <text x="175" y="632" text-anchor="middle" font-size="9" fill="#555">unbind_from_tree() called</text>
  <text x="175" y="643" text-anchor="middle" font-size="9" fill="#555">evict_rasterized_image(uuid)</text>

  <!-- Arrows from DOM removal -->
  <path d="M300,630 L380,630 L380,290 L310,290" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M300,640 L390,640 L390,460 L610,460" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-red)"/>

  <rect x="350" y="595" width="250" height="55" rx="8" fill="#fde8e8" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="616" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">CONTENT CHANGE</text>
  <text x="475" y="632" text-anchor="middle" font-size="9" fill="#555">children_changed() → invalidate</text>
  <text x="475" y="643" text-anchor="middle" font-size="9" fill="#555">cached_serialized_data_url = None</text>

  <rect x="650" y="595" width="250" height="55" rx="8" fill="#fde8e8" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="616" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">SIZE CHANGE</text>
  <text x="775" y="632" text-anchor="middle" font-size="9" fill="#555">New DeviceIntSize requested</text>
  <text x="775" y="643" text-anchor="middle" font-size="9" fill="#555">New NOT_RASTERIZED entry</text>

  <!-- ============================================ -->
  <!-- MAPPING section -->
  <!-- ============================================ -->
  <rect x="30" y="670" width="890" height="160" rx="5" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="1"/>
  <text x="475" y="690" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">SVG UUID Mapping &amp; Cache Coordination</text>

  <!-- Map boxes -->
  <rect x="50" y="705" width="260" height="55" rx="4" fill="#fff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="180" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#2980b9">svg_id_image_id_map</text>
  <text x="180" y="738" text-anchor="middle" font-size="8" fill="#555">HashMap&lt;String(SVG UUID), VectorImageId&gt;</text>
  <text x="180" y="750" text-anchor="middle" font-size="8" fill="#555">Maps SVG element UUID → Image cache entry</text>

  <rect x="340" y="705" width="260" height="55" rx="4" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="470" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">image_id_size_map</text>
  <text x="470" y="738" text-anchor="middle" font-size="8" fill="#555">HashMap&lt;VectorImageId, Vec&lt;DeviceIntSize&gt;&gt;</text>
  <text x="470" y="750" text-anchor="middle" font-size="8" fill="#555">Tracks all sizes cached for each image</text>

  <rect x="630" y="705" width="270" height="55" rx="4" fill="#fff" stroke="#e67e22" stroke-width="1.5"/>
  <text x="765" y="723" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">KeyCache (WebRender keys)</text>
  <text x="765" y="738" text-anchor="middle" font-size="8" fill="#555">Manages WebRenderImageKey allocation</text>
  <text x="765" y="750" text-anchor="middle" font-size="8" fill="#555">PendingBatch → Ready queue</text>

  <!-- Key numbers -->
  <rect x="50" y="770" width="850" height="50" rx="4" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="475" y="788" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">Key Cache Limits &amp; Safety</text>
  <text x="475" y="805" text-anchor="middle" font-size="9" fill="#555">MAX_SVG_PIXMAP_DIMENSION = 5000px • Max pixmap memory: 5000 × 5000 × 4 = ~95MB • No shared caching between identical SVGs</text>
  <text x="475" y="817" text-anchor="middle" font-size="9" fill="#555">Full re-serialization on any child mutation • No partial invalidation • No size budget for rasterized cache</text>
</svg>
