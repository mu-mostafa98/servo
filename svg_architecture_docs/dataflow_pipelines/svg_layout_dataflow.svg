<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2c3e50"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a085"/></marker>
    <filter id="shadow-sm"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.15"/></filter>
    <filter id="shadow-bg"><feDropShadow dx="1.5" dy="1.5" stdDeviation="2.5" flood-opacity="0.12"/></filter>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">SVG Layout Pipeline</text>
  <text x="500" y="48" text-anchor="middle" font-size="11" fill="#7f8c8d">SVGElementData → ReplacedContents → ImageFragment — layout/replaced.rs</text>

  <!-- Package: Layout -->
  <rect x="30" y="65" width="940" height="810" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5" opacity="0.3" filter="url(#shadow-bg)"/>
  <text x="500" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a085">Subsystem: Layout</text>

  <!-- Step 1 -->
  <rect x="120" y="110" width="760" height="80" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="120" y="110" width="760" height="22" rx="4" fill="#16a085"/>
  <rect x="120" y="128" width="760" height="4" fill="#16a085"/>
  <circle cx="134" cy="120" r="7" fill="#fff" opacity="0.3"/>
  <text x="134" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">1</text>
  <text x="500" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Detect SVG Element — Dispatch</text>
  <text x="130" y="152" font-size="9" fill="#555">Layout traversal encounters LayoutElementType::SVGSVGElement or SVGImageElement</text>
  <text x="130" y="166" font-size="9" fill="#555">LayoutDom::data() on Script node → builds SVGElementData { source, width, height, svg_id, view_box }</text>
  <text x="130" y="180" font-size="9" fill="#555">ReplacedContents::for_element() dispatches based on element type</text>

  <!-- Arrow 1→2 -->
  <line x1="500" y1="190" x2="500" y2="225" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Step 2 -->
  <rect x="120" y="230" width="760" height="95" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="120" y="230" width="760" height="22" rx="4" fill="#0e6655"/>
  <rect x="120" y="248" width="760" height="4" fill="#0e6655"/>
  <circle cx="134" cy="240" r="7" fill="#fff" opacity="0.3"/>
  <text x="134" y="244" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">2</text>
  <text x="500" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Resolve Natural Size — svg_kind_size()</text>
  <text x="130" y="272" font-size="9" fill="#555">Parse width attribute, height attribute, viewBox attribute from SVGElementData</text>
  <text x="130" y="286" font-size="9" fill="#555">Compute NaturalSizes { width: Option&lt;Au&gt;, height: Option&lt;Au&gt;, ratio: Option&lt;f32&gt; }</text>
  <text x="130" y="300" font-size="9" fill="#555">If source data URL is available → ImageResolver::get_cached_image_for_url()</text>
  <text x="130" y="314" font-size="9" fill="#555">If source is None → queue serialization, defer sizing</text>

  <!-- Arrow 2→3 -->
  <line x1="500" y1="325" x2="500" y2="360" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Step 3 -->
  <rect x="120" y="365" width="760" height="80" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="120" y="365" width="760" height="22" rx="4" fill="#0e6655"/>
  <rect x="120" y="383" width="760" height="4" fill="#0e6655"/>
  <circle cx="134" cy="375" r="7" fill="#fff" opacity="0.3"/>
  <text x="134" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">3</text>
  <text x="500" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Query Image Cache</text>
  <text x="130" y="407" font-size="9" fill="#555">ImageResolver gets or requests image for the URL via ImageCache trait</text>
  <text x="130" y="421" font-size="9" fill="#555">Returns image_cache::Image::Vector(VectorImage) ↔ data URL resolved to VectorImageData</text>
  <text x="130" y="435" font-size="9" fill="#555">Returns ReplacedContentKind::SVGElement(Option&lt;VectorImage&gt;) + NaturalSizes</text>

  <!-- Arrow 3→4 -->
  <line x1="500" y1="445" x2="500" y2="480" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Step 4 -->
  <rect x="120" y="485" width="760" height="95" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="120" y="485" width="760" height="22" rx="4" fill="#0e6655"/>
  <rect x="120" y="503" width="760" height="4" fill="#0e6655"/>
  <circle cx="134" cy="495" r="7" fill="#fff" opacity="0.3"/>
  <text x="134" y="499" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">4</text>
  <text x="500" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Request Rasterization — make_fragments()</text>
  <text x="130" y="527" font-size="9" fill="#555">ReplacedContents::make_fragments() dispatches on ReplacedContentKind::SVGElement</text>
  <text x="130" y="541" font-size="9" fill="#e74c3c">Calls ImageResolver::rasterize_vector_image(id, size, node, svg_id)</text>
  <text x="130" y="555" font-size="9" fill="#555">→ Triggers ImageCache::rasterize_vector_image() → thread pool rasterization</text>
  <text x="130" y="569" font-size="9" fill="#555">→ Adds rasterization completion listener for callback notification</text>

  <!-- Arrow 4→5 -->
  <line x1="500" y1="580" x2="500" y2="615" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Step 5 -->
  <rect x="120" y="620" width="760" height="80" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="120" y="620" width="760" height="22" rx="4" fill="#0e6655"/>
  <rect x="120" y="638" width="760" height="4" fill="#0e6655"/>
  <circle cx="134" cy="630" r="7" fill="#fff" opacity="0.3"/>
  <text x="134" y="634" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">5</text>
  <text x="500" y="635" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Create ImageFragment</text>
  <text x="130" y="662" font-size="9" fill="#555">ImageFragment { base, clip, image_key: Option&lt;ImageKey&gt;, showing_broken_image_icon, url }</text>
  <text x="130" y="676" font-size="9" fill="#555">ImageKey is initially None → populated when rasterization completes</text>
  <text x="130" y="690" font-size="9" fill="#555">Shows broken image icon if rasterization fails or no VectorImage available</text>

  <!-- Arrow 5→6 -->
  <line x1="500" y1="700" x2="500" y2="735" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Step 6 -->
  <rect x="120" y="740" width="760" height="80" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="120" y="740" width="760" height="22" rx="4" fill="#16a085"/>
  <rect x="120" y="758" width="760" height="4" fill="#16a085"/>
  <circle cx="134" cy="750" r="7" fill="#fff" opacity="0.3"/>
  <text x="134" y="754" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">6</text>
  <text x="500" y="755" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Layout Computation — Final Sizing</text>
  <text x="130" y="782" font-size="9" fill="#555">IndependentFormattingContextLayoutResult — applies object-fit, aspect-ratio from CSS</text>
  <text x="130" y="796" font-size="9" fill="#555">Fragment stored in fragment tree as Fragment::Image(ArcRefCell&lt;ImageFragment&gt;)</text>
  <text x="130" y="810" font-size="9" fill="#555">Ready for display list building → rendering pipeline</text>

  <!-- Key annotations box -->
  <rect x="30" y="855" width="940" height="1" fill="#ccc"/>
  <text x="50" y="872" font-size="9" fill="#7f8c8d">Key: SVG is treated as a replaced element throughout layout — same sizing/positioning model as &lt;img&gt;.</text>
  <text x="50" y="886" font-size="9" fill="#e74c3c">Critical: ImageKey may not yet be populated at this point. Rasterization is async; display uses a placeholder until callback.</text>
</svg>
