<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 980" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2c3e50"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#27ae60"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e67e22"/></marker>
    <filter id="shadow-sm"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.15"/></filter>
    <filter id="shadow-bg"><feDropShadow dx="1.5" dy="1.5" stdDeviation="2.5" flood-opacity="0.12"/></filter>
  </defs>

  <!-- Title -->
  <text x="525" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">SVG Rasterization Pipeline</text>
  <text x="525" y="48" text-anchor="middle" font-size="11" fill="#7f8c8d">VectorImageData → tiny_skia::Pixmap → resvg::render → RasterImage — image_cache.rs</text>

  <!-- Package bg: Image Cache main region -->
  <rect x="30" y="65" width="480" height="880" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5" opacity="0.3" filter="url(#shadow-bg)"/>
  <text x="270" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Image Cache (Main Thread)</text>

  <!-- Package bg: Thread Pool region -->
  <rect x="540" y="65" width="480" height="880" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5" opacity="0.3" filter="url(#shadow-bg)"/>
  <text x="780" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">Thread Pool (Background)</text>

  <!-- ============================================================ -->
  <!-- Step 1: Image Cache -->
  <!-- ============================================================ -->
  <rect x="50" y="110" width="440" height="70" rx="4" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="110" width="440" height="22" rx="4" fill="#27ae60"/>
  <rect x="50" y="128" width="440" height="4" fill="#27ae60"/>
  <circle cx="64" cy="120" r="7" fill="#fff" opacity="0.3"/>
  <text x="64" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">1</text>
  <text x="270" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Receive Rasterization Request</text>
  <text x="60" y="150" font-size="9" fill="#555">Layout calls ImageCache::rasterize_vector_image(id, size, svg_id)</text>
  <text x="60" y="164" font-size="9" fill="#555">Called from ReplacedContents::make_fragments() for SVGElement variant</text>

  <!-- Arrow 1→2 -->
  <line x1="270" y1="180" x2="270" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ============================================================ -->
  <!-- Step 2: Image Cache -->
  <!-- ============================================================ -->
  <rect x="50" y="215" width="440" height="70" rx="4" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="215" width="440" height="22" rx="4" fill="#1e8449"/>
  <rect x="50" y="233" width="440" height="4" fill="#1e8449"/>
  <circle cx="64" cy="225" r="7" fill="#fff" opacity="0.3"/>
  <text x="64" y="229" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">2</text>
  <text x="270" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Resolve ID — Lookup VectorImageData</text>
  <text x="60" y="255" font-size="9" fill="#555">svg_id_image_id_map: svg_id → PendingImageId</text>
  <text x="60" y="269" font-size="9" fill="#555">store.vector_images: PendingImageId → VectorImageData</text>

  <!-- Arrow 2→3 -->
  <line x1="270" y1="285" x2="270" y2="315" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ============================================================ -->
  <!-- Step 3: Image Cache -->
  <!-- ============================================================ -->
  <rect x="50" y="320" width="440" height="70" rx="4" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="320" width="440" height="22" rx="4" fill="#1e8449"/>
  <rect x="50" y="338" width="440" height="4" fill="#1e8449"/>
  <circle cx="64" cy="330" r="7" fill="#fff" opacity="0.3"/>
  <text x="64" y="334" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">3</text>
  <text x="270" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Track Requested Size</text>
  <text x="60" y="360" font-size="9" fill="#555">image_id_size_map: PendingImageId → Vec&lt;DeviceIntSize&gt;</text>
  <text x="60" y="374" font-size="9" fill="#555">Tracks all distinct sizes requested for each vector image</text>

  <!-- Arrow 3→4 -->
  <line x1="270" y1="390" x2="270" y2="420" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ============================================================ -->
  <!-- Step 4: Spawn Thread Pool -->
  <!-- ============================================================ -->
  <rect x="50" y="425" width="440" height="70" rx="4" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="425" width="440" height="22" rx="4" fill="#1e8449"/>
  <rect x="50" y="443" width="440" height="4" fill="#1e8449"/>
  <circle cx="64" cy="435" r="7" fill="#fff" opacity="0.3"/>
  <text x="64" y="439" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">4</text>
  <text x="270" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Spawn Thread Pool Task</text>
  <text x="60" y="465" font-size="9" fill="#555">Arc::clone VectorImageData.svg_tree → move into closure</text>
  <text x="60" y="479" font-size="9" fill="#555">Thread pool executes rasterization asynchronously</text>

  <!-- Arrow 4→5 (cross-thread) -->
  <path d="M 490 460 L 540 460 L 540 490 L 585 490" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <text x="495" y="455" font-size="8" fill="#e67e22">async task</text>

  <!-- ============================================================ -->
  <!-- Thread boundary label -->
  <!-- ============================================================ -->
  <line x1="490" y1="500" x2="585" y2="500" stroke="#e74c3c" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="540" y="517" text-anchor="middle" font-size="8" fill="#e74c3c">— THREAD BOUNDARY —</text>

  <!-- ============================================================ -->
  <!-- Step 5: Thread Pool -->
  <!-- ============================================================ -->
  <rect x="590" y="495" width="410" height="75" rx="4" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="590" y="495" width="410" height="22" rx="4" fill="#e67e22"/>
  <rect x="590" y="513" width="410" height="4" fill="#e67e22"/>
  <circle cx="604" cy="505" r="7" fill="#fff" opacity="0.3"/>
  <text x="604" y="509" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">5</text>
  <text x="795" y="510" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Allocate Pixel Buffer</text>
  <text x="600" y="536" font-size="9" fill="#555">tiny_skia::Pixmap::new(raster_width, raster_height)</text>
  <text x="600" y="550" font-size="9" fill="#e74c3c">MAX_SVG_PIXMAP_DIMENSION = 5000px limit enforced (5000×5000 ≈ 95MB)</text>

  <!-- Arrow 5→6 -->
  <line x1="795" y1="570" x2="795" y2="600" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ============================================================ -->
  <!-- Step 6: Thread Pool -->
  <!-- ============================================================ -->
  <rect x="590" y="605" width="410" height="75" rx="4" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="590" y="605" width="410" height="22" rx="4" fill="#d35400"/>
  <rect x="590" y="623" width="410" height="4" fill="#d35400"/>
  <circle cx="604" cy="615" r="7" fill="#fff" opacity="0.3"/>
  <text x="604" y="619" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">6</text>
  <text x="795" y="620" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Rasterize — resvg::render()</text>
  <text x="600" y="646" font-size="9" fill="#555">resvg::render(&amp;tree, &amp;Transform::default(), &amp;mut pixmap)</text>
  <text x="600" y="660" font-size="9" fill="#555">Renders SVG tree into the RGBA pixel buffer at specified transform</text>

  <!-- Arrow 6→7 -->
  <line x1="795" y1="680" x2="795" y2="710" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ============================================================ -->
  <!-- Step 7: Thread Pool -->
  <!-- ============================================================ -->
  <rect x="590" y="715" width="410" height="75" rx="4" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="590" y="715" width="410" height="22" rx="4" fill="#d35400"/>
  <rect x="590" y="733" width="410" height="4" fill="#d35400"/>
  <circle cx="604" cy="725" r="7" fill="#fff" opacity="0.3"/>
  <text x="604" y="729" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">7</text>
  <text x="795" y="730" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Create RasterImage</text>
  <text x="600" y="756" font-size="9" fill="#555">pixmap.take() → raw RGBA bytes → RasterImage { bytes, metadata, format }</text>
  <text x="600" y="770" font-size="9" fill="#555">RasterImage stored temporarily for callback delivery</text>

  <!-- Arrow 7→8 (back to main thread) -->
  <path d="M 590 755 L 540 755 L 540 790 L 490 790" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="495" y="750" font-size="8" fill="#27ae60">callback</text>
  <line x1="490" y1="775" x2="585" y2="775" stroke="#e74c3c" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="540" y="792" text-anchor="middle" font-size="8" fill="#e74c3c">— CALLBACK —</text>

  <!-- ============================================================ -->
  <!-- Step 8: Image Cache -->
  <!-- ============================================================ -->
  <rect x="50" y="785" width="440" height="70" rx="4" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="785" width="440" height="22" rx="4" fill="#1e8449"/>
  <rect x="50" y="803" width="440" height="4" fill="#1e8449"/>
  <circle cx="64" cy="795" r="7" fill="#fff" opacity="0.3"/>
  <text x="64" y="799" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">8</text>
  <text x="270" y="800" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Assign WebRender Image Key</text>
  <text x="60" y="826" font-size="9" fill="#555">load_image_with_keycache() → KeyCache assigns WebRenderImageKey</text>
  <text x="60" y="840" font-size="9" fill="#555">complete_load_svg(rasterized_image, pending_id, size) → stores result</text>

  <!-- Arrow 8→9 -->
  <line x1="270" y1="855" x2="270" y2="880" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ============================================================ -->
  <!-- Step 9: Image Cache -->
  <!-- ============================================================ -->
  <rect x="50" y="885" width="440" height="55" rx="4" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="50" y="885" width="440" height="22" rx="4" fill="#27ae60"/>
  <rect x="50" y="903" width="440" height="4" fill="#27ae60"/>
  <circle cx="64" cy="895" r="7" fill="#fff" opacity="0.3"/>
  <text x="64" y="899" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">9</text>
  <text x="270" y="900" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Notify Listeners</text>
  <text x="60" y="925" font-size="9" fill="#555">RasterizationTask listeners called → Layout ImageFragment gets ImageKey → ready for display</text>
</svg>
