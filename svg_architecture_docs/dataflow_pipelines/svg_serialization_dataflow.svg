<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="Consolas, monospace" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2c3e50"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2980b9"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a085"/></marker>
    <filter id="shadow-sm"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.15"/></filter>
    <filter id="shadow-bg"><feDropShadow dx="1.5" dy="1.5" stdDeviation="2.5" flood-opacity="0.12"/></filter>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">SVG Serialization Pipeline</text>
  <text x="500" y="48" text-anchor="middle" font-size="11" fill="#7f8c8d">Inline DOM subtree → base64 Data URL — the "Two-Reflow" pattern</text>

  <!-- Package background -->
  <rect x="30" y="65" width="940" height="790" rx="6" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="1" opacity="0.4" filter="url(#shadow-bg)"/>
  <text x="500" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f8c8d">Cross-Thread: Script DOM (script::dom::svg) ⇄ Layout (layout::replaced)</text>

  <!-- ============================================================ -->
  <!-- Step 1: Script Thread -->
  <!-- ============================================================ -->
  <rect x="100" y="115" width="800" height="95" rx="4" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="100" y="115" width="800" height="22" rx="4" fill="#2980b9"/>
  <rect x="100" y="133" width="800" height="4" fill="#2980b9"/>
  <!-- Badge -->
  <rect x="110" y="120" width="90" height="14" rx="3" fill="#fff" opacity="0.25"/>
  <text x="155" y="131" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">SCRIPT THREAD</text>
  <circle cx="120" cy="126" r="7" fill="#fff" opacity="0.3"/>
  <text x="120" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">1</text>
  <text x="500" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">DOM Mutation — Trigger Invalidation</text>
  <text x="115" y="158" font-size="9" fill="#555">Event: attribute_mutated | children_changed | unbind_from_tree on SVGSVGElement</text>
  <text x="115" y="172" font-size="9" fill="#555">Calls invalidate_cached_serialized_subtree() → sets cached_serialized_data_url = None</text>
  <text x="115" y="186" font-size="9" fill="#e74c3c">Any change to SVG subtree invalidates the cached serialization → triggers re-layout</text>

  <!-- Arrow 1→2 -->
  <path d="M 500 210 L 500 245" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="232" font-size="8" fill="#2980b9">cross-thread: Layout reads SVGElementData</text>

  <!-- ============================================================ -->
  <!-- Step 2: Layout Thread -->
  <!-- ============================================================ -->
  <rect x="100" y="250" width="800" height="95" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="100" y="250" width="800" height="22" rx="4" fill="#16a085"/>
  <rect x="100" y="268" width="800" height="4" fill="#16a085"/>
  <rect x="110" y="255" width="100" height="14" rx="3" fill="#fff" opacity="0.25"/>
  <text x="160" y="266" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">LAYOUT THREAD</text>
  <circle cx="118" cy="261" r="7" fill="#fff" opacity="0.3"/>
  <text x="118" y="265" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">2</text>
  <text x="500" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">First Layout — Source Not Found</text>
  <text x="115" y="293" font-size="9" fill="#555">Layout builds SVGElementData via SVGSVGElement::data() → { source: None }</text>
  <text x="115" y="307" font-size="9" fill="#555">ReplacedContents::svg_kind_size() detects no cached data URL</text>
  <text x="115" y="321" font-size="9" fill="#555">ImageResolver::queue_svg_element_for_serialization() — enqueues node for Script</text>

  <!-- Arrow 2→3 -->
  <path d="M 500 345 L 500 385" fill="none" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="510" y="370" font-size="8" fill="#16a085">cross-thread: Script processes serialization queue</text>

  <!-- ============================================================ -->
  <!-- Step 3: Script Thread -->
  <!-- ============================================================ -->
  <rect x="100" y="390" width="800" height="115" rx="4" fill="#fff" stroke="#2980b9" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="100" y="390" width="800" height="22" rx="4" fill="#2980b9"/>
  <rect x="100" y="408" width="800" height="4" fill="#2980b9"/>
  <rect x="110" y="395" width="90" height="14" rx="3" fill="#fff" opacity="0.25"/>
  <text x="155" y="406" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">SCRIPT THREAD</text>
  <circle cx="118" cy="401" r="7" fill="#fff" opacity="0.3"/>
  <text x="118" y="405" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">3</text>
  <text x="500" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Serialize Subtree — XML → base64 → Data URL</text>
  <text x="115" y="433" font-size="9" fill="#e74c3c">SVGSVGElement::serialize_and_cache_subtree() — entry point</text>
  <text x="125" y="448" font-size="9" fill="#555">a) SVGSVGElement::process_use_elements() — resolve &lt;use&gt; references, clone referenced nodes</text>
  <text x="125" y="463" font-size="9" fill="#555">b) XML serialization of SVG DOM subtree → string</text>
  <text x="125" y="478" font-size="9" fill="#555">c) Base64 encode → data:image/svg+xml;base64,...</text>
  <text x="125" y="493" font-size="9" fill="#555">d) Store in cached_serialized_data_url = Some(data_url)</text>

  <!-- Arrow 3→4 -->
  <path d="M 500 505 L 500 545" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="530" font-size="8" fill="#2980b9">cross-thread: Script dirties layout → Layout re-traverses</text>

  <!-- ============================================================ -->
  <!-- Step 4: Layout Thread -->
  <!-- ============================================================ -->
  <rect x="100" y="550" width="800" height="95" rx="4" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow-sm)"/>
  <rect x="100" y="550" width="800" height="22" rx="4" fill="#16a085"/>
  <rect x="100" y="568" width="800" height="4" fill="#16a085"/>
  <rect x="110" y="555" width="100" height="14" rx="3" fill="#fff" opacity="0.25"/>
  <text x="160" y="566" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">LAYOUT THREAD</text>
  <circle cx="118" cy="561" r="7" fill="#fff" opacity="0.3"/>
  <text x="118" y="565" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">4</text>
  <text x="500" y="565" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Second Layout — Data URL Available</text>
  <text x="115" y="593" font-size="9" fill="#555">Layout rebuilds SVGElementData → { source: Some(data_url) }</text>
  <text x="115" y="607" font-size="9" fill="#555">ReplacedContents::svg_kind_size() receives valid data URL</text>
  <text x="115" y="621" font-size="9" fill="#555">ImageResolver::get_cached_image_for_url(data_url) → ImageCache lookup</text>

  <!-- ============================================================ -->
  <!-- Two-Reflow Annotation -->
  <!-- ============================================================ -->
  <rect x="120" y="680" width="760" height="65" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="500" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">⚠ Two-Reflow Requirement — Current Architecture Limitation</text>
  <text x="135" y="716" font-size="9" fill="#555">First layout pass discovers un-serialized SVG → triggers serialization → second layout pass consumes the data URL.</text>
  <text x="135" y="730" font-size="9" fill="#555">This means inline SVGs always require TWO full layout traversals before first paint, contributing to deferred first render.</text>

  <!-- Legend -->
  <rect x="30" y="760" width="940" height="1" fill="#ccc"/>
  <rect x="50" y="775" width="16" height="10" fill="#2980b9"/>
  <text x="72" y="785" font-size="9" fill="#555">Script DOM thread</text>
  <rect x="200" y="775" width="16" height="10" fill="#16a085"/>
  <text x="222" y="785" font-size="9" fill="#555">Layout thread</text>
  <rect x="350" y="775" width="16" height="10" fill="#e74c3c"/>
  <text x="372" y="785" font-size="9" fill="#555">Red text = critical path detail</text>
</svg>
