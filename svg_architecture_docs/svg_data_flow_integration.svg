<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker>
    <linearGradient id="box-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f4fd"/><stop offset="100%" stop-color="#d0ebf9"/></linearGradient>
    <linearGradient id="box-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f8e8"/><stop offset="100%" stop-color="#d0f0d0"/></linearGradient>
    <linearGradient id="box-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef5e7"/><stop offset="100%" stop-color="#fdebd0"/></linearGradient>
    <linearGradient id="box-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0e6f6"/><stop offset="100%" stop-color="#e0ccf0"/></linearGradient>
    <linearGradient id="box-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde8e8"/><stop offset="100%" stop-color="#f5c6c6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.15"/></filter>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">SVG Data Flow &amp; Integration Diagram</text>
  <text x="550" y="48" text-anchor="middle" font-size="12" fill="#7f8c8d">How an inline SVG travels from HTML parser to screen pixels</text>

  <!-- Thread swimlane headers -->
  <rect x="10" y="60" width="250" height="30" rx="3" fill="#34495e"/><text x="135" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Script Thread</text>
  <rect x="270" y="60" width="230" height="30" rx="3" fill="#2980b9"/><text x="385" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Layout Thread</text>
  <rect x="510" y="60" width="250" height="30" rx="3" fill="#27ae60"/><text x="635" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Image Cache / Net</text>
  <rect x="770" y="60" width="250" height="30" rx="3" fill="#8e44ad"/><text x="895" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">WebRender / GPU</text>

  <!-- Swimlane backgrounds -->
  <rect x="10" y="90" width="250" height="740" rx="2" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="270" y="90" width="230" height="740" rx="2" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="510" y="90" width="250" height="740" rx="2" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="770" y="90" width="250" height="740" rx="2" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- === SCRIPT THREAD === -->
  <!-- 1. HTML Parse & DOM -->
  <rect x="30" y="105" width="210" height="55" rx="5" fill="url(#box-blue)" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">HTML Parser + DOM</text>
  <text x="135" y="140" text-anchor="middle" font-size="10" fill="#555">Creates SVGSVGElement in DOM tree</text>
  <text x="135" y="153" text-anchor="middle" font-size="10" fill="#555">ns!svg namespace elements</text>

  <!-- Arrow: DOM → Serialization -->
  <line x1="135" y1="160" x2="135" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Serialization -->
  <rect x="30" y="190" width="210" height="70" rx="5" fill="url(#box-orange)" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">XML Serialization</text>
  <text x="135" y="226" text-anchor="middle" font-size="10" fill="#555">serialize_and_cache_subtree()</text>
  <text x="135" y="240" text-anchor="middle" font-size="10" fill="#555">xml_serialize(TraversalScope::IncludeNode)</text>
  <text x="135" y="254" text-anchor="middle" font-size="10" fill="#555">→ base64 data URL</text>

  <!-- Issue #1 annotation: CSS inheritance breaks here -->
  <rect x="25" y="265" width="220" height="18" rx="2" fill="#fde8e8" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="135" y="278" text-anchor="middle" font-size="9" fill="#c0392b">⚠ CSS context lost at serialization boundary</text>

  <!-- Cross-thread arrow: Script → Layout (serialized data URL) -->
  <path d="M240,225 L270,225" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="255" y="218" text-anchor="middle" font-size="8" fill="#e67e22">data URL</text>

  <!-- === LAYOUT THREAD === -->
  <!-- 3. Layout discovers SVG -->
  <rect x="285" y="105" width="200" height="55" rx="5" fill="url(#box-blue)" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Layout Encounters &lt;svg&gt;</text>
  <text x="385" y="140" text-anchor="middle" font-size="10" fill="#555">SVGElementData.source check</text>
  <text x="385" y="153" text-anchor="middle" font-size="10" fill="#555">queue_svg_element_for_serialization()</text>

  <!-- Arrow down -->
  <line x1="385" y1="160" x2="385" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Data URL received -->
  <rect x="285" y="190" width="200" height="55" rx="5" fill="url(#box-orange)" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Layout Receives Data URL</text>
  <text x="385" y="225" text-anchor="middle" font-size="10" fill="#555">get_cached_image_for_url()</text>
  <text x="385" y="238" text-anchor="middle" font-size="10" fill="#555">PendingImage → image cache</text>

  <!-- Arrow down -->
  <line x1="385" y1="245" x2="385" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Request rasterization -->
  <rect x="285" y="275" width="200" height="55" rx="5" fill="url(#box-green)" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Request Rasterization</text>
  <text x="385" y="308" text-anchor="middle" font-size="10" fill="#555">make_fragments() → ImageFragment</text>
  <text x="385" y="321" text-anchor="middle" font-size="10" fill="#555">rasterize_vector_image(id, size)</text>

  <!-- Cross-thread: Layout → Image Cache -->
  <path d="M485,302 L510,302" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="497" y="295" text-anchor="middle" font-size="8" fill="#27ae60">rasterize req</text>

  <!-- === IMAGE CACHE / NET === -->
  <!-- 6. SVG Parsing -->
  <rect x="525" y="105" width="220" height="55" rx="5" fill="url(#box-purple)" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="635" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Decode &amp; Parse SVG</text>
  <text x="635" y="140" text-anchor="middle" font-size="10" fill="#555">decode_bytes_sync() → data URL bytes</text>
  <text x="635" y="153" text-anchor="middle" font-size="10" fill="#555">parse_svg_document_in_memory()</text>

  <!-- Arrow -->
  <line x1="635" y1="160" x2="635" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. usvg Tree -->
  <rect x="525" y="190" width="220" height="55" rx="5" fill="url(#box-purple)" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="635" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">usvg::Tree Parsed</text>
  <text x="635" y="225" text-anchor="middle" font-size="10" fill="#555">usvg::Tree::from_data()</text>
  <text x="635" y="238" text-anchor="middle" font-size="10" fill="#555">Stored as VectorImageData</text>

  <!-- Arrow -->
  <line x1="635" y1="245" x2="635" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. resvg Rasterization -->
  <rect x="525" y="275" width="220" height="70" rx="5" fill="url(#box-purple)" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="635" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">resvg Rasterization</text>
  <text x="635" y="311" text-anchor="middle" font-size="10" fill="#555">tiny_skia::Pixmap::new(w, h)</text>
  <text x="635" y="325" text-anchor="middle" font-size="10" fill="#555">resvg::render(&amp;tree, transform, &amp;pixmap)</text>
  <text x="635" y="338" text-anchor="middle" font-size="10" fill="#555">Thread pool task (async)</text>

  <!-- Arrow -->
  <line x1="635" y1="345" x2="635" y2="370" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. ImageKey -->
  <rect x="525" y="375" width="220" height="55" rx="5" fill="url(#box-purple)" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="635" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">WebRender ImageKey Created</text>
  <text x="635" y="410" text-anchor="middle" font-size="10" fill="#555">load_image_with_keycache()</text>
  <text x="635" y="423" text-anchor="middle" font-size="10" fill="#555">set_webrender_image_key()</text>

  <!-- Cross-thread: Image Cache → WebRender -->
  <path d="M745,402 L770,402" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="757" y="395" text-anchor="middle" font-size="8" fill="#8e44ad">ImageKey</text>

  <!-- Cross-thread: Image Cache → Layout -->
  <path d="M525,330 L485,330" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="505" y="323" text-anchor="middle" font-size="8" fill="#27ae60">RasterImage</text>

  <!-- === LAYOUT (continued) === -->
  <rect x="285" y="350" width="200" height="55" rx="5" fill="url(#box-green)" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Build Display List</text>
  <text x="385" y="383" text-anchor="middle" font-size="10" fill="#555">ImageFragment with ImageKey</text>
  <text x="385" y="396" text-anchor="middle" font-size="10" fill="#555">Fragment::Image(VectorImage)</text>

  <!-- Cross-thread: Layout → WebRender -->
  <path d="M485,377 L770,377" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="627" y="370" text-anchor="middle" font-size="8" fill="#8e44ad">Display List (ImageKey ref)</text>

  <!-- Actually let me redo the WebRender section to have better spacing -->
  <!-- === WEBRENDER === -->
  <!-- 10. Receive ImageKey -->
  <rect x="785" y="105" width="220" height="55" rx="5" fill="url(#box-red)" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="895" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Receive Image + Display List</text>
  <text x="895" y="140" text-anchor="middle" font-size="10" fill="#555">paint_api.add_image()</text>
  <text x="895" y="153" text-anchor="middle" font-size="10" fill="#555">Pixel data uploaded to GPU</text>

  <!-- Arrow down -->
  <line x1="895" y1="160" x2="895" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 11. Compositing -->
  <rect x="785" y="190" width="220" height="70" rx="5" fill="url(#box-red)" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="895" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">WebRender Compositing</text>
  <text x="895" y="226" text-anchor="middle" font-size="10" fill="#555">PushImage display item</text>
  <text x="895" y="240" text-anchor="middle" font-size="10" fill="#555">Texture sampled at display resolution</text>
  <text x="895" y="254" text-anchor="middle" font-size="10" fill="#555">Bi-linear interpolation if scaled</text>

  <!-- Arrow down -->
  <line x1="895" y1="260" x2="895" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 12. Screen -->
  <rect x="820" y="290" width="150" height="45" rx="22" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="895" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">🖥 Screen</text>

  <!-- Issue #2 annotation: Web Fonts -->
  <rect x="525" y="445" width="220" height="50" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="635" y="462" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Issue #2: Web Fonts</text>
  <text x="635" y="478" text-anchor="middle" font-size="9" fill="#555">@font-face not loaded in data URL context</text>
  <text x="635" y="490" text-anchor="middle" font-size="9" fill="#555">Fonts not shared between HTML/SVG</text>

  <!-- Issue #3 annotation: Crisp Transforms -->
  <rect x="785" y="365" width="220" height="50" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="895" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Issue #3: Crisp Transforms</text>
  <text x="895" y="398" text-anchor="middle" font-size="9" fill="#555">CSS transform scales rasterized bitmap</text>
  <text x="895" y="410" text-anchor="middle" font-size="9" fill="#555">Vector data lost → blurry at &gt;1x</text>

  <!-- Legend -->
  <rect x="30" y="480" width="220" height="200" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="140" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Legend</text>
  <rect x="45" y="510" width="18" height="12" rx="2" fill="url(#box-blue)" stroke="#2980b9" stroke-width="1"/><text x="70" y="520" font-size="10" fill="#555">DOM / Element creation</text>
  <rect x="45" y="530" width="18" height="12" rx="2" fill="url(#box-orange)" stroke="#e67e22" stroke-width="1"/><text x="70" y="540" font-size="10" fill="#555">Serialization / Data URL</text>
  <rect x="45" y="550" width="18" height="12" rx="2" fill="url(#box-green)" stroke="#27ae60" stroke-width="1"/><text x="70" y="560" font-size="10" fill="#555">Layout / Fragment creation</text>
  <rect x="45" y="570" width="18" height="12" rx="2" fill="url(#box-purple)" stroke="#8e44ad" stroke-width="1"/><text x="70" y="580" font-size="10" fill="#555">SVG parse / Rasterization</text>
  <rect x="45" y="590" width="18" height="12" rx="2" fill="url(#box-red)" stroke="#c0392b" stroke-width="1"/><text x="70" y="600" font-size="10" fill="#555">WebRender / GPU</text>
  <rect x="45" y="610" width="18" height="12" rx="2" fill="#fde8e8" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,2"/><text x="70" y="620" font-size="10" fill="#555">Issue / Problem annotation</text>
  <line x1="45" y1="640" x2="70" y2="640" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="75" y="644" font-size="10" fill="#555">Same-thread flow</text>
  <path d="M45,658 L63,658" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/><text x="68" y="662" font-size="10" fill="#555">Cross-thread communication</text>

  <!-- Key metrics -->
  <rect x="30" y="690" width="220" height="120" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="140" y="710" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Performance Impact</text>
  <text x="45" y="730" font-size="10" fill="#555">• 2 reflow cycles minimum</text>
  <text x="45" y="746" font-size="10" fill="#555">• XML serialization: O(n) SVG size</text>
  <text x="45" y="762" font-size="10" fill="#555">• Base64 encoding: ~33% size increase</text>
  <text x="45" y="778" font-size="10" fill="#555">• usvg re-parse: full tree rebuilt</text>
  <text x="45" y="794" font-size="10" fill="#555">• resvg raster: CPU-bound pixel fill</text>
  <text x="45" y="810" font-size="10" fill="#555">• Max pixmap: 5000×5000</text>
</svg>
