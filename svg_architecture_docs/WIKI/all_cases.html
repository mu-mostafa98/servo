<svg width="700" height="300" xmlns="http://w3.org"
     style="fill: green; fill-opacity: 1; fill-rule: nonzero;
            stroke: red; stroke-width: 4; stroke-opacity: 1;
            stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 4;
            stroke-dasharray: none; stroke-dashoffset: 0;
            marker: none;"> 

       <defs>
              <marker id="red-circle" markerWidth="6" markerHeight="6" refX="3" refY="3">
                     <circle cx="3" cy="3" r="3" style="fill: red" />
              </marker>
              <marker id="green-circle" markerWidth="6" markerHeight="6" refX="3" refY="3">
                     <circle cx="3" cy="3" r="3" style="fill: green" />
              </marker>
              <marker id="blue-circle" markerWidth="6" markerHeight="6" refX="3" refY="3">
                     <circle cx="3" cy="3" r="3" style="fill: blue" />
              </marker>
       </defs>

    <!-- Shape 1: Matches Shape 2 perfectly, cleanly inheriting all parent styles -->
    <polyline points="120,50 64,226 216,118 24,118 176,226" />

    <!-- Shape 2: Overrides styles to test evenodd fill, custom stroke, and open-path markers -->
    <polyline points="420,50 364,226 516,118 324,118 476,226"
             style="fill: red; fill-opacity: 0.4; fill-rule: evenodd;
                    stroke: green; stroke-width: 8; stroke-opacity: 0.6;
                    stroke-linecap: round; stroke-linejoin: round; stroke-miterlimit: 2;
                    stroke-dasharray: 10,5; stroke-dashoffset: 3;  
                    marker-start: url(#red-circle); marker-mid: url(#green-circle); marker-end: url(#blue-circle);" />
</svg>






<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg"
     style="fill: green; clip-rule: nonzero;">

    <defs>
        <marker id="red-circle" markerWidth="4" markerHeight="4" refX="2" refY="2">
            <circle cx="2" cy="2" r="3" style="fill: red" />
        </marker>
        <marker id="blue-circle" markerWidth="4" markerHeight="4" refX="2" refY="2">
            <circle cx="2" cy="2" r="3" style="fill: blue" />
        </marker>

        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color: red" />
            <stop offset="100%" style="stop-color: green" />
        </linearGradient>
        <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%" style="color-interpolation: linearRGB">
            <stop offset="0%" style="stop-color: red" />
            <stop offset="100%" style="stop-color: green" />
        </linearGradient>
        <filter id="f1"><feGaussianBlur stdDeviation="6" /></filter>
        <filter id="f2" style="color-interpolation-filters: sRGB"><feGaussianBlur stdDeviation="6" /></filter>

        <clipPath id="cp-nonzero">
            <polygon points="150,110 122,198 198,144 102,144 178,198" />
        </clipPath>
        <clipPath id="cp-evenodd">
            <polygon points="450,110 422,198 498,144 402,144 478,198" style="clip-rule: evenodd" />
        </clipPath>
    </defs>

    <polyline points="80,80 130,30 180,80 230,30 280,80" />

    <polyline points="380,80 430,30 480,80 530,30 580,80"
              style="marker-start: url(#red-circle);marker-mid: none;marker-end: url(#blue-circle);" />

    <rect x="50" y="100" width="200" height="120" style="fill: url(#g1); filter: url(#f1);  clip-path: url(#cp-nonzero)" />
    <rect x="350" y="100" width="200" height="120" style="fill: url(#g2); filter: url(#f2);  clip-path: url(#cp-evenodd)" />
</svg>




<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- Path: d -->
    <path style="fill: red; d: path('M 420 30 L 520 30 L 470 110 Z')" />

    <!-- Vector-effect: non-scaling-stroke -->
    <path style="fill: none; stroke: red; stroke-width: 8; d: path('M 420 180 L 520 180'); vector-effect: non-scaling-stroke" />

</svg>


<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">

    <!-- flood-color, flood-opacity, lighting-color, stop-color, stop-opacity -->
    <rect x="50" y="50" width="150" height="100"
          style="fill: red; flood-color: blue; flood-opacity: 0.5;
                 lighting-color: yellow; stop-color: green; stop-opacity: 0.3" />

    <!-- mask-type, mask-mode, mask-clip, mask-origin, mask-composite -->
    <rect x="250" y="50" width="150" height="100"
          style="fill: green; mask-type: alpha; mask-mode: alpha;
                 mask-clip: padding-box; mask-origin: padding-box;
                 mask-composite: subtract" />

    <!-- mask-position, mask-repeat, mask-size -->
    <rect x="450" y="50" width="150" height="100"
          style="fill: blue; mask-position-x: 10px; mask-position-y: 20px;
                 mask-repeat: space; mask-size: 50px" />

    <!-- dominant-baseline -->
    <text x="50" y="240" font-size="20" style="dominant-baseline: central">Central Baseline</text>
    <text x="250" y="240" font-size="20" style="dominant-baseline: hanging">Hanging Baseline</text>

    <!-- mask shorthand -->
    <rect x="50" y="250" width="150" height="40"
          style="fill: purple; mask: padding-box subtract" />

    <!-- mask-position shorthand -->
    <rect x="250" y="250" width="150" height="40"
          style="fill: orange; mask-position: 15px 25px" />

</svg>


<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg"
     style="overflow: scroll;">

    <!-- width, height on rect -->
    <rect style="x: 20px; y: 20px; width: 100px; height: 80px; fill: red" />

    <!-- display: block on a g, opacity -->
    <g style="display: block; opacity: 0.7;">
        <rect style="x: 150px; y: 20px; width: 80px; height: 80px; fill: green" />
    </g>

    <!-- visibility: hidden -->
    <rect style="x: 260px; y: 20px; width: 80px; height: 80px; fill: blue; visibility: hidden;" />

    <!-- color, font-* properties on text -->
    <text x="20" y="150" font-size="16"
          style="color: purple; font-family: serif; font-size: 22px; font-weight: bold; font-style: italic; font-stretch: expanded;">
        Color &amp; Font
    </text>

    <!-- direction, writing-mode, unicode-bidi -->
    <text x="20" y="200" font-size="16"
          style="direction: rtl; unicode-bidi: bidi-override;">
        Text reversed
    </text>

    <!-- text-decoration, word-spacing, letter-spacing -->
    <text x="20" y="250" font-size="16"
          style="text-decoration: underline; word-spacing: 10px; letter-spacing: 3px;">
        Decorated text
    </text>

    <!-- cursor and pointer-events -->
    <rect style="x: 20px; y: 270px; width: 100px; height: 50px; fill: orange; cursor: pointer; pointer-events: none;" />

    <!-- filter -->
    <defs>
        <filter id="f1"><feGaussianBlur stdDeviation="3" /></filter>
    </defs>
    <rect style="x: 150px; y: 270px; width: 100px; height: 50px; fill: purple; filter: url(#f1);" />

    <!-- overflow and text-overflow on svg -->
    <svg x="280" y="270" width="120" height="60" viewBox="0 0 120 60"
         style="overflow: hidden;">
        <rect width="120" height="60" fill="cyan" />
        <text x="0" y="35" font-size="16"
              style="text-overflow: ellipsis;">
            Very long text that should be clipped
        </text>
    </svg>

</svg>
