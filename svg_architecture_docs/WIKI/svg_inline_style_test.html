<html>
<body>
<h2>SVG Inline Style Test</h2>

<!-- ═══════════════════════════════════════════════════════════════
     Chapter 6 — Styling: inherited text/font/writing/visual props
     ═══════════════════════════════════════════════════════════════ -->
<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg"
     style="fill: green; font-family: serif; font-size: 20px; font-weight: bold;
            font-style: italic; letter-spacing: 2px; word-spacing: 2px;
            text-rendering: auto; color: blue; direction: ltr;
            writing-mode: horizontal-tb; unicode-bidi: normal;
            visibility: visible; pointer-events: auto; image-rendering: auto;">

    <text x="200" y="40">Inherited</text>

    <text x="200" y="80"
          style="fill: red; font-family: sans-serif; font-size: 16px;
                 font-weight: normal; font-style: normal; letter-spacing: 1px;
                 word-spacing: 1px; text-rendering: optimizeLegibility;
                 color: maroon; direction: rtl; unicode-bidi: bidi-override;
                 pointer-events: none;">Overided</text>

    <rect x="20" y="120" width="100" height="40" style="fill: lime; opacity: 0.6;" />
    <rect x="140" y="120" width="100" height="40" style="fill: navy; pointer-events: none;" />
    <rect x="260" y="120" width="100" height="40" style="fill: purple; visibility: hidden;" />
</svg>

<!-- ═══════════════════════════════════════════════════════════════
     Chapter 7 — Geometry
     ═══════════════════════════════════════════════════════════════ -->
<svg width="700" height="200" xmlns="http://www.w3.org/2000/svg"
     style="fill: orange;">
    <circle style="cx: 90px; cy: 80px; r: 60px;" />
    <ellipse style="cx: 240px; cy: 80px; rx: 80px; ry: 40px;" />
    <rect style="x: 380px; y: 20px; width: 120px; height: 100px; rx: 20px; ry: 20px;" />
    <path d="M 540 20 L 640 20 L 590 110 Z" />
</svg>

<!-- ═══════════════════════════════════════════════════════════════
     Chapter 13 — Painting: fill, stroke, markers, paint-order,
     text-anchor, color-interpolation, shape-rendering, vector-effect
     ═══════════════════════════════════════════════════════════════ -->
<svg width="700" height="200" xmlns="http://www.w3.org/2000/svg"
     style="fill: green; stroke: red; stroke-width: 4; stroke-dasharray: 10 5;
            stroke-linecap: round; stroke-linejoin: round; stroke-miterlimit: 2;
            stroke-dashoffset: 3; stroke-opacity: 0.8; fill-opacity: 0.8;
            fill-rule: nonzero; clip-rule: evenodd;
            marker-start: url(#red-circle); marker-mid: url(#green-circle); marker-end: url(#blue-circle);">

    <defs>
        <marker id="red-circle" markerWidth="6" markerHeight="6" refX="3" refY="3">
            <circle cx="3" cy="3" r="3" fill="red" />
        </marker>
        <marker id="green-circle" markerWidth="6" markerHeight="6" refX="3" refY="3">
            <circle cx="3" cy="3" r="3" fill="green" />
        </marker>
        <marker id="blue-circle" markerWidth="6" markerHeight="6" refX="3" refY="3">
            <circle cx="3" cy="3" r="3" fill="blue" />
        </marker>
    </defs>

    <polyline points="120,60 64,180 216,130 24,130 176,180" />
</svg>

<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg"
     style="fill: green; font-size: 14px; paint-order: normal;
            text-anchor: end; text-rendering: auto;
            color-interpolation: linearRGB; color-interpolation-filters: linearRGB;
            shape-rendering: auto; opacity: 0.9;">

    <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color: red; stop-opacity: 1;" />
            <stop offset="100%" style="stop-color: blue; stop-opacity: 0.5;" />
        </linearGradient>
        <clipPath id="cp">
            <circle cx="150" cy="90" r="80" />
        </clipPath>
        <filter id="f">
            <feFlood flood-color="yellow" flood-opacity="0.4" width="100%" height="100%" />
            <feDiffuseLighting lighting-color="lime">
                <fePointDistant />
            </feDiffuseLighting>
        </filter>
        <mask id="m" mask-type="luminance">
            <rect x="0" y="0" width="700" height="300" fill="white" />
        </mask>
    </defs>

    <rect x="50" y="40" width="200" height="100"
          style="fill: url(#g); clip-path: url(#cp);" />
    <rect x="400" y="40" width="200" height="100"
          style="fill: url(#g); shape-rendering: crispEdges; color-interpolation: sRGB; filter: url(#f);" />

    <g transform="scale(2, 1)" style="mask: url(#m);">
        <line x1="10" y1="20" x2="140" y2="20"
              style="stroke: red; stroke-width: 4; vector-effect: non-scaling-stroke;" />
        <line x1="10" y1="40" x2="140" y2="40" style="stroke: blue; stroke-width: 4;" />
    </g>

    <text x="670" y="280">End</text>
</svg>

</body>
</html>
