<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" /></filter>
    <linearGradient id="gLayout" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3E5F5" /><stop offset="100%" stop-color="#E1BEE7" /></linearGradient>
  </defs>

  <rect width="1100" height="750" fill="#FAFBFC" />

  <!-- TITLE -->
  <rect x="0" y="0" width="1100" height="50" fill="#2E7D32" />
  <text x="550" y="20" fill="#FFF" font-size="15" font-weight="bold" text-anchor="middle">Stage 8: Fragment::Image Construction &amp; Display List (Pass 4)</text>
  <text x="550" y="38" fill="#DDD" font-size="10" text-anchor="middle">Rendering Update 4  ·  Layout Thread  ·  Cache HIT → Fragment::Image → GPU</text>

  <!-- Column header -->
  <rect x="300" y="65" width="500" height="26" rx="4" fill="#C45DE6" />
  <text x="550" y="83" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Layout Thread — Fragment::Image Construction Pipeline</text>

  <!-- Box 1 -->
  <rect x="320" y="105" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="122" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">make_fragments() — SVGElement(Some(vector_image))</text>
  <text x="550" y="138" fill="#555" font-size="9" text-anchor="middle">Receives vector_image=Some from svg_kind_size()</text>
  <text x="550" y="152" fill="#555" font-size="9" text-anchor="middle">base.rect set: PhysicalRect { (Au(0), Au(0)), (Au(12000), Au(12000)) }</text>
  <path d="M550,160 L550,183" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 2 -->
  <rect x="320" y="186" width="460" height="65" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="203" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">rasterize_vector_image(PendingImageId(1), (200,200))</text>
  <text x="550" y="219" fill="#50B86C" font-size="9" font-weight="bold">→ Keycache HIT! Returns Some(RasterImage)</text>
  <text x="550" y="235" fill="#555" font-size="9" text-anchor="middle">keycache[(PendingImageId(1), (200,200))] → RasterImage found</text>
  <text x="550" y="249" fill="#555" font-size="9" text-anchor="middle">Extracts ImageKey(IdNamespace(1), 91) from RasterImage.id</text>
  <path d="M550,251 L550,274" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 3 -->
  <rect x="320" y="277" width="460" height="75" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="294" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">Fragment::Image Constructed</text>
  <text x="550" y="310" fill="#555" font-size="9" text-anchor="middle">Fragment::Image {</text>
  <text x="550" y="326" fill="#555" font-size="9">image_key: Some(ImageKey(IdNamespace(1), 91)),</text>
  <text x="550" y="342" fill="#555" font-size="9">rect: (Au(0), Au(0), Au(12000), Au(12000)),</text>
  <text x="550" y="356" fill="#555" font-size="9">showing_broken_image_icon: false, image_rendering: Auto</text>
  <path d="M550,352 L550,375" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 4 -->
  <rect x="320" y="378" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="395" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">Fragment Tree → Display List Builder</text>
  <text x="550" y="411" fill="#555" font-size="9" text-anchor="middle">Fragment::Image assembled into fragment tree</text>
  <text x="550" y="425" fill="#555" font-size="9" text-anchor="middle">Tree → display list → WebRender command</text>
  <path d="M550,433 L550,456" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 5 -->
  <rect x="320" y="459" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="476" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">display_list.push_image() → WebRender</text>
  <text x="550" y="492" fill="#555" font-size="9" text-anchor="middle">push_image(ClipId::root(), LayoutRect(0,0,200,200), ImageKey(1,91), Auto)</text>
  <text x="550" y="506" fill="#555" font-size="9" text-anchor="middle">GPU renders 200×200 blue circle at (0,0)</text>

  <!-- Done banner -->
  <rect x="250" y="530" width="600" height="40" rx="20" fill="#2E7D32" filter="url(#sh)" />
  <text x="550" y="556" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">✅ Pipeline Complete — SVG Rendering Stable</text>

  <!-- VALUES SUMMARY -->
  <rect x="50" y="585" width="1000" height="145" rx="6" fill="#E8F5E9" stroke="#50B86C" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="607" fill="#2E7D32" font-size="11" font-weight="bold" text-anchor="middle">Final Fragment::Image — Concrete Values</text>

  <text x="80" y="630" fill="#333" font-size="10" font-weight="bold">Fragment::Image {</text>
  <text x="100" y="648" fill="#555" font-size="9">base: BaseFragment {</text>
  <text x="120" y="664" fill="#555" font-size="9">rect: PhysicalRect { x: Au(0), y: Au(0), width: Au(12000), height: Au(12000) },</text>
  <text x="120" y="680" fill="#555" font-size="9">clip: PhysicalRect { x: Au(0), y: Au(0), width: Au(12000), height: Au(12000) },</text>
  <text x="120" y="696" fill="#555" font-size="9">style: Arc::clone(&amp;computed_values),  // display: inline, 200×200</text>
  <text x="100" y="712" fill="#555" font-size="9">},</text>
  <text x="100" y="728" fill="#555" font-size="9">image_key: Some(ImageKey(IdNamespace(1), 91)),  // ← Assigned after rasterization</text>
  <text x="100" y="744" fill="#555" font-size="9">image_rendering: ImageRendering::Auto,</text>
  <text x="100" y="760" fill="#555" font-size="9">showing_broken_image_icon: false,  // ← SVG loaded and rendered successfully</text>
  <text x="80" y="776" fill="#333" font-size="10" font-weight="bold">}</text>

  <rect x="560" y="630" width="470" height="90" rx="4" fill="#FFF8E1" stroke="#E6A23C" stroke-width="1" />
  <text x="795" y="647" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">Final Pipeline State Summary</text>
  <text x="795" y="665" fill="#555" font-size="9" text-anchor="middle">4 rendering updates, 3 bridges, ~3 threads</text>
  <text x="795" y="683" fill="#555" font-size="9" text-anchor="middle">Pre-pass: DOM built, styles computed</text>
  <text x="795" y="701" fill="#555" font-size="9" text-anchor="middle">Pass 1: source=None → queue serialization</text>
  <text x="795" y="719" fill="#555" font-size="9" text-anchor="middle">Bridge: XML serialization → base64 → data URL</text>
  <text x="795" y="737" fill="#555" font-size="9" text-anchor="middle">Pass 2: cache Pending → async VectorImage load</text>
  <text x="795" y="755" fill="#555" font-size="9" text-anchor="middle">Pass 3: DataAvailable → rasterize → cache</text>
  <text x="795" y="773" fill="#555" font-size="9" text-anchor="middle">Pass 4: Fragment::Image → Display List → GPU</text>
</svg>
