<h1><a href="https://www.w3.org/TR/SVG2/styling.html">SVG 2 — Chapter 6: Styling</a></h1>

<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg"
     style="color: blue; font-family: serif; font-size: 20px; font-weight: normal;
            font-style: normal; font-stretch: condensed; word-spacing: 2px; letter-spacing: 1px;
            text-rendering: auto; direction: ltr; white-space: normal;
            visibility: visible; cursor: pointer; pointer-events: all;">

    <text x="200" y="40">Inherited</text>

    <text x="200" y="80"
          style="color: red; font-family: sans-serif; font-size: 16px; font-weight: bold;
                 font-style: italic; font-stretch: expanded;
                 text-decoration: underline; word-spacing: 5px; letter-spacing: 3px;
                 text-rendering: geometricPrecision; white-space: nowrap; direction: rtl;
                 unicode-bidi: bidi-override;">Overided</text>

    <rect x="20" y="120" width="100" height="40" style="fill: green; opacity: 0.6; cursor: help;" />

    <rect x="140" y="120" width="100" height="40" style="fill: blue; pointer-events: none;" />

    <rect x="260" y="120" width="100" height="40" style="fill: purple; visibility: hidden;" />

    <rect x="380" y="120" width="100" height="40" style="fill: orange; filter: blur(2px);" />

    <g style="display: none;">
        <rect x="500" y="120" width="100" height="40" style="fill: pink;" />
    </g>

    <svg x="20" y="200" width="150" height="60" viewBox="0 0 150 60"
         style="overflow: hidden;">
        <rect width="150" height="60" fill="cyan" />
        <text x="0" y="35" font-size="16" style="text-overflow: ellipsis;">
            Very long clipped text
        </text>
    </svg>

</svg>
