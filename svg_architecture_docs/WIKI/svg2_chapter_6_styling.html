<h1><a href="https://www.w3.org/TR/SVG2/styling.html">SVG 2 — Chapter 6: Styling</a></h1>

<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg"
     style="color: blue; display: block; visibility: visible; overflow: visible;
            cursor: pointer; direction: ltr; unicode-bidi: normal; writing-mode: horizontal-tb;
            pointer-events: all; filter: none;">

    <text x="20" y="30" font-size="14"
          style="color: red; font-family: serif; font-size: 18px; font-weight: bold;
                 font-style: italic; font-stretch: expanded;
                 text-decoration: underline; text-overflow: ellipsis;
                 word-spacing: 5px; letter-spacing: 2px;
                 dominant-baseline: hanging; alignment-baseline: middle;
                 baseline-shift: 3px;
                 text-rendering: geometricPrecision;">
        Styling: color, font, text, baseline
    </text>

    <text x="20" y="60" font-size="14"
          style="direction: rtl; unicode-bidi: bidi-override; white-space: pre;">
        RTL override text
    </text>

    <rect x="20" y="80" width="120" height="40" style="fill: green; opacity: 0.6; cursor: help;" />

    <rect x="20" y="130" width="120" height="40" style="fill: blue; pointer-events: none;" />

    <rect x="20" y="180" width="120" height="40" style="fill: purple; visibility: hidden;" />

    <rect x="160" y="80" width="120" height="140" style="fill: orange; filter: url(#blur);" />

    <svg x="300" y="80" width="150" height="60" viewBox="0 0 150 60"
         style="overflow: hidden;">
        <rect width="150" height="60" fill="cyan" />
        <text x="0" y="35" font-size="16"
              style="text-overflow: ellipsis; white-space: nowrap;">
            Very long clipped text
        </text>
    </svg>

    <g style="display: none;">
        <rect x="300" y="160" width="100" height="40" style="fill: pink;" />
    </g>

    <defs>
        <filter id="blur"><feGaussianBlur stdDeviation="2" /></filter>
    </defs>
</svg>
