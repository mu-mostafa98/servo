<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" /></filter>
    <linearGradient id="gLayout" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3E5F5" /><stop offset="100%" stop-color="#E1BEE7" /></linearGradient>
  </defs>

  <rect width="1100" height="820" fill="#FAFBFC" />

  <!-- TITLE -->
  <rect x="0" y="0" width="1100" height="50" fill="#2E7D32" />
  <text x="550" y="20" fill="#FFF" font-size="15" font-weight="bold" text-anchor="middle">Stage 6: Raster Cache Hit + Fragment::Image Construction (Pass 4)</text>
  <text x="550" y="38" fill="#DDD" font-size="10" text-anchor="middle">Rendering Update 4  ·  Layout Thread  ·  Cache HIT → Fragment::Image → GPU</text>

  <!-- Column header -->
  <rect x="300" y="65" width="500" height="26" rx="4" fill="#C45DE6" />
  <text x="550" y="83" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Layout Thread — Raster Cache HIT, Fragment::Image Pipeline</text>

  <!-- Context box -->
  <rect x="100" y="105" width="900" height="45" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="122" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">Context: Pass 4 — Triggered by Rasterization Complete Notification</text>
  <text x="550" y="138" fill="#555" font-size="9" text-anchor="middle">Fourth rendering update. svg_kind_size() produces same result as Pass 3 (DataAvailable → vector_image=Some).</text>
  <path d="M550,150 L550,173" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 1 -->
  <rect x="320" y="176" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="193" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">svg_kind_size() — Same Result as Pass 3</text>
  <text x="550" y="209" fill="#50B86C" font-size="9" font-weight="bold">source=Some(url) → DataAvailable(VectorImage) → vector_image=Some</text>
  <text x="550" y="223" fill="#888" font-size="9" text-anchor="middle">VectorImage still cached from Pass 3 — no change</text>
  <path d="M550,231 L550,254" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 2 -->
  <rect x="320" y="257" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="274" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">make_fragments() — SVGElement(Some(vector_image))</text>
  <text x="550" y="290" fill="#555" font-size="9" text-anchor="middle">Receives vector_image=Some from svg_kind_size()</text>
  <text x="550" y="304" fill="#555" font-size="9" text-anchor="middle">base.rect set: PhysicalRect { (Au(0), Au(0)), (Au(12000), Au(12000)) }</text>
  <path d="M550,312 L550,335" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 3 -->
  <rect x="320" y="338" width="460" height="65" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="355" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">rasterize_vector_image(PendingImageId(1), (200,200))</text>
  <text x="550" y="371" fill="#50B86C" font-size="9" font-weight="bold">→ Keycache HIT! Returns Some(RasterImage)</text>
  <text x="550" y="387" fill="#555" font-size="9" text-anchor="middle">keycache[(PendingImageId(1), (200,200))] → RasterImage found</text>
  <text x="550" y="401" fill="#555" font-size="9" text-anchor="middle">Extracts ImageKey(IdNamespace(1), 91) from RasterImage.id</text>
  <path d="M550,403 L550,426" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 4 -->
  <rect x="320" y="429" width="460" height="75" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="446" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">Fragment::Image Constructed</text>
  <text x="550" y="462" fill="#555" font-size="9" text-anchor="middle">Fragment::Image {</text>
  <text x="550" y="478" fill="#555" font-size="9">image_key: Some(ImageKey(IdNamespace(1), 91)),</text>
  <text x="550" y="494" fill="#555" font-size="9">rect: (Au(0), Au(0), Au(12000), Au(12000)),</text>
  <text x="550" y="506" fill="#555" font-size="9">showing_broken_image_icon: false, image_rendering: Auto</text>
  <path d="M550,504 L550,527" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 5 -->
  <rect x="320" y="530" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="547" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">Fragment Tree → Display List Builder</text>
  <text x="550" y="563" fill="#555" font-size="9" text-anchor="middle">Fragment::Image assembled into fragment tree</text>
  <text x="550" y="577" fill="#555" font-size="9" text-anchor="middle">Tree → display list → WebRender command</text>
  <path d="M550,585 L550,608" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 6 -->
  <rect x="320" y="611" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="628" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">display_list.push_image() → WebRender</text>
  <text x="550" y="644" fill="#555" font-size="9" text-anchor="middle">push_image(ClipId::root(), LayoutRect(0,0,200,200), ImageKey(1,91), Auto)</text>
  <text x="550" y="658" fill="#555" font-size="9" text-anchor="middle">GPU renders 200×200 blue circle at (0,0)</text>

  <!-- Done banner -->
  <rect x="250" y="682" width="600" height="40" rx="20" fill="#2E7D32" filter="url(#sh)" />
  <text x="550" y="708" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">✅ Pipeline Complete — SVG Rendering Stable</text>

  <!-- VALUES SUMMARY -->
  <rect x="50" y="735" width="1000" height="75" rx="6" fill="#E8F5E9" stroke="#50B86C" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="755" fill="#2E7D32" font-size="11" font-weight="bold" text-anchor="middle">Final State — Concrete Values After Stage 6 (Pass 4)</text>

  <text x="80" y="777" fill="#555" font-size="9">Fragment::Image { image_key: Some(ImageKey(1,91)), rect: 200×200, showing_broken_image_icon: false }</text>
  <text x="80" y="795" fill="#555" font-size="9">4 rendering updates · 6 stages · 2 bridges · Display list pushed → WebRender → GPU renders blue circle</text>
</svg>
