<html>
<body>
<h2>SVG Presentation Attributes — Full Test</h2>
<p>One element per type, all SVG presentation attributes verified.</p>

<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- stop-color, stop-opacity -->
    <linearGradient id="g">
      <stop offset="0%" stop-color="red" stop-opacity="1" />
      <stop offset="100%" stop-color="blue" stop-opacity="0.5" />
    </linearGradient>
    <!-- flood-color, flood-opacity -->
    <filter id="f">
      <feFlood flood-color="green" flood-opacity="0.3" width="100%" height="100%" />
      <!-- lighting-color -->
      <feDiffuseLighting lighting-color="yellow">
        <fePointDistant />
      </feDiffuseLighting>
    </filter>
    <!-- mask-type -->
    <mask id="m" mask-type="alpha">
      <rect x="0" y="0" width="100" height="100" fill="white" />
    </mask>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 Z" fill="black" />
    </marker>
    <clipPath id="clip">
      <circle cx="60" cy="60" r="55" />
    </clipPath>
  </defs>

  <!-- RECT: paint, geometry, visual properties -->
  <rect x="20" y="20" width="200" height="100" rx="10" ry="10"
        fill="green" fill-opacity="0.8" fill-rule="nonzero"
        stroke="blue" stroke-width="3" stroke-dasharray="8,4" stroke-dashoffset="2"
        stroke-linecap="round" stroke-linejoin="bevel" stroke-miterlimit="4"
        stroke-opacity="0.8" paint-order="stroke fill"
        shape-rendering="crispEdges" color-interpolation="linearRGB"
        color-interpolation-filters="sRGB" vector-effect="non-scaling-stroke"
        clip-rule="evenodd"
        opacity="0.9" color="red" visibility="visible"
        pointer-events="visiblePainted" image-rendering="auto" />

  <!-- CIRCLE: geometry, clip-path, opacity -->
  <circle cx="350" cy="70" r="50" fill="green" clip-path="url(#clip)"
          opacity="0.85" />

  <!-- POLYLINE: markers, stroke -->
  <polyline points="500,20 580,60 650,120" fill="none" stroke="purple" stroke-width="2"
        marker-start="url(#arrow)" marker-mid="url(#arrow)" marker-end="url(#arrow)"
        visibility="visible" />

  <!-- PATH: gradient fill, stroke, visual -->
  <path d="M 20,200 L 100,160 L 180,200 Z" fill="url(#g)" stroke="maroon" stroke-width="2"
        opacity="0.95" visibility="visible" />

  <!-- TEXT: all text/font/bidi properties -->
  <text x="350" y="200" fill="navy" font-size="20" text-anchor="middle"
        font-family="serif" font-style="italic" font-weight="bold"
        letter-spacing="1" word-spacing="2"
        direction="ltr" unicode-bidi="normal" writing-mode="horizontal-tb"
        text-rendering="optimizeLegibility" />
</svg>
</body>
</html>
