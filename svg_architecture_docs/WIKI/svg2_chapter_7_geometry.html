<h1><a href="https://svgwg.org/svg2-draft/geometry.html">SVG 2 — Chapter 7: Geometry</a></h1>

<svg width="700" height="150" xmlns="http://www.w3.org/2000/svg" style="fill: orange;">
    
    <!-- Geometry: cx, cy, r on circles -->
    <circle style="cx: 80px; cy: 60px; r: 50px" />
    
    <!-- Geometry: rx, ry, x, y, width and hight on rects -->
    <rect style="x: 200px; y: 30px; width: 120px; height: 70px; rx: 20px; ry: 20px" />
    
</svg>
