<h1><a href="https://svgwg.org/svg2-draft/geometry.html">SVG 2 — Chapter 7: Geometry</a></h1>

<svg width="700" height="250" xmlns="http://www.w3.org/2000/svg" style="fill: orange;">

    <!-- Circle: cx, cy, r -->
    <circle style="cx: 60px; cy: 60px; r: 50px" />

    <!-- Ellipse: cx, cy, rx, ry -->
    <ellipse style="cx: 200px; cy: 60px; rx: 60px; ry: 30px" />

    <!-- Rect: x, y, width, height, rx, ry -->
    <rect style="x: 340px; y: 10px; width: 120px; height: 100px; rx: 20px; ry: 20px" />

    <!-- Path: d via CSS path() -->
    <path style="d: path('M 540 10 L 640 10 L 590 110 Z')" />

</svg>
