<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" /></filter>
    <linearGradient id="gScript" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E3F2FD" /><stop offset="100%" stop-color="#BBDEFB" /></linearGradient>
  </defs>

  <rect width="1100" height="650" fill="#FAFBFC" />

  <!-- TITLE -->
  <rect x="0" y="0" width="1100" height="50" fill="#F57C00" />
  <text x="550" y="20" fill="#FFF" font-size="15" font-weight="bold" text-anchor="middle">Stage 3: Serialization Dispatch (Bridge 1 → 2)</text>
  <text x="550" y="38" fill="#DDD" font-size="10" text-anchor="middle">Post-Reflow Hook  ·  Script Thread  ·  NOT a layout pass</text>

  <!-- Column header -->
  <rect x="300" y="65" width="500" height="26" rx="4" fill="#4A90D9" />
  <text x="550" y="83" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Script Thread — Post-Reflow Processing in Window::reflow()</text>

  <!-- Context box: Window::reflow() -->
  <rect x="100" y="105" width="900" height="45" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="122" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">Context: Window::reflow() — After layout.borrow_mut().reflow(reflow) returns</text>
  <text x="550" y="138" fill="#555" font-size="9" text-anchor="middle">svg_kind_size() already ran (Pass 1) and queued the SVG element. Now in the post-reflow cleanup phase.</text>
  <path d="M550,150 L550,173" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 1: handle_pending_images_post_reflow -->
  <rect x="320" y="176" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="193" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">handle_pending_images_post_reflow()</text>
  <text x="550" y="209" fill="#555" font-size="9" text-anchor="middle">window.rs:3521 — Post-reflow hook called after every reflow</text>
  <text x="550" y="223" fill="#555" font-size="9" text-anchor="middle">Checks pending_svg_elements_for_serialization from layout context</text>
  <path d="M550,231 L550,254" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 2: Iterate pending list -->
  <rect x="320" y="257" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="274" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">Iterate pending_svg_elements_for_serialization</text>
  <text x="550" y="290" fill="#555" font-size="9" text-anchor="middle">Drains Mutex&lt;Vec&lt;UntrustedNodeAddress&gt;&gt; from layout context</text>
  <text x="550" y="304" fill="#888" font-size="9" text-anchor="middle">pending count: 1 → [UntrustedNodeAddress(0x...)] — the &lt;svg&gt; node</text>
  <path d="M550,312 L550,335" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 3: Dispatch to serialize -->
  <rect x="320" y="338" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="355" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">For each: serialize_and_cache_subtree(node)</text>
  <text x="550" y="371" fill="#555" font-size="9" text-anchor="middle">Converts UntrustedNodeAddress → &amp;SVGSVGElement via unsafe get</text>
  <text x="550" y="385" fill="#888" font-size="9" text-anchor="middle">→ Dispatches to Stage 4 serialization (detailed in stage4 SVG)</text>
  <path d="M550,393 L550,416" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 4: dirty -->
  <rect x="320" y="419" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="436" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">dirty(NodeDamage::Other) → Triggers Next Reflow</text>
  <text x="550" y="452" fill="#D9534F" font-size="9" font-weight="bold">node.dirty(NodeDamage::Other) → restyle needed</text>
  <text x="550" y="466" fill="#555" font-size="9" text-anchor="middle">needs_rendering_update() = true → schedule timer → Pass 2</text>

  <!-- VALUES SUMMARY -->
  <rect x="50" y="495" width="1000" height="120" rx="6" fill="#FFF8E1" stroke="#E6A23C" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="517" fill="#E65100" font-size="11" font-weight="bold" text-anchor="middle">Concrete Values After Stage 3 (Bridge 1→2)</text>

  <text x="80" y="540" fill="#333" font-size="10" font-weight="bold">Layout Context State (post-reflow) {</text>
  <text x="100" y="558" fill="#555" font-size="9">pending_svg_elements_for_serialization: Mutex&lt;Vec&lt;UntrustedNodeAddress&gt;&gt; = [ 0xDEADBEEF ]</text>
  <text x="100" y="576" fill="#555" font-size="9">→ drained by handle_pending_images_post_reflow(), each dispatched to serialize_and_cache_subtree()</text>
  <text x="100" y="594" fill="#D9534F" font-size="9" font-weight="bold">dirty(NodeDamage::Other) → next rendering update scheduled (Pass 2)</text>
  <text x="100" y="612" fill="#555" font-size="9">ReflowResult contains pending_svg_list extracted from layout context before returning to script</text>

  <rect x="560" y="540" width="470" height="65" rx="4" fill="#FFEBEE" stroke="#D9534F" stroke-width="1" />
  <text x="795" y="557" fill="#D9534F" font-size="10" font-weight="bold" text-anchor="middle">⚠ Key: Post-Reflow Hook, NOT a Pass</text>
  <text x="795" y="575" fill="#555" font-size="9" text-anchor="middle">This runs inside Window::reflow() AFTER layout returns.</text>
  <text x="795" y="591" fill="#555" font-size="9" text-anchor="middle">svg_kind_size() does NOT run here — this is script-thread</text>
  <text x="795" y="607" fill="#555" font-size="9" text-anchor="middle">post-processing, not a layout pass.</text>
</svg>
