<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" /></filter>
    <linearGradient id="gScript" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E3F2FD" /><stop offset="100%" stop-color="#BBDEFB" /></linearGradient>
  </defs>

  <rect width="1100" height="850" fill="#FAFBFC" />

  <!-- TITLE -->
  <rect x="0" y="0" width="1100" height="50" fill="#F57C00" />
  <text x="550" y="20" fill="#FFF" font-size="15" font-weight="bold" text-anchor="middle">Stage 4: Subtree Serialization &amp; Data URL Caching</text>
  <text x="550" y="38" fill="#DDD" font-size="10" text-anchor="middle">Bridge 1→2  ·  Script Thread  ·  Post-Reflow Hook</text>

  <!-- Column header -->
  <rect x="300" y="65" width="500" height="26" rx="4" fill="#4A90D9" />
  <text x="550" y="83" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Script Thread — serialize_and_cache_subtree() Pipeline</text>

  <!-- Box 1: serialize_and_cache_subtree entry -->
  <rect x="320" y="105" width="460" height="45" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="122" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">serialize_and_cache_subtree() — Entry</text>
  <text x="550" y="138" fill="#555" font-size="9" text-anchor="middle">svgsvgelement.rs:81 — Top-level serialization orchestrator</text>
  <path d="M550,150 L550,173" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 2: process_use_elements -->
  <rect x="320" y="176" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="193" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">process_use_elements() — Clone &lt;use&gt; Subtrees</text>
  <text x="550" y="209" fill="#555" font-size="9" text-anchor="middle">Scans for &lt;use&gt; elements; clones referenced subtrees</text>
  <text x="550" y="223" fill="#888" font-size="9" text-anchor="middle">Test case: no &lt;use&gt; elements → no-op</text>
  <path d="M550,231 L550,254" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 3: xml_serialize -->
  <rect x="320" y="257" width="460" height="65" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="274" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">xml_serialize(TraversalScope::IncludeNode)</text>
  <text x="550" y="290" fill="#555" font-size="9" text-anchor="middle">Walks DOM subtree → produces XML string (~231 bytes)</text>
  <text x="550" y="306" fill="#50B86C" font-size="9" font-weight="bold">"&lt;svg xmlns=... width=200 height=200 viewBox=...&gt;&lt;circle .../&gt;&lt;/svg&gt;"</text>
  <text x="550" y="320" fill="#888" font-size="9" text-anchor="middle">xml5ever / Node impl — standard XML serialization</text>
  <path d="M550,322 L550,345" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 4: base64 encode -->
  <rect x="320" y="348" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="365" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">base64::engine::general_purpose::STANDARD.encode()</text>
  <text x="550" y="381" fill="#555" font-size="9" text-anchor="middle">Encodes XML bytes to base64 (~334 chars)</text>
  <text x="550" y="395" fill="#888" font-size="9" text-anchor="middle">"PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmci..."</text>
  <path d="M550,403 L550,426" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 5: data URL -->
  <rect x="320" y="429" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="446" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">ServoUrl::parse("data:image/svg+xml;base64,...")</text>
  <text x="550" y="462" fill="#555" font-size="9" text-anchor="middle">Wraps base64 as a data URL → stores on SVGSVGElement</text>
  <text x="550" y="476" fill="#50B86C" font-size="9" font-weight="bold">data:image/svg+xml;base64,PHN2ZyB4bWxucz0i...</text>
  <path d="M550,484 L550,504" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 6: cache the result -->
  <rect x="320" y="507" width="460" height="55" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="524" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">cached_serialized_data_url = Some(Ok(url))</text>
  <text x="550" y="540" fill="#D9534F" font-size="9" font-weight="bold">*self.cached_serialized_data_url.borrow_mut() = Some(Ok(url))</text>
  <text x="550" y="554" fill="#555" font-size="9" text-anchor="middle">DomRefCell updated — now source=Some(url) for next layout pass</text>
  <path d="M550,562 L550" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 7: dirty -->
  <rect x="320" y="585" width="460" height="45" rx="5" fill="url(#gScript)" stroke="#4A90D9" stroke-width="1" />
  <text x="550" y="602" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">cleanup_cloned_nodes() → dirty(NodeDamage::Other)</text>
  <text x="550" y="618" fill="#555" font-size="9" text-anchor="middle">Removes &lt;use&gt; clones; marks node dirty → triggers Pass 2</text>

  <!-- VALUES SUMMARY -->
  <rect x="50" y="655" width="1000" height="160" rx="6" fill="#FFF8E1" stroke="#E6A23C" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="677" fill="#E65100" font-size="11" font-weight="bold" text-anchor="middle">Concrete Values After Stage 4 (Bridge 1→2 Serialization)</text>

  <text x="80" y="700" fill="#333" font-size="10" font-weight="bold">Serialization Output {</text>
  <text x="100" y="718" fill="#555" font-size="9">xml_source: "&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\"&gt;&lt;circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"blue\"/&gt;&lt;/svg&gt;"</text>
  <text x="100" y="736" fill="#555" font-size="9">base64: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiB2aWV3Qm94PSIwIDAgMjAwIDIwMCI+PGNpcmNsZSBjeD0iMTAwIiBjeT0iMTAwIiByPSI1MCIgZmlsbD0iYmx1ZSIvPjwvc3ZnPg=="</text>
  <text x="100" y="754" fill="#D9534F" font-size="9" font-weight="bold">cached_serialized_data_url: DomRefCell::new(Some(Ok(ServoUrl("data:image/svg+xml;base64,..."))))</text>
  <text x="100" y="772" fill="#555" font-size="9">state: None → Some(Ok(url)) — data URL cached for next pass</text>
  <text x="100" y="790" fill="#555" font-size="9">dirty(NodeDamage::Other) set → needs_rendering_update() = true → schedule timer → Pass 2</text>
  <text x="80" y="808" fill="#333" font-size="10" font-weight="bold">}</text>

  <rect x="560" y="700" width="470" height="105" rx="4" fill="#E8F5E9" stroke="#50B86C" stroke-width="1" />
  <text x="795" y="717" fill="#2E7D32" font-size="10" font-weight="bold" text-anchor="middle">✅ Source Now Available for Layout</text>
  <text x="795" y="735" fill="#555" font-size="9" text-anchor="middle">After this bridge, the SVGSVGElement has:</text>
  <text x="795" y="753" fill="#555" font-size="9" text-anchor="middle">• cached_serialized_data_url = Some(Ok(url))</text>
  <text x="795" y="771" fill="#555" font-size="9" text-anchor="middle">• When svg_kind_size() runs next (Pass 2),</text>
  <text x="795" y="787" fill="#555" font-size="9" text-anchor="middle">  it will read source=Some(url) and query</text>
  <text x="795" y="803" fill="#555" font-size="9" text-anchor="middle">  the image cache for the data URL.</text>
</svg>
