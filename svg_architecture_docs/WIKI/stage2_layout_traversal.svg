<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#4A90D9" /></marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" /></filter>
    <linearGradient id="gLayout" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3E5F5" /><stop offset="100%" stop-color="#E1BEE7" /></linearGradient>
  </defs>

  <rect width="1100" height="750" fill="#FAFBFC" />

  <!-- TITLE -->
  <rect x="0" y="0" width="1100" height="50" fill="#7B1FA2" />
  <text x="550" y="20" fill="#FFF" font-size="15" font-weight="bold" text-anchor="middle">Stage 2: Layout Traversal &amp; Replaced Content Dispatch</text>
  <text x="550" y="38" fill="#DDD" font-size="10" text-anchor="middle">Pass 1  ·  Layout Thread  ·  Source=None → Queue Serialization</text>

  <!-- Column header -->
  <rect x="300" y="65" width="500" height="26" rx="4" fill="#C45DE6" />
  <text x="550" y="83" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Layout Thread — Replaced Content Pipeline</text>

  <!-- Box 1: handle_reflow entry -->
  <rect x="320" y="105" width="460" height="45" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="122" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">handle_reflow() → restyle_and_build_trees()</text>
  <text x="550" y="138" fill="#555" font-size="9" text-anchor="middle">PendingRestyles → traverse DOM, resolve computed styles</text>
  <path d="M550,150 L550,173" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 2: traverse_element -->
  <rect x="320" y="176" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="193" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">traverse_element() — Classify Display Behavior</text>
  <text x="550" y="209" fill="#555" font-size="9" text-anchor="middle">Reads computed display: inline → GeneratingBox::Inline</text>
  <text x="550" y="223" fill="#555" font-size="9" text-anchor="middle">Children recurse; &lt;circle&gt; gets regular element box</text>
  <path d="M550,231 L550,254" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 3: Contents::for_element -->
  <rect x="320" y="257" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="274" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">Contents::for_element() — Replaced Content Check</text>
  <text x="550" y="290" fill="#555" font-size="9" text-anchor="middle">Checks if element is replaced; SVG → ReplacedContentKind::SVGElement</text>
  <text x="550" y="304" fill="#888" font-size="9" text-anchor="middle">ReplacedContentKind::SVGElement { vector_image: None, has_viewbox: true }</text>
  <path d="M550,312 L550,335" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 4: svg_kind_size - central -->
  <rect x="320" y="338" width="460" height="65" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="355" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">svg_kind_size() — source=None Branch</text>
  <text x="550" y="371" fill="#D9534F" font-size="9" font-weight="bold">SVGElementData::data() reads source = None</text>
  <text x="550" y="387" fill="#555" font-size="9" text-anchor="middle">Computes NaturalSizes from width/height attributes</text>
  <text x="550" y="399" fill="#555" font-size="9" text-anchor="middle">width=200 → Au(12000), height=200 → Au(12000), ratio=1.0</text>
  <path d="M550,403 L550,426" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 5: queue_svg_element -->
  <rect x="320" y="429" width="460" height="55" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="446" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">queue_svg_element_for_serialization()</text>
  <text x="550" y="462" fill="#555" font-size="9" text-anchor="middle">Stores UntrustedNodeAddress in pending_svg_elements_for_serialization</text>
  <text x="550" y="476" fill="#888" font-size="9" text-anchor="middle">pending: Mutex&lt;Vec&lt;UntrustedNodeAddress&gt;&gt; = [addr_of_&lt;svg&gt;]</text>
  <path d="M550,484 L550,504" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Box 6: Return to fragment builder -->
  <rect x="320" y="507" width="460" height="45" rx="5" fill="url(#gLayout)" stroke="#C45DE6" stroke-width="1" />
  <text x="550" y="524" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">Returns → Fragment Builder → No Fragment::Image</text>
  <text x="550" y="540" fill="#555" font-size="9" text-anchor="middle">vector_image: None → make_fragments() returns vec![]</text>

  <!-- VALUES SUMMARY -->
  <rect x="50" y="570" width="1000" height="140" rx="6" fill="#FFF8E1" stroke="#E6A23C" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="592" fill="#E65100" font-size="11" font-weight="bold" text-anchor="middle">Concrete Values After Stage 2 (Pass 1)</text>

  <text x="80" y="615" fill="#333" font-size="10" font-weight="bold">SVGElementData (via LayoutDom borrow from DOM node) {</text>
  <text x="100" y="635" fill="#555" font-size="9">svg_id: "b3c8d2f4-1e5a-4d7c-9b0a-6f2e3d1c8a7b",</text>
  <text x="100" y="653" fill="#D9534F" font-size="9" font-weight="bold">source: None,  // ← No cached data URL — KEY FLAG</text>
  <text x="100" y="671" fill="#555" font-size="9">width: Some(AttrValue::LengthPercentage("200", Some(Px(200.0)))),</text>
  <text x="100" y="689" fill="#555" font-size="9">height: Some(AttrValue::LengthPercentage("200", Some(Px(200.0)))),</text>
  <text x="100" y="707" fill="#555" font-size="9">view_box: Some(AttrValue::String("0 0 200 200")),</text>
  <text x="80" y="725" fill="#333" font-size="10" font-weight="bold">}</text>

  <!-- Legend / key insight -->
  <rect x="560" y="615" width="470" height="85" rx="4" fill="#FFEBEE" stroke="#D9534F" stroke-width="1" />
  <text x="795" y="632" fill="#D9534F" font-size="10" font-weight="bold" text-anchor="middle">⚠ Key: source = None → Queue Serialization</text>
  <text x="795" y="650" fill="#555" font-size="9" text-anchor="middle">svg_kind_size() branches on source:</text>
  <text x="795" y="666" fill="#555" font-size="9" text-anchor="middle">• source=None → queue element + return (no image)</text>
  <text x="795" y="682" fill="#555" font-size="9" text-anchor="middle">• source=Some(url) → query image cache</text>
  <text x="795" y="698" fill="#555" font-size="9" text-anchor="middle">This queue drives the Bridge 1→2 serialization</text>
</svg>
