<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1680" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#D9534F" /></marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#50B86C" /></marker>
    <marker id="arrO" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#E6A23C" /></marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020" /></filter>
    <linearGradient id="gStart" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A90D9" /><stop offset="100%" stop-color="#357ABD" /></linearGradient>
    <linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F7FA" /><stop offset="100%" stop-color="#EBEEF2" /></linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF3E0" /><stop offset="100%" stop-color="#FFE0B2" /></linearGradient>
    <linearGradient id="gRet" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8F5E9" /><stop offset="100%" stop-color="#C8E6C9" /></linearGradient>
    <linearGradient id="gHide" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5F5" /><stop offset="100%" stop-color="#EEEEEE" /></linearGradient>
    <linearGradient id="gCont" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E3F2FD" /><stop offset="100%" stop-color="#BBDEFB" /></linearGradient>
    <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8F5E9" /><stop offset="100%" stop-color="#C8E6C9" /></linearGradient>
  </defs>

  <rect width="1100" height="1680" fill="#FAFBFC" />

  <rect x="0" y="0" width="1100" height="50" fill="#4A90D9" />
  <text x="550" y="30" fill="#FFF" font-size="16" font-weight="bold" text-anchor="middle">traverse_element() — Flowchart</text>
  <text x="550" y="70" fill="#888" font-size="11" text-anchor="middle">Layout Thread • Stage 2.1 • DOM Traversal &amp; Display Type Dispatch</text>
  <text x="550" y="84" fill="#4A90D9" font-size="10" font-weight="bold" text-anchor="middle">◆ Pass 1 (P1): First Layout Pass — DOM → Style → Display Dispatch ◆</text>
  <text x="550" y="97" fill="#888" font-size="9" text-anchor="middle">P1 = first layout traversal  •  Replaced SVG path → serialization queue (P2) → async cache (P3) → cached render (P4)</text>

  <!-- ======================== 1. ENTRY ======================== -->
  <rect x="375" y="90" width="350" height="42" rx="21" fill="url(#gStart)" filter="url(#sh)" />
  <text x="550" y="117" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">traverse_element(element, context, handler)</text>
  <path d="M550,132 v18" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- ======================== 2. SVG TRACE ======================== -->
  <rect x="200" y="163" width="700" height="48" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" filter="url(#sh)" />
  <rect x="870" y="167" width="24" height="14" rx="3" fill="#4A90D9" opacity="0.85" />
  <text x="882" y="177" fill="#FFF" font-size="8" text-anchor="middle" opacity="0.9">P1</text>
  <text x="550" y="183" fill="#333" font-size="11" font-weight="bold">SVG Check — is element SVGSVGElement?</text>
  <text x="550" y="198" fill="#888" font-size="10">[SVG_TRACE_STAGE_2.1] traverse_element() Start — if SVG</text>
  <path d="M550,211 v18" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- ======================== 3. GET STYLE ======================== -->
  <rect x="200" y="242" width="700" height="48" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" filter="url(#sh)" />
  <rect x="870" y="246" width="24" height="14" rx="3" fill="#4A90D9" opacity="0.85" />
  <text x="882" y="256" fill="#FFF" font-size="8" text-anchor="middle" opacity="0.9">P1</text>
  <text x="550" y="262" fill="#333" font-size="11" font-weight="bold">Get Style &amp; Create NodeAndStyleInfo</text>
  <text x="550" y="277" fill="#666" font-size="10">element.style() + NodeAndStyleInfo::new(element, style)</text>
  <path d="M550,290 v20" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- ======================== 4. DISPLAY DECISION ======================== -->
  <polygon points="550,390 740,335 550,280 360,335" fill="url(#gD)" stroke="#E6A23C" stroke-width="1.5" filter="url(#sh)" />
  <rect x="748" y="328" width="24" height="14" rx="3" fill="#4A90D9" opacity="0.85" />
  <text x="760" y="338" fill="#FFF" font-size="8" text-anchor="middle" opacity="0.9">P1</text>
  <text x="550" y="330" fill="#E65100" font-size="11" font-weight="bold" text-anchor="middle">Display::from()</text>
  <text x="550" y="347" fill="#E65100" font-size="11" font-weight="bold" text-anchor="middle">on info.style.get_box().display</text>

  <!-- ========= None (left) ========= -->
  <path d="M360,335 L100,335 L100,430 L180,430" fill="none" stroke="#D9534F" stroke-width="1.5" marker-end="url(#arrR)" />
  <text x="225" y="328" fill="#D9534F" font-size="10" font-weight="bold">Display::None</text>
  <rect x="180" y="430" width="260" height="42" rx="6" fill="url(#gHide)" stroke="#999" stroke-width="1" filter="url(#sh)" />
  <text x="310" y="450" fill="#666" font-size="11" font-weight="bold">Do Nothing</text>
  <text x="310" y="465" fill="#999" font-size="9">=> hidden element, no box generated</text>
  <path d="M310,472 L200,472 L200,910 L540,910" fill="none" stroke="#555" stroke-width="1.5" />

  <!-- ========= Contents (right upper) ========= -->
  <path d="M740,335 L880,335 L880,430 L780,430" fill="none" stroke="#E6A23C" stroke-width="1.5" marker-end="url(#arrO)" />
  <text x="830" y="328" fill="#E6A23C" font-size="10" font-weight="bold">Display::Contents</text>

  <rect x="700" y="430" width="300" height="70" rx="6" fill="url(#gCont)" stroke="#64B5F6" stroke-width="1" filter="url(#sh)" />
  <text x="850" y="450" fill="#1565C0" font-size="11" font-weight="bold">ReplacedContents::for_element()</text>
  <text x="850" y="467" fill="#555" font-size="10">Check if element is replaced</text>
  <text x="850" y="484" fill="#555" font-size="10">returns Some(replaced)?</text>

  <!-- Contents sub-decision -->
  <polygon points="850,550 920,520 850,490 780,520" fill="url(#gD)" stroke="#E6A23C" stroke-width="1" />
  <text x="850" y="517" fill="#E65100" font-size="9" font-weight="bold" text-anchor="middle">Some?</text>

  <path d="M780,520 L730,520 L730,580 L530,580" fill="none" stroke="#D9534F" stroke-width="1.5" marker-end="url(#arrR)" />
  <text x="750" y="513" fill="#D9534F" font-size="9" font-weight="bold">Yes</text>

  <path d="M920,520 L950,520 L950,580 L850,580" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrG)" />
  <text x="935" y="513" fill="#50B86C" font-size="9" font-weight="bold">No</text>

  <!-- Yes: replaced display:contents = display:none -->
  <rect x="380" y="580" width="260" height="42" rx="6" fill="url(#gHide)" stroke="#999" stroke-width="1" filter="url(#sh)" />
  <text x="510" y="600" fill="#666" font-size="11" font-weight="bold">element.unset_all_boxes()</text>
  <text x="510" y="615" fill="#999" font-size="9">=> display:contents on replaced = display:none</text>
  <path d="M510,622 L510,648 L960,648 L960,1080 L550,1080" fill="none" stroke="#555" stroke-width="1.5" />

  <!-- No: setup display:contents -->
  <rect x="700" y="580" width="300" height="65" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" filter="url(#sh)" />
  <rect x="970" y="584" width="24" height="14" rx="3" fill="#4A90D9" opacity="0.85" />
  <text x="982" y="594" fill="#FFF" font-size="8" text-anchor="middle" opacity="0.9">P1</text>
  <text x="850" y="600" fill="#333" font-size="11" font-weight="bold">Setup Display:Contents Box</text>
  <text x="850" y="617" fill="#666" font-size="10">SharedInlineStyles::from_info_and_context()</text>
  <text x="850" y="633" fill="#666" font-size="10">box_slot.set(LayoutBox::DisplayContents(...))</text>

  <path d="M850,645 L850,670 L540,670" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- ========= GeneratingBox (down) ========= -->
  <path d="M550,390 L550,440 L700,440 L700,648 L960,648 L960,955 L555,955 L555,968" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrG)" />
  <text x="560" y="420" fill="#50B86C" font-size="10" font-weight="bold">Display::GeneratingBox(display)</text>

  <!-- ======================== 5. CONTENTS FLOW ======================== -->

  <!-- Contents sub-branch: replaced (Yes) goes direct to exit; non-replaced (No) continues below -->

  <!-- handler.enter_display_contents -->
  <rect x="400" y="650" width="280" height="42" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" filter="url(#sh)" />
  <text x="540" y="670" fill="#333" font-size="11" font-weight="bold">handler.enter_display_contents()</text>
  <text x="540" y="684" fill="#888" font-size="9">Notify handler about display:contents</text>

  <path d="M540,692 L540,720" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- traverse_children_of -->
  <rect x="280" y="720" width="520" height="75" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" filter="url(#sh)" />
  <text x="540" y="740" fill="#333" font-size="11" font-weight="bold">traverse_children_of() — Recurse Into Children</text>
  <text x="540" y="756" fill="#888" font-size="9" font-style="italic">For each flat_tree child:</text>
  <text x="540" y="770" fill="#666" font-size="10">Text node => handler.handle_text()</text>
  <text x="540" y="784" fill="#666" font-size="10">Element node => traverse_element() [recursive]</text>

  <path d="M540,795 L540,830" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- handler.leave_display_contents -->
  <rect x="400" y="830" width="280" height="42" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" filter="url(#sh)" />
  <text x="540" y="850" fill="#333" font-size="11" font-weight="bold">handler.leave_display_contents()</text>
  <text x="540" y="864" fill="#888" font-size="9">End of display:contents block</text>

  <!-- Merge for all 3 paths — None path is at line 51 (before boxes, behind traverse_children_of) -->
  <path d="M540,872 L540,910" fill="none" stroke="#555" stroke-width="1.5" />
  <path d="M540,910 L960,910 L960,1080 L550,1080" fill="none" stroke="#555" stroke-width="1.5" />

  <!-- ======================== 6. GENERATING BOX ======================== -->
  <rect x="200" y="970" width="700" height="95" rx="6" fill="url(#gBox)" stroke="#4CAF50" stroke-width="1" filter="url(#sh)" />
  <rect x="870" y="974" width="24" height="14" rx="3" fill="#4A90D9" opacity="0.85" />
  <text x="882" y="984" fill="#FFF" font-size="8" text-anchor="middle" opacity="0.9">P1</text>
  <text x="550" y="992" fill="#2E7D32" font-size="11" font-weight="bold">Display::GeneratingBox(display)</text>
  <text x="550" y="1012" fill="#555" font-size="10">Step 1: Contents::for_element(element, context) → contents type</text>
  <text x="550" y="1028" fill="#555" font-size="10">Step 2: display.used_value_for_contents(&amp;contents)</text>
  <text x="550" y="1044" fill="#555" font-size="10">Step 3: handler.handle_element(&amp;info, display, contents, box_slot)</text>
  <path d="M550,1065 v35" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- ======================== 7. SVG END ======================== -->
  <rect x="200" y="1100" width="700" height="48" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" filter="url(#sh)" />
  <text x="550" y="1120" fill="#333" font-size="11" font-weight="bold">End — SVG trace</text>
  <text x="550" y="1135" fill="#888" font-size="10">[SVG_TRACE_STAGE_2.1] traverse_element() End — if SVG</text>
  <path d="M550,1148 v18" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- ======================== 8. RETURN ======================== -->
  <rect x="350" y="1180" width="400" height="42" rx="21" fill="url(#gRet)" stroke="#50B86C" stroke-width="2" filter="url(#sh)" />
  <text x="550" y="1206" fill="#2E7D32" font-size="13" font-weight="bold" text-anchor="middle">RETURN (handler processed)</text>

  <!-- ======================================================================== -->
  <!-- SUB: Contents::for_element() -->
  <!-- ======================================================================== -->
  <g transform="translate(50, 1260)">
    <rect width="1000" height="155" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1" filter="url(#sh)" />
    <text x="500" y="20" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Sub-call: Contents::for_element() — determines element content classification</text>

    <!-- Replaced check -->
    <polygon points="140,60 230,40 140,20 50,40" fill="url(#gD)" stroke="#E6A23C" stroke-width="1" />
    <text x="140" y="37" fill="#E65100" font-size="8" font-weight="bold" text-anchor="middle">ReplacedContents</text>
    <text x="140" y="49" fill="#E65100" font-size="8" font-weight="bold" text-anchor="middle">Some?</text>

    <path d="M230,40 L310,40 L310,55 L370,55" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrG)" />
    <text x="260" y="33" fill="#50B86C" font-size="9" font-weight="bold">YES</text>

    <rect x="370" y="42" width="150" height="26" rx="4" fill="url(#gBox)" stroke="#4CAF50" stroke-width="1" />
    <text x="445" y="59" fill="#2E7D32" font-size="10" font-weight="bold" text-anchor="middle">Replaced(replaced)</text>

    <path d="M50,40 L0,40 L0,95" fill="none" stroke="#D9534F" stroke-width="1.5" marker-end="url(#arrR)" />

    <!-- Widget check -->
    <polygon points="120,115 210,95 120,75 30,95" fill="url(#gD)" stroke="#E6A23C" stroke-width="1" />
    <text x="120" y="92" fill="#E65100" font-size="8" font-weight="bold" text-anchor="middle">Widget?</text>
    <text x="120" y="104" fill="#E65100" font-size="7" font-weight="bold" text-anchor="middle">input/select/textarea</text>

    <path d="M210,95 L530,95 L530,78" fill="none" stroke="#E6A23C" stroke-width="1.5" marker-end="url(#arrO)" />
    <text x="370" y="88" fill="#E6A23C" font-size="9" font-weight="bold">YES</text>

    <rect x="530" y="80" width="150" height="26" rx="4" fill="url(#gHide)" stroke="#999" stroke-width="1" />
    <text x="605" y="97" fill="#666" font-size="10" font-weight="bold" text-anchor="middle">Widget(OfElement)</text>

    <path d="M30,95 L0,95 L0,115 L310,115" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />
    <text x="120" y="126" fill="#555" font-size="9" font-weight="bold" text-anchor="middle">NO</text>

    <rect x="310" y="102" width="150" height="26" rx="4" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
    <text x="385" y="119" fill="#333" font-size="10" font-weight="bold" text-anchor="middle">NonReplaced(OfElement)</text>

    <!-- SVG trace annotations -->
    <text x="500" y="54" fill="#888" font-size="9">[SVG_TRACE_STAGE_2.2.2] if SVG: eprintln Start / End</text>
    <text x="500" y="68" fill="#888" font-size="9">Widget = HTMLInputElement | HTMLSelectElement | HTMLTextAreaElement</text>
    <text x="500" y="88" fill="#4A90D9" font-size="9" font-weight="bold" text-anchor="middle">Pass flow (when SVGSVGElement):</text>
    <text x="500" y="102" fill="#4A90D9" font-size="9" text-anchor="middle">Replaced → P1 (queue serialization) → P2 (serialize) → P3 (cache load) → P4 (cached render)</text>
    <text x="500" y="116" fill="#888" font-size="9" text-anchor="middle">NonReplaced → P1 (normal box generation, no SVG async pipeline)</text>
  </g>

  <!-- ======================================================================== -->
  <!-- LEGEND -->
  <!-- ======================================================================== -->
  <g transform="translate(50, 1420)">
    <rect width="1000" height="135" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1" filter="url(#sh)" />
    <text x="500" y="18" fill="#333" font-size="11" font-weight="bold" text-anchor="middle">Key</text>

    <rect x="20" y="50" width="70" height="18" rx="9" fill="url(#gStart)" />
    <text x="105" y="64" fill="#555" font-size="10">Entry / Exit</text>

    <rect x="20" y="72" width="70" height="18" rx="3" fill="url(#gD)" stroke="#E6A23C" stroke-width="1" />
    <text x="105" y="86" fill="#555" font-size="10">Decision / Branch</text>

    <rect x="20" y="94" width="70" height="18" rx="3" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
    <text x="105" y="108" fill="#555" font-size="10">Process Step</text>

    <rect x="360" y="50" width="70" height="18" rx="3" fill="url(#gBox)" stroke="#4CAF50" stroke-width="1" />
    <text x="445" y="64" fill="#555" font-size="10">Box Generation</text>

    <rect x="360" y="72" width="70" height="18" rx="3" fill="url(#gCont)" stroke="#64B5F6" stroke-width="1" />
    <text x="445" y="86" fill="#555" font-size="10">Contents Handling</text>

    <rect x="360" y="94" width="70" height="18" rx="3" fill="url(#gHide)" stroke="#999" stroke-width="1" />
    <text x="445" y="108" fill="#555" font-size="10">Skip / No-op</text>

    <!-- Pass badge -->
    <rect x="700" y="50" width="24" height="14" rx="3" fill="#4A90D9" opacity="0.85" />
    <text x="712" y="60" fill="#FFF" font-size="8" text-anchor="middle">P1</text>
    <text x="735" y="62" fill="#555" font-size="10">Pass 1 (First Layout)</text>

    <line x1="700" y1="80" x2="740" y2="80" stroke="#50B86C" stroke-width="2" />
    <text x="750" y="84" fill="#555" font-size="10">Yes / OK</text>

    <line x1="700" y1="100" x2="740" y2="100" stroke="#D9534F" stroke-width="2" />
    <text x="750" y="104" fill="#555" font-size="10">No / None</text>

    <line x1="700" y1="120" x2="740" y2="120" stroke="#E6A23C" stroke-width="2" />
    <text x="750" y="124" fill="#555" font-size="10">Branch</text>
  </g>

  <rect x="50" y="1560" width="1000" height="28" rx="4" fill="#F0F7FF" stroke="#4A90D9" stroke-width="0.5" />
  <text x="550" y="1578" fill="#4A90D9" font-size="10" font-weight="bold" text-anchor="middle">◆ All paths in this chart execute in Pass 1 (P1) during first layout ◆</text>
  <text x="550" y="1605" fill="#999" font-size="9" text-anchor="middle">SVG tracing: [SVG_TRACE_STAGE_2.1] at function entry/exit  •  [SVG_TRACE_STAGE_2.2.2] inside Contents::for_element()</text>
  <text x="550" y="1625" fill="#888" font-size="9" text-anchor="middle">Pass color reference: P1 #4A90D9  |  P2 #E6A23C  |  P3 #C45DE6  |  P4 #50B86C  —  see thread_swimlanes.svg</text>
</svg>
