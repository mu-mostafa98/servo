<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1520" width="1000" height="1520" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <marker id="arrowR" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#D9534F" /></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#50B86C" /></marker>
    <linearGradient id="gStart" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A90D9" /><stop offset="100%" stop-color="#357ABD" /></linearGradient>
    <linearGradient id="gProcess" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F7FA" /><stop offset="100%" stop-color="#EBEEF2" /></linearGradient>
    <linearGradient id="gDecision" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF3E0" /><stop offset="100%" stop-color="#FFE0B2" /></linearGradient>
    <linearGradient id="gReturn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8F5E9" /><stop offset="100%" stop-color="#C8E6C9" /></linearGradient>
    <linearGradient id="gSub" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3E5F5" /><stop offset="100%" stop-color="#E1BEE7" /></linearGradient>
    <linearGradient id="gBadgeP1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5A9EE6" /><stop offset="100%" stop-color="#4A90D9" /></linearGradient>
    <linearGradient id="gBadgeP3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CC71E8" /><stop offset="100%" stop-color="#C45DE6" /></linearGradient>
    <linearGradient id="gBadgeP4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5FC47E" /><stop offset="100%" stop-color="#50B86C" /></linearGradient>
  </defs>

  <rect width="1000" height="1520" fill="#FAFBFC" />

  <!-- Title -->
  <rect x="0" y="0" width="1000" height="50" fill="#4A90D9" />
  <text x="500" y="30" fill="#FFF" font-size="16" font-weight="bold" text-anchor="middle">svg_kind_size() - Flowchart</text>
  <text x="500" y="70" fill="#888" font-size="11" text-anchor="middle">Layout Thread - Stage 2.6 - SVG Element Size Resolution &amp; Cache Lookup</text>
  <text x="500" y="84" fill="#555" font-size="10" font-weight="bold" text-anchor="middle">Multi-Pass Function: P1 (first layout) / P3 (cache wait re-entry) / P4 (cached-size re-entry)</text>
  <text x="500" y="97" fill="#888" font-size="9" text-anchor="middle">P1: source=None - queue serialization  |  P3: source=Some, not cached - return empty  |  P4: source=Some, cached - full size</text>

  <!-- ENTRY -->
  <rect x="300" y="110" width="400" height="42" rx="21" fill="url(#gStart)" />
  <text x="500" y="137" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">svg_kind_size(svg_data, context, node)</text>
  <path d="M500,152 v18" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="710" y="110" width="24" height="14" rx="3" fill="url(#gBadgeP1)" opacity="0.85" />
  <text x="722" y="120" fill="#FFF" font-size="8" text-anchor="middle">P1</text>

  <!-- SETUP -->
  <rect x="150" y="183" width="700" height="55" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <text x="500" y="204" fill="#333" font-size="11" font-weight="bold">Setup: StyleBuilder &amp; Computed Context</text>
  <text x="500" y="220" fill="#666" font-size="10">Get parent_style - StyleBuilder - Context::new()</text>
  <path d="M500,238 v15" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- PARSE -->
  <rect x="150" y="266" width="700" height="55" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <text x="500" y="287" fill="#333" font-size="11" font-weight="bold">Parse Attributes: width &amp; height</text>
  <text x="500" y="303" fill="#666" font-size="10">attr_to_computed(svg_data.width) - width</text>
  <text x="500" y="315" fill="#666" font-size="10">attr_to_computed(svg_data.height) - height</text>
  <path d="M500,321 v15" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- RATIO -->
  <polygon points="500,490 680,440 500,390 320,440" fill="url(#gDecision)" stroke="#E6A23C" stroke-width="1.5" />
  <text x="500" y="436" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">width &amp; height</text>
  <text x="500" y="452" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">both non-zero?</text>

  <!-- Yes -->
  <path d="M320,440 L120,440 L120,510 L200,510" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrowG)" />
  <text x="215" y="433" fill="#50B86C" font-size="10" font-weight="bold">Yes</text>
  <rect x="200" y="510" width="260" height="50" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <text x="330" y="532" fill="#333" font-size="11" font-weight="bold">ratio = width / height</text>
  <text x="330" y="548" fill="#666" font-size="10">width.px() / height.px()</text>

  <!-- No -->
  <path d="M680,440 L860,440 L860,510 L760,510" fill="none" stroke="#D9534F" stroke-width="1.5" marker-end="url(#arrowR)" />
  <text x="765" y="433" fill="#D9534F" font-size="10" font-weight="bold">No</text>
  <rect x="540" y="510" width="260" height="50" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <text x="670" y="532" fill="#333" font-size="11" font-weight="bold">ratio = ratio_from_view_box()</text>
  <text x="670" y="548" fill="#666" font-size="10">viewBox aspect ratio fallback</text>

  <!-- Merge -->
  <path d="M330,560 L330,585 L500,585" fill="none" stroke="#555" stroke-width="1.5" />
  <path d="M670,560 L670,585 L500,585" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- NATURAL SIZE -->
  <rect x="150" y="600" width="700" height="50" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <text x="500" y="622" fill="#333" font-size="11" font-weight="bold">Create NaturalSizes</text>
  <text x="500" y="638" fill="#666" font-size="10">NaturalSizes { width, height, ratio }</text>
  <path d="M500,650 v15" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- SVG SOURCE -->
  <polygon points="500,730 680,680 500,630 320,680" fill="url(#gDecision)" stroke="#E6A23C" stroke-width="1.5" />
  <text x="500" y="676" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">svg_data.source</text>
  <text x="500" y="692" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">available?</text>

  <!-- None - P1 path -->
  <path d="M320,680 L100,680 L100,770 L180,770" fill="none" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrowR)" />
  <text x="215" y="673" fill="#D9534F" font-size="10" font-weight="bold">None</text>
  <rect x="225" y="665" width="24" height="14" rx="3" fill="url(#gBadgeP1)" opacity="0.85" />
  <text x="237" y="675" fill="#FFF" font-size="8" text-anchor="middle">P1</text>
  <rect x="180" y="770" width="280" height="55" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <rect x="430" y="774" width="24" height="14" rx="3" fill="url(#gBadgeP1)" opacity="0.85" />
  <text x="442" y="784" fill="#FFF" font-size="8" text-anchor="middle">P1</text>
  <text x="320" y="790" fill="#333" font-size="11" font-weight="bold">Queue for Serialization</text>
  <text x="320" y="806" fill="#666" font-size="9">queue_svg_element_for_serialization()</text>
  <text x="320" y="819" fill="#999" font-size="9">= SVG not yet serialized = vector_image = None</text>
  <path d="M320,825 L320,900 L410,900" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Some - P3/P4 path -->
  <path d="M680,680 L870,680 L870,770 L780,770" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrowG)" />
  <text x="765" y="673" fill="#50B86C" font-size="10" font-weight="bold">Some(url)</text>
  <rect x="540" y="770" width="280" height="55" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <rect x="792" y="774" width="24" height="14" rx="3" fill="url(#gBadgeP3)" opacity="0.85" />
  <text x="804" y="784" fill="#FFF" font-size="8" text-anchor="middle">P3</text>
  <rect x="792" y="788" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="804" y="798" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
  <text x="680" y="790" fill="#333" font-size="11" font-weight="bold">Resolve Source</text>
  <text x="680" y="806" fill="#666" font-size="9">svg_source_result.ok()</text>
  <text x="680" y="819" fill="#999" font-size="9">= Some(url) OR None(Err)</text>
  <path d="M680,825 v75" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Merge -->
  <path d="M410,900 L500,900" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- CACHED IMAGE -->
  <polygon points="500,965 680,915 500,865 320,915" fill="url(#gDecision)" stroke="#E6A23C" stroke-width="1.5" />
  <text x="500" y="911" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">get_cached_image_for_url()</text>
  <text x="500" y="927" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">result type?</text>

  <!-- DataAvailable - P4 -->
  <path d="M680,915 L870,915 L870,985 L760,985" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrowG)" />
  <text x="750" y="908" fill="#50B86C" font-size="10" font-weight="bold">DataAvailable</text>
  <rect x="845" y="902" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="857" y="912" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
  <rect x="680" y="985" width="260" height="60" rx="6" fill="url(#gSub)" stroke="#BA68C8" stroke-width="1" />
  <rect x="910" y="989" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="922" y="999" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
  <text x="810" y="1005" fill="#6A1B9A" font-size="11" font-weight="bold">Image::Vector match</text>
  <text x="810" y="1022" fill="#666" font-size="10">vector_image.svg_id = svg_data.svg_id</text>
  <text x="810" y="1037" fill="#666" font-size="10">= vector_image</text>
  <path d="M810,1045 L810,1065 L610,1065" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Err / Pending - P3 -->
  <path d="M320,915 L100,915 L100,988 L180,988" fill="none" stroke="#C45DE6" stroke-width="1.5" marker-end="url(#arrowR)" />
  <text x="215" y="908" fill="#C45DE6" font-size="10" font-weight="bold">Err / Pending</text>
  <rect x="290" y="902" width="24" height="14" rx="3" fill="url(#gBadgeP3)" opacity="0.85" />
  <text x="302" y="912" fill="#FFF" font-size="8" text-anchor="middle">P3</text>
  <rect x="180" y="988" width="240" height="42" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <rect x="390" y="992" width="24" height="14" rx="3" fill="url(#gBadgeP3)" opacity="0.85" />
  <text x="402" y="1002" fill="#FFF" font-size="8" text-anchor="middle">P3</text>
  <text x="300" y="1006" fill="#333" font-size="11" font-weight="bold">vector_image = None</text>
  <text x="300" y="1023" fill="#999" font-size="9">= skip to return</text>
  <path d="M300,1030 L300,1065 L390,1065" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Merge -->
  <path d="M390,1065 L500,1065" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M610,1065 L560,1065" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- RETURN -->
  <rect x="120" y="1085" width="760" height="55" rx="6" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
  <text x="500" y="1105" fill="#333" font-size="11" font-weight="bold">Build Return Values</text>
  <text x="500" y="1120" fill="#555" font-size="9">ReplacedContentKind::SVGElement { vector_image, has_viewbox: svg_data.view_box.is_some() }</text>
  <text x="500" y="1134" fill="#555" font-size="9">+ NaturalSizes { width, height, ratio }</text>
  <path d="M500,1140 v15" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="225" y="1168" width="550" height="48" rx="24" fill="url(#gReturn)" stroke="#50B86C" stroke-width="2" />
  <text x="500" y="1193" fill="#2E7D32" font-size="13" font-weight="bold" text-anchor="middle">RETURN (ReplacedContentKind, NaturalSizes)</text>
  <text x="500" y="1208" fill="#4CAF50" font-size="10" text-anchor="middle">= Used for fragment construction &amp; display list building</text>

  <!-- LEGEND -->
  <g transform="translate(30, 1260)">
    <rect width="940" height="115" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1" />
    <text x="470" y="18" fill="#333" font-size="11" font-weight="bold" text-anchor="middle">Key</text>
    <rect x="15" y="28" width="70" height="18" rx="9" fill="url(#gStart)" />
    <text x="100" y="42" fill="#555" font-size="10">Entry / Exit</text>
    <rect x="15" y="50" width="70" height="18" rx="3" fill="url(#gDecision)" stroke="#E6A23C" stroke-width="1" />
    <text x="100" y="64" fill="#555" font-size="10">Decision / Branch</text>
    <rect x="15" y="72" width="70" height="18" rx="3" fill="url(#gProcess)" stroke="#CCC" stroke-width="1" />
    <text x="100" y="86" fill="#555" font-size="10">Process Step</text>
    <!-- Pass badges -->
    <rect x="310" y="28" width="24" height="14" rx="3" fill="url(#gBadgeP1)" opacity="0.85" />
    <text x="322" y="38" fill="#FFF" font-size="8" text-anchor="middle">P1</text>
    <text x="345" y="40" fill="#555" font-size="10">Pass 1 (first layout)</text>
    <rect x="310" y="48" width="24" height="14" rx="3" fill="url(#gBadgeP3)" opacity="0.85" />
    <text x="322" y="58" fill="#FFF" font-size="8" text-anchor="middle">P3</text>
    <text x="345" y="60" fill="#555" font-size="10">Pass 3 (cache wait)</text>
    <rect x="310" y="68" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
    <text x="322" y="78" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
    <text x="345" y="80" fill="#555" font-size="10">Pass 4 (cached render)</text>
    <rect x="630" y="28" width="70" height="18" rx="3" fill="url(#gSub)" stroke="#BA68C8" stroke-width="1" />
    <text x="715" y="42" fill="#555" font-size="10">Pattern Match</text>
    <line x1="630" y1="58" x2="675" y2="58" stroke="#50B86C" stroke-width="2" />
    <text x="685" y="62" fill="#555" font-size="10">Yes / OK branch</text>
    <line x1="630" y1="78" x2="675" y2="78" stroke="#D9534F" stroke-width="2" />
    <text x="685" y="82" fill="#555" font-size="10">No / None branch</text>
  </g>

  <rect x="30" y="1390" width="940" height="62" rx="4" fill="#F0F7FF" stroke="#4A90D9" stroke-width="0.5" />
  <text x="500" y="1405" fill="#333" font-size="10" font-weight="bold" text-anchor="middle">Pass execution summary for svg_kind_size():</text>
  <text x="500" y="1421" fill="#555" font-size="9" text-anchor="middle">P1 (#4A90D9): source=None - queue serialization, return None</text>
  <text x="500" y="1435" fill="#555" font-size="9" text-anchor="middle">P3 (#C45DE6): source=Some, not cached - return None, reflow will retry</text>
  <text x="500" y="1445" fill="#555" font-size="9" text-anchor="middle">P4 (#50B86C): source=Some, cached - return full SVGElement with size</text>

  <rect x="30" y="1465" width="940" height="28" rx="4" fill="#F8FFF8" stroke="#50B86C" stroke-width="0.5" />
  <text x="500" y="1483" fill="#555" font-size="9" text-anchor="middle">Pass color reference: P1 #4A90D9  |  P2 #E6A23C  |  P3 #C45DE6  |  P4 #50B86C - see thread_swimlanes.svg</text>

  <text x="500" y="1510" fill="#999" font-size="9" text-anchor="middle">All SVG_TRACE_STAGE_2.2.2.1.1 eprintln! calls originate from this function</text>
</svg>
