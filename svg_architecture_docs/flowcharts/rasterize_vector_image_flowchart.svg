<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1580" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#555" /></marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#D9534F" /></marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#50B86C" /></marker>
    <marker id="arrP" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#C45DE6" /></marker>
    <linearGradient id="gStart" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#50B86C" /><stop offset="100%" stop-color="#3D9A56" /></linearGradient>
    <linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F7FA" /><stop offset="100%" stop-color="#EBEEF2" /></linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF3E0" /><stop offset="100%" stop-color="#FFE0B2" /></linearGradient>
    <linearGradient id="gRet" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8F5E9" /><stop offset="100%" stop-color="#C8E6C9" /></linearGradient>
    <linearGradient id="gSub" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3E5F5" /><stop offset="100%" stop-color="#E1BEE7" /></linearGradient>
    <linearGradient id="gBadgeP4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#50B86C" /><stop offset="100%" stop-color="#3D9A56" /></linearGradient>
    <linearGradient id="gAsync" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E3F2FD" /><stop offset="100%" stop-color="#BBDEFB" /></linearGradient>
  </defs>

  <rect width="950" height="1580" fill="#FAFBFC" />

  <!-- Title -->
  <rect x="0" y="0" width="950" height="50" fill="#50B86C" />
  <text x="475" y="30" fill="#FFF" font-size="15" font-weight="bold" text-anchor="middle">rasterize_vector_image() — Flowchart</text>
  <text x="475" y="70" fill="#888" font-size="11" text-anchor="middle">Image Cache Thread (net::image_cache) — Stage 6 — SVG Rasterization</text>
  <text x="475" y="84" fill="#50B86C" font-size="10" font-weight="bold" text-anchor="middle">Pass 4 (P4): SVG Rasterization via resvg + tiny_skia</text>
  <text x="475" y="97" fill="#888" font-size="9" text-anchor="middle">Called from make_fragments() in Layout thread when cached SVG image is available</text>

  <!-- ENTRY -->
  <rect x="275" y="115" width="400" height="42" rx="21" fill="url(#gStart)" />
  <text x="475" y="140" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">rasterize_vector_image(image_id, size, svg_id)</text>
  <path d="M475,157 v18" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />
  <rect x="685" y="115" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="697" y="125" fill="#FFF" font-size="8" text-anchor="middle">P4</text>

  <!-- Lock store + lookup vector_image -->
  <rect x="150" y="188" width="650" height="55" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <rect x="770" y="192" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="782" y="202" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
  <text x="475" y="208" fill="#333" font-size="11" font-weight="bold">Lock Store &amp; Lookup Vector Image</text>
  <text x="475" y="224" fill="#666" font-size="10">store.lock() → store.vector_images.get(&amp;image_id)</text>
  <path d="M475,243 v15" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Unknown image_id? -->
  <polygon points="475,320 610,280 475,240 340,280" fill="url(#gD)" stroke="#E6A23C" stroke-width="1.5" />
  <text x="475" y="276" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">vector_image</text>
  <text x="475" y="292" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">found?</text>

  <!-- No - unknown -->
  <path d="M340,280 L140,280 L140,350 L220,350" fill="none" stroke="#D9534F" stroke-width="1.5" marker-end="url(#arrR)" />
  <text x="230" y="273" fill="#D9534F" font-size="10" font-weight="bold">No</text>
  <rect x="220" y="350" width="220" height="42" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <text x="330" y="370" fill="#333" font-size="11" font-weight="bold">Warn + Return None</text>
  <text x="330" y="384" fill="#666" font-size="9">warn!("Unknown image id ...")</text>
  <path d="M330,392 L330,420 L475,420" fill="none" stroke="#555" stroke-width="1.5" />

  <!-- Yes - proceed -->
  <path d="M610,280 L780,280 L780,350 L690,350" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrG)" />
  <text x="700" y="273" fill="#50B86C" font-size="10" font-weight="bold">Yes</text>

  <!-- Check rasterized cache -->
  <polygon points="475,430 610,390 475,350 340,390" fill="url(#gD)" stroke="#E6A23C" stroke-width="1.5" />
  <text x="475" y="386" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">rasterized cache</text>
  <text x="475" y="402" fill="#E65100" font-size="10" font-weight="bold" text-anchor="middle">entry exists?</text>

  <!-- Yes - cached -->
  <path d="M610,390 L780,390 L780,455 L690,455" fill="none" stroke="#50B86C" stroke-width="1.5" marker-end="url(#arrG)" />
  <text x="700" y="383" fill="#50B86C" font-size="10" font-weight="bold">Yes</text>
  <rect x="690" y="455" width="220" height="50" rx="6" fill="url(#gRet)" stroke="#50B86C" stroke-width="1" />
  <text x="800" y="477" fill="#2E7D32" font-size="11" font-weight="bold">Return Cached Result</text>
  <text x="800" y="493" fill="#666" font-size="9">return Some(result.clone())</text>
  <path d="M800,505 L800,530 L475,530" fill="none" stroke="#555" stroke-width="1.5" />

  <!-- No - continue -->
  <path d="M340,390 L140,390 L140,458 L220,458" fill="none" stroke="#E6A23C" stroke-width="1.5" marker-end="url(#arr)" />
  <text x="230" y="383" fill="#E6A23C" font-size="10" font-weight="bold">No</text>

  <!-- Map svg_id -->
  <rect x="220" y="458" width="260" height="65" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <rect x="450" y="462" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="462" y="472" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
  <text x="350" y="478" fill="#333" font-size="11" font-weight="bold">Map SVG ID to Image ID</text>
  <text x="350" y="494" fill="#666" font-size="9">svg_id_image_id_map: svg_id → image_id</text>
  <text x="350" y="508" fill="#999" font-size="9">Evict old mapping if exists</text>
  <path d="M350,523 L350,555 L475,555" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Merge point -->
  <path d="M475,530 L475,555" fill="none" stroke="#555" stroke-width="1.5" />

  <!-- Record requested size -->
  <rect x="150" y="568" width="650" height="50" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <rect x="770" y="572" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="782" y="582" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
  <text x="475" y="588" fill="#333" font-size="11" font-weight="bold">Record Requested Size</text>
  <text x="475" y="604" fill="#666" font-size="10">image_id_size_map: image_id → vec![requested_size]</text>
  <path d="M475,618 v18" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Spawn thread pool -->
  <rect x="150" y="649" width="650" height="55" rx="6" fill="url(#gAsync)" stroke="#4A90D9" stroke-width="1.5" />
  <rect x="770" y="653" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
  <text x="782" y="663" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
  <text x="475" y="669" fill="#1565C0" font-size="11" font-weight="bold">Spawn Thread Pool Task (Async Rasterization)</text>
  <text x="475" y="685" fill="#666" font-size="10">self.thread_pool.spawn(move || { ... })</text>
  <text x="475" y="698" fill="#999" font-size="9">Returns None immediately — rasterization happens in background</text>
  <path d="M475,704 v15" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- ========== ASYNC TASK BOUNDARY ========== -->
  <rect x="130" y="732" width="690" height="305" rx="8" fill="none" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="140" y="724" width="160" height="16" rx="4" fill="#4A90D9" />
  <text x="220" y="736" fill="#FFF" font-size="9" font-weight="bold" text-anchor="middle">Thread Pool Task</text>

  <!-- Natural size -->
  <rect x="200" y="752" width="550" height="40" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <text x="475" y="770" fill="#333" font-size="11" font-weight="bold">Get Natural Size from SVG Tree</text>
  <text x="475" y="784" fill="#666" font-size="10">vector_image.svg_tree.size().to_int_size()</text>
  <path d="M475,792 v12" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Clamp size -->
  <rect x="200" y="817" width="550" height="50" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <text x="475" y="835" fill="#333" font-size="11" font-weight="bold">Clamp to MAX_SVG_PIXMAP_DIMENSION</text>
  <text x="475" y="851" fill="#666" font-size="10">min(requested_size, MAX_SVG_PIXMAP_DIMENSION)</text>
  <text x="475" y="863" fill="#999" font-size="9">Fallback to natural_size if conversion fails</text>
  <path d="M475,867 v12" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Create Pixmap + render -->
  <rect x="200" y="892" width="550" height="60" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <text x="475" y="910" fill="#333" font-size="11" font-weight="bold">Render SVG to Pixmap</text>
  <text x="475" y="926" fill="#666" font-size="10">transform = scale(requested / natural)</text>
  <text x="475" y="940" fill="#666" font-size="10">pixmap = tiny_skia::Pixmap::new() → resvg::render()</text>
  <path d="M475,952 v12" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Build RasterImage -->
  <rect x="200" y="977" width="550" height="50" rx="6" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
  <text x="475" y="995" fill="#333" font-size="11" font-weight="bold">Build RasterImage</text>
  <text x="475" y="1011" fill="#666" font-size="10">RasterImage { metadata, format: RGBA8, frames, bytes }</text>
  <path d="M475,1027 v12" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Load into cache -->
  <rect x="200" y="1052" width="550" height="45" rx="6" fill="url(#gSub)" stroke="#BA68C8" stroke-width="1" />
  <text x="475" y="1070" fill="#6A1B9A" font-size="11" font-weight="bold">load_image_with_keycache(PendingKey::Svg(...))</text>
  <text x="475" y="1086" fill="#666" font-size="10">Store rasterized image in ImageCache keyed by (image_id, size)</text>

  <!-- End of thread pool task -->
  <path d="M475,1097 L475,1130" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Return None (main thread) -->
  <rect x="250" y="1143" width="450" height="50" rx="24" fill="url(#gRet)" stroke="#50B86C" stroke-width="2" />
  <text x="475" y="1168" fill="#2E7D32" font-size="13" font-weight="bold" text-anchor="middle">RETURN None (async)</text>
  <text x="475" y="1185" fill="#4CAF50" font-size="10" text-anchor="middle">Rasterization pending — layout will retry on next reflow</text>

  <!-- FOOTER: Flow context -->
  <rect x="50" y="1210" width="850" height="130" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1" />
  <text x="475" y="1232" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">P4 Async Flow — How Rasterized Images Reach Layout</text>

  <rect x="70" y="1245" width="230" height="80" rx="4" fill="#E8F5E9" stroke="#50B86C" stroke-width="1" />
  <text x="185" y="1263" fill="#2E7D32" font-size="10" font-weight="bold" text-anchor="middle">make_fragments()</text>
  <text x="185" y="1278" fill="#555" font-size="9" text-anchor="middle">Calls rasterize_vector_image()</text>
  <text x="185" y="1290" fill="#555" font-size="9" text-anchor="middle">Gets None → no Fragment</text>
  <text x="185" y="1302" fill="#999" font-size="9" text-anchor="middle">→ Page reflow triggered</text>

  <path d="M300,1285 L340,1285" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <rect x="340" y="1245" width="230" height="80" rx="4" fill="#E3F2FD" stroke="#4A90D9" stroke-width="1" />
  <text x="455" y="1263" fill="#1565C0" font-size="10" font-weight="bold" text-anchor="middle">Thread Pool</text>
  <text x="455" y="1278" fill="#555" font-size="9" text-anchor="middle">resvg::render() async</text>
  <text x="455" y="1290" fill="#555" font-size="9" text-anchor="middle">load_image_with_keycache()</text>
  <text x="455" y="1302" fill="#999" font-size="9" text-anchor="middle">→ Triggers response callback</text>

  <path d="M570,1285 L610,1285" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" />

  <rect x="610" y="1245" width="250" height="80" rx="4" fill="#F3E5F5" stroke="#C45DE6" stroke-width="1" />
  <text x="735" y="1263" fill="#6A1B9A" font-size="10" font-weight="bold" text-anchor="middle">Next Reflow (P3/P4)</text>
  <text x="735" y="1278" fill="#555" font-size="9" text-anchor="middle">svg_kind_size() re-entry</text>
  <text x="735" y="1290" fill="#555" font-size="9" text-anchor="middle">Cached image available</text>
  <text x="735" y="1302" fill="#999" font-size="9" text-anchor="middle">→ Full Fragment built</text>

  <!-- LEGEND -->
  <g transform="translate(50, 1360)">
    <rect width="850" height="100" rx="6" fill="#FFF" stroke="#DDD" stroke-width="1" />
    <text x="425" y="18" fill="#333" font-size="11" font-weight="bold" text-anchor="middle">Key</text>

    <rect x="20" y="35" width="70" height="18" rx="9" fill="url(#gStart)" />
    <text x="105" y="49" fill="#555" font-size="10">Entry / Exit</text>

    <rect x="20" y="57" width="70" height="18" rx="3" fill="url(#gD)" stroke="#E6A23C" stroke-width="1" />
    <text x="105" y="71" fill="#555" font-size="10">Decision / Branch</text>

    <rect x="20" y="79" width="70" height="18" rx="3" fill="url(#gP)" stroke="#CCC" stroke-width="1" />
    <text x="105" y="93" fill="#555" font-size="10">Process Step</text>

    <rect x="320" y="35" width="24" height="14" rx="3" fill="url(#gBadgeP4)" opacity="0.85" />
    <text x="332" y="45" fill="#FFF" font-size="8" text-anchor="middle">P4</text>
    <text x="355" y="47" fill="#555" font-size="10">Pass 4 — Rasterization</text>

    <rect x="320" y="57" width="70" height="18" rx="3" fill="url(#gSub)" stroke="#BA68C8" stroke-width="1" />
    <text x="405" y="71" fill="#555" font-size="10">Keyed Cache Op</text>

    <rect x="320" y="79" width="70" height="18" rx="3" fill="url(#gAsync)" stroke="#4A90D9" stroke-width="1.5" />
    <text x="405" y="93" fill="#555" font-size="10">Async / Thread Pool</text>

    <line x1="560" y1="45" x2="600" y2="45" stroke="#50B86C" stroke-width="2" />
    <text x="610" y="49" fill="#555" font-size="10">Yes / Found</text>

    <line x1="560" y1="65" x2="600" y2="65" stroke="#D9534F" stroke-width="2" />
    <text x="610" y="69" fill="#555" font-size="10">No / Not found</text>
  </g>

  <rect x="50" y="1470" width="850" height="28" rx="4" fill="#F0FFF0" stroke="#50B86C" stroke-width="0.5" />
  <text x="475" y="1488" fill="#555" font-size="9" text-anchor="middle">All SVG_TRACE_STAGE_6 eprintln! calls originate from this function</text>

  <text x="475" y="1520" fill="#999" font-size="9" text-anchor="middle">Stage 6 — SVG Rasterization (P4) • Image Cache Thread • resvg + tiny_skia</text>
</svg>
