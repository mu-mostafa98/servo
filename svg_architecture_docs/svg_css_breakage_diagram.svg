<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 750" font-family="Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e74c3c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#27ae60"/></marker>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.12"/></filter>
  </defs>

  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3e50">CSS Cascade Breakage — Serialization Boundary</text>
  <text x="475" y="48" text-anchor="middle" font-size="11" fill="#7f8c8d">Why inline SVG elements lose CSS inheritance from their HTML ancestors</text>

  <!-- LEFT: What should happen (proper implementation) -->
  <rect x="30" y="65" width="430" height="40" rx="4" fill="#27ae60"/>
  <text x="245" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">✓ What Should Happen (Native SVG)</text>
  <text x="245" y="100" text-anchor="middle" font-size="10" fill="#d5f5e3">CSS cascade flows through SVG elements — inheritance works</text>

  <!-- HTML tree (proper) -->
  <rect x="60" y="120" width="180" height="35" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">&lt;div style="fill: green"&gt;</text>
  <text x="150" y="150" text-anchor="middle" font-size="9" fill="#555">inherit: fill → green</text>

  <line x1="150" y1="155" x2="150" y2="175" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="60" y="180" width="180" height="35" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">&lt;svg&gt; root</text>
  <text x="150" y="210" text-anchor="middle" font-size="9" fill="#555">fill: green (inherited)</text>

  <line x1="90" y1="215" x2="90" y2="235" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="210" y1="215" x2="210" y2="235" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="50" y="240" width="200" height="35" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">&lt;rect fill="red" /&gt;</text>
  <text x="150" y="270" text-anchor="middle" font-size="9" fill="#555">fill: red (own value)</text>

  <rect x="50" y="285" width="200" height="35" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">&lt;circle /&gt;</text>
  <text x="150" y="315" text-anchor="middle" font-size="9" fill="#555">fill: green (inherited!)</text>

  <!-- Green checkmarks -->
  <text x="265" y="210" font-size="18" fill="#27ae60">✓</text>
  <text x="265" y="260" font-size="18" fill="#27ae60">✓</text>
  <text x="265" y="310" font-size="18" fill="#27ae60">✓</text>

  <!-- CSS cascade explanation -->
  <rect x="60" y="340" width="190" height="70" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="155" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e8449">CSS Cascade Path</text>
  <text x="155" y="374" text-anchor="middle" font-size="9" fill="#555">div → svg → rect / circle</text>
  <text x="155" y="390" text-anchor="middle" font-size="9" fill="#555">fill inherits through SVG tree</text>
  <text x="155" y="404" text-anchor="middle" font-size="9" fill="#555">Presentational attr → CSS</text>

  <!-- ====================== -->
  <!-- RIGHT: What actually happens -->
  <rect x="490" y="65" width="430" height="40" rx="4" fill="#e74c3c"/>
  <text x="705" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">✗ What Actually Happens (Serialization)</text>
  <text x="705" y="100" text-anchor="middle" font-size="10" fill="#fadbd8">Serialization isolates SVG — CSS cascade broken at boundary</text>

  <!-- HTML tree (serialized) -->
  <rect x="520" y="120" width="180" height="35" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">&lt;div style="fill: green"&gt;</text>
  <text x="610" y="150" text-anchor="middle" font-size="9" fill="#555">fill: green (set here)</text>

  <line x1="610" y1="155" x2="610" y2="175" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Serialization barrier - BIG VISUAL BLOCK -->
  <rect x="500" y="180" width="220" height="50" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="610" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">⬌ SERIALIZATION BARRIER ⬌</text>
  <text x="610" y="214" text-anchor="middle" font-size="9" fill="#c0392b">data:image/svg+xml;base64,...</text>
  <text x="610" y="226" text-anchor="middle" font-size="9" fill="#c0392b">CSS cascade DOES NOT cross this boundary</text>

  <line x1="560" y1="230" x2="560" y2="260" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="660" y1="230" x2="660" y2="260" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="520" y="265" width="200" height="35" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">&lt;rect fill="red" /&gt;</text>
  <text x="620" y="295" text-anchor="middle" font-size="9" fill="#555">fill: red (explicit — works)</text>

  <rect x="520" y="310" width="200" height="35" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">&lt;circle /&gt;</text>
  <text x="620" y="340" text-anchor="middle" font-size="9" fill="#555">fill: default black ✗</text>

  <!-- X marks -->
  <text x="735" y="230" font-size="18" fill="#e74c3c">✗</text>
  <text x="735" y="283" font-size="18" fill="#e74c3c">✗</text>
  <text x="735" y="340" font-size="18" fill="#e74c3c">✗</text>

  <rect x="520" y="365" width="200" height="55" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="620" y="383" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">No CSS inheritance</text>
  <text x="620" y="399" text-anchor="middle" font-size="9" fill="#555">SVG children don't inherit</text>
  <text x="620" y="413" text-anchor="middle" font-size="9" fill="#555">from HTML parent document</text>

  <!-- Bottom: The full picture -->
  <rect x="30" y="440" width="890" height="55" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="475" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">Root Cause</text>
  <text x="475" y="475" text-anchor="middle" font-size="10" fill="#555">The data URL serialization breaks CSS inheritance because the SVG subtree is loaded as an independent image document.</text>
  <text x="475" y="490" text-anchor="middle" font-size="10" fill="#555">Script-side cached_serialized_data_url → Image cache loads as opaque resource → usvg re-parses with its own style context</text>

  <!-- Bottom section: Properties affected -->
  <rect x="30" y="510" width="890" height="120" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="475" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">SVG Properties Affected by Cascade Breakage</text>

  <!-- Inheritable properties list -->
  <text x="55" y="552" font-size="11" font-weight="bold" fill="#e74c3c">Inheritable (broken):</text>
  <text x="55" y="568" font-size="10" fill="#555">fill, stroke, fill-opacity, stroke-opacity, stroke-width,</text>
  <text x="55" y="584" font-size="10" fill="#555">font-family, font-size, font-style, font-weight, text-anchor,</text>
  <text x="55" y="600" font-size="10" fill="#555">dominant-baseline, visibility, pointer-events, color-interpolation</text>

  <text x="55" y="622" font-size="11" font-weight="bold" fill="#f39c12">Partial effect (applied to SVG container only):</text>
  <text x="55" y="638" font-size="10" fill="#555">clip-path, transform, opacity, overflow — work on the SVG replaced element box, but NOT on SVG children</text>

  <!-- Web fonts specific breakage -->
  <rect x="30" y="645" width="890" height="90" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="475" y="665" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Web Fonts Specific Breakage</text>
  <text x="475" y="683" text-anchor="middle" font-size="10" fill="#555">@font-face declarations in the HTML document's CSS don't apply to SVG text elements after serialization.</text>
  <text x="475" y="699" text-anchor="middle" font-size="10" fill="#555">The seralized data URL context has no mechanism to trigger font loading or associate with the document's font database.</text>
  <text x="475" y="715" text-anchor="middle" font-size="10" fill="#555">Even when fonts are loaded, resvg needs access to the same fontdb::Database — which is shared, but the CSS cascade to select the font is broken.</text>

</svg>
