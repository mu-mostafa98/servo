<!DOCTYPE html>
<html>
<head>
  <title>SVG Basic Shapes Test</title>
  <style>
    body { margin: 20px; background: white; font-family: sans-serif; }
    svg { border: 1px solid #ccc; margin-bottom: 20px; display: block; }
    h2 { margin: 10px 0; font-size: 16px; }
  </style>
</head>
<body>
  <h1>SVG Engine Phase 1 — Basic Shapes</h1>

  <h2>Rect (fill red)</h2>
  <svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="180" height="80" fill="red" />
  </svg>

  <h2>Rect (fill blue, stroke black)</h2>
  <svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="180" height="80" fill="blue" stroke="black" stroke-width="2" />
  </svg>

  <h2>Circle (fill green)</h2>
  <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="80" fill="green" />
  </svg>

  <h2>Circle (stroke only, no fill)</h2>
  <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#ff6600" stroke-width="4" />
  </svg>

  <h2>Ellipse (fill purple)</h2>
  <svg width="300" height="150" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="150" cy="75" rx="140" ry="65" fill="purple" />
  </svg>

  <h2>Rounded rect (fill #ffcc00)</h2>
  <svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="180" height="80" rx="15" ry="15" fill="#ffcc00" stroke="#333" stroke-width="2" />
  </svg>

  <h2>Line (stroke red)</h2>
  <svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
    <line x1="10" y1="10" x2="190" y2="90" stroke="red" stroke-width="2" />
  </svg>

  <h2>Combined shapes</h2>
  <svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="130" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="2" />
    <circle cx="220" cy="120" r="60" fill="#e74c3c" stroke="#c0392b" stroke-width="3" />
    <ellipse cx="80" cy="150" rx="60" ry="30" fill="#2ecc71" />
    <line x1="10" y1="180" x2="290" y2="10" stroke="#f39c12" stroke-width="2" />
  </svg>
</body>
</html>
