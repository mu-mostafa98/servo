<!DOCTYPE html>
<html>
<body>
  <h3>1. No transform (baseline):</h3>
  <svg width="200" height="80" style="border:1px solid red">
    <rect x="10" y="10" width="50" height="50" style="fill: red"/>
  </svg>

  <h3>2. scale(1.5) — rect becomes 75×75:</h3>
  <svg width="200" height="120" style="border:1px solid blue">
    <rect x="10" y="10" width="50" height="50" style="fill: blue" transform="scale(1.5)"/>
  </svg>

  <h3>3. scale(0.5) — rect becomes 25×25:</h3>
  <svg width="200" height="80" style="border:1px solid green">
    <rect x="10" y="10" width="50" height="50" style="fill: green" transform="scale(0.5)"/>
  </svg>
</body>
</html>
