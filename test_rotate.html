<!DOCTYPE html>
<html>
<body>
  <h3>1. No transform (baseline):</h3>
  <svg width="200" height="100" style="border:1px solid red">
    <rect x="30" y="20" width="50" height="30" style="fill: red"/>
  </svg>

  <h3>2. rotate(45) — around (0,0):</h3>
  <svg width="200" height="150" style="border:1px solid blue">
    <rect x="30" y="20" width="50" height="30" style="fill: blue" transform="rotate(45)"/>
  </svg>

  <h3>3. rotate(45, 55, 35) — around center of the rect:</h3>
  <svg width="200" height="150" style="border:1px solid green">
    <rect x="30" y="20" width="50" height="30" style="fill: green" transform="rotate(45, 55, 35)"/>
  </svg>
</body>
</html>
