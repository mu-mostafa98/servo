<!DOCTYPE html>
<html>
<body>
<h4>1. CSS inheritance: Text should be green</h4>
<div style="fill: green">
<svg width=200 height=30><text y=20>Green text?</text></svg>
</div>

<h4>2. Web fonts: Text should use Roboto</h4>
<svg width=400 height=40>
<style>@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap');.f{font-family:'Roboto'}</style>
<text y=25 class=f>Roboto font?</text>
</svg>

<h4>3. Crisp transform: Circle should be sharp</h4>
<div style="transform:scale(4)">
<svg width=20 height=20><circle cx=10 cy=10 r=8 fill=green></circle></svg>
</div>
</body>
</html>
