<!DOCTYPE html>
<html>
<head><title>Phase 1 SVG Test</title></head>
<body>
  <h1>Phase 1 — SVG Basic Shapes</h1>

  <h2>Filled Rectangles</h2>
  <svg width="400" height="100">
    <rect x="10" y="10" width="80" height="80" fill="red"/>
    <rect x="110" y="10" width="80" height="80" fill="green"/>
    <rect x="210" y="10" width="80" height="80" fill="blue"/>
    <rect x="310" y="10" width="80" height="80" fill="none" stroke="black" stroke-width="2"/>
  </svg>

  <h2>Rounded Rectangles</h2>
  <svg width="400" height="100">
    <rect x="10" y="10" width="80" height="80" rx="10" ry="10" fill="orange"/>
    <rect x="110" y="10" width="80" height="80" rx="20" ry="20" fill="purple"/>
    <rect x="210" y="10" width="80" height="80" rx="30" ry="15" fill="pink"/>
  </svg>

  <h2>Circles</h2>
  <svg width="400" height="120">
    <circle cx="50" cy="50" r="40" fill="red"/>
    <circle cx="150" cy="50" r="40" fill="green" fill-opacity="0.5"/>
    <circle cx="250" cy="50" r="40" fill="none" stroke="blue" stroke-width="4"/>
    <circle cx="350" cy="50" r="40" fill="yellow" stroke="black" stroke-width="3"/>
  </svg>

  <h2>Ellipses</h2>
  <svg width="400" height="100">
    <ellipse cx="80" cy="50" rx="60" ry="30" fill="red"/>
    <ellipse cx="220" cy="50" rx="60" ry="30" fill="none" stroke="green" stroke-width="3"/>
    <ellipse cx="350" cy="50" rx="40" ry="40" fill="blue" fill-opacity="0.3"/>
  </svg>

  <h2>Lines</h2>
  <svg width="400" height="100">
    <line x1="10" y1="50" x2="100" y2="50" stroke="red" stroke-width="4"/>
    <line x1="130" y1="10" x2="130" y2="90" stroke="green" stroke-width="6"/>
    <line x1="170" y1="10" x2="250" y2="90" stroke="blue" stroke-width="3"/>
    <line x1="280" y1="90" x2="360" y2="10" stroke="black" stroke-width="2"/>
  </svg>

  <h2>Stroke Variants</h2>
  <svg width="400" height="120">
    <rect x="10" y="10" width="80" height="80" fill="lightgray" stroke="red" stroke-width="8"/>
    <circle cx="160" cy="50" r="40" fill="lightgray" stroke="green" stroke-width="8"/>
    <ellipse cx="290" cy="50" rx="60" ry="35" fill="lightgray" stroke="blue" stroke-width="6"/>
  </svg>

  <h2>Lines (Stroke + Opacity)</h2>
  <svg width="400" height="60">
    <line x1="10" y1="30" x2="390" y2="30" stroke="red" stroke-width="2" opacity="0.5"/>
  </svg>
</body>
</html>
