<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG Engine PR #1 — Tree Structure & Traversal Test</title>
</head>
<body>

<h2>SVG Engine PR #1 — Tree Structure &amp; Traversal</h2>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" id="root">

  <!-- ============================================================
       1. SHAPES — one of each type (tag name logged, geometry TODO)
       ============================================================ -->
  <rect id="shape-rect" />
  <circle id="shape-circle" />
  <ellipse id="shape-ellipse" />
  <line id="shape-line" />
  <polyline id="shape-polyline" />
  <polygon id="shape-polygon" />
  <path id="shape-path" />

  <!-- ============================================================
       2. GROUP — shapes nested inside g
       ============================================================ -->
  <g id="group-shapes">
    <rect id="g-rect" />
    <circle id="g-circle" />
  </g>

  <!-- ============================================================
       3. NESTED SVG
       ============================================================ -->
  <svg id="nested-svg">
    <ellipse id="nested-ellipse" />
  </svg>

  <!-- ============================================================
       4. DEFS — children skipped, used via use
       ============================================================ -->
  <defs id="defs-container">
    <rect id="defs-rect" />
  </defs>

  <use id="use-defs-rect" href="#defs-rect" />

  <!-- ============================================================
       5. SYMBOL — never rendered directly, only via use
       ============================================================ -->
  <symbol id="my-symbol">
    <polygon id="symbol-polygon" />
  </symbol>

  <use id="use-symbol" href="#my-symbol" />

  <!-- ============================================================
       6. TEXT — content extraction
       ============================================================ -->
  <text id="text-basic">Hello SVG</text>
  <text id="text-tspan"><tspan>Nested</tspan> tail</text>

  <!-- ============================================================
       7. IMAGE — href extraction
       ============================================================ -->
  <image id="img-href" href="test.png" />
  <image id="img-xlink" xlink:href="test2.png" />

</svg>

</body>
</html>
