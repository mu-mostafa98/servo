<!DOCTYPE html>
<html>
<head>
  <title>SVG Engine Test</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #fff; }
    h2 { margin: 20px 0 5px; font-size: 16px; }
    svg { border: 1px solid #ccc; margin-bottom: 20px; display: block; }
  </style>
</head>
<body>
  <h1>SVG Engine Shape Test</h1>

  <h2>Rect — fill="red"</h2>
  <svg width="200" height="50">
    <rect x="10" y="10" width="100" height="30" fill="red"/>
  </svg>

  <h2>Circle — fill="blue"</h2>
  <svg width="100" height="100">
    <circle cx="50" cy="50" r="40" fill="blue"/>
  </svg>

  <h2>Ellipse — fill="green"</h2>
  <svg width="200" height="100">
    <ellipse cx="100" cy="50" rx="80" ry="40" fill="green"/>
  </svg>

  <h2>Line — stroke="black"</h2>
  <svg width="200" height="50">
    <line x1="10" y1="25" x2="190" y2="25" stroke="black" stroke-width="3"/>
  </svg>

  <h2>Polygon — fill="orange"</h2>
  <svg width="200" height="100">
    <polygon points="100,10 190,90 10,90" fill="orange"/>
  </svg>

  <h2>Polyline — stroke="purple"</h2>
  <svg width="200" height="100">
    <polyline points="10,90 50,10 90,90 130,10 170,90" stroke="purple" stroke-width="3" fill="none"/>
  </svg>

  <h2>Path — fill="none" stroke="red"</h2>
  <svg width="200" height="100">
    <path d="M 10 80 C 40 10, 65 10, 95 80 S 150 10, 190 80" fill="none" stroke="red" stroke-width="3"/>
  </svg>

  <h2>Group + transform</h2>
  <svg width="200" height="100">
    <g transform="translate(50, 25)">
      <rect x="0" y="0" width="40" height="40" fill="teal"/>
      <circle cx="60" cy="20" r="20" fill="coral"/>
    </g>
  </svg>
</body>
</html>
