<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG Engine — Phase Tests</title>
<style>
  body { background: #222; color: #ccc; font-family: sans-serif; margin: 20px; }
  h2 { color: #fff; border-bottom: 2px solid #555; padding-bottom: 5px; margin-top: 30px; }
  h3 { color: #aaa; margin: 15px 0 5px; }
  svg { background: #333; margin: 5px; border: 1px solid #555; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .caption { color: #aaa; font-size: 12px; margin: 2px 0 10px; }
</style>
</head>
<body>

<h2>Phase 1a — Rect + Fill</h2>

<h3>Solid fill</h3>
<svg width="200" height="50">
  <rect x="10" y="10" width="180" height="30" fill="red"/>
</svg>

<h3>Rounded corners</h3>
<svg width="200" height="60">
  <rect x="10" y="10" width="180" height="40" rx="10" ry="10" fill="blue"/>
</svg>

<h3>Multiple rects</h3>
<svg width="200" height="100">
  <rect x="10" y="10" width="50" height="30" fill="#ff0000"/>
  <rect x="70" y="30" width="50" height="30" fill="#00ff00"/>
  <rect x="130" y="50" width="50" height="30" fill="#0000ff"/>
</svg>

<h3>With opacity</h3>
<svg width="200" height="60">
  <rect x="10" y="10" width="180" height="40" fill="rgba(255,0,0,0.5)"/>
  <rect x="40" y="10" width="180" height="40" fill="rgba(0,0,255,0.5)"/>
</svg>

<h3>CSS style attributes</h3>
<svg width="200" height="60">
  <rect x="10" y="10" width="80" height="40" style="fill: orange;"/>
  <rect x="110" y="10" width="80" height="40" style="fill: purple; fill-opacity: 0.7;"/>
</svg>

<!-- ========== Phase 2 — Stroke ========== -->

<h2>Phase 2 — Stroke</h2>

<h3>Rect with stroke</h3>
<svg width="200" height="50">
  <rect x="10" y="10" width="180" height="30" fill="red" stroke="black" stroke-width="2"/>
</svg>

<h3>Rect with fill + stroke, rounded corners</h3>
<svg width="200" height="60">
  <rect x="10" y="10" width="180" height="40" rx="10" ry="10" fill="#4488ff" stroke="white" stroke-width="3"/>
</svg>

<h3>Stroke width variations</h3>
<svg width="200" height="80">
  <rect x="10" y="10" width="40" height="25" fill="#ff6666" stroke="#000" stroke-width="1"/>
  <rect x="60" y="10" width="40" height="25" fill="#66ff66" stroke="#000" stroke-width="3"/>
  <rect x="110" y="10" width="40" height="25" fill="#6666ff" stroke="#000" stroke-width="5"/>
  <rect x="160" y="10" width="30" height="25" fill="#ffff66" stroke="#000" stroke-width="8"/>
</svg>

<h3>Stroke with opacity</h3>
<svg width="200" height="60">
  <rect x="10" y="10" width="180" height="40" fill="red" stroke="black" stroke-width="6" stroke-opacity="0.3"/>
</svg>

<h3>Stroke with CSS style attribute</h3>
<svg width="200" height="50">
  <rect x="10" y="10" width="180" height="30" style="fill: #ff8800; stroke: #fff; stroke-width: 4;"/>
</svg>

<h3>Multiple rects with stroke</h3>
<svg width="200" height="100">
  <rect x="10" y="10" width="50" height="30" fill="#ff0000" stroke="#000" stroke-width="2"/>
  <rect x="75" y="25" width="50" height="30" fill="#00ff00" stroke="#000" stroke-width="2"/>
  <rect x="140" y="40" width="50" height="30" fill="#0000ff" stroke="#000" stroke-width="2"/>
</svg>

<!-- ========== Phase 3 — Circle + Ellipse (will be added next) ========== -->

</body>
</html>
